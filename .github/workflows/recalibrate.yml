name: recalibrate

# Apply an ACCEPTED pace recalibration from the portal (Runna-style: the
# engine proposes via fitness.json pace_insights, the athlete accepts, this
# applies it). Deterministic — no Claude. Re-targets future weeks only.
on:
  workflow_dispatch:
    inputs:
      delta:
        description: "VDOT change, e.g. 0.5 or -0.5"
        required: true
      force:
        description: "override rate-limit/readiness guards (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Recalibrate paces
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          paceforge recalibrate --delta "${{ inputs.delta }}" $ARGS
          paceforge plan-md

      - name: Commit updated plan
        run: |
          git config user.name "paceforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/plan.json plan.md
          git commit -m "plan: pace recalibration ${{ inputs.delta }} VDOT" || echo "nothing to commit"
          git push
