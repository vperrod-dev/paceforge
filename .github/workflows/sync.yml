name: sync

# Pull Garmin metrics + activities into data/*.json. Runs daily and on demand.
on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Sync from Garmin
        env:
          PACEFORGE_GARMIN_EMAIL: ${{ secrets.PACEFORGE_GARMIN_EMAIL }}
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: paceforge sync

      # if: always() — the token on disk is re-dumped inside sync() before most
      # failure modes; refreshing it even on failure breaks the self-perpetuating
      # staleness loop (failed sync -> never-refreshed token -> failed sync).
      - name: Refresh GARMIN_TOKEN secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ACTIONS_PAT not set — skipping token refresh (set it to enable self-refresh)."
            exit 0
          fi
          paceforge export-token | gh secret set GARMIN_TOKEN --repo "$GITHUB_REPOSITORY" \
            || echo "no token on disk to export"

      # if: always() — a failed/partial run still writes data/sync-status.json, and
      # committing it is what lets the site show "sync failing since <date>".
      - name: Commit data if changed
        if: always()
        run: |
          git config user.name "paceforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily Garmin sync"
          git push

      - name: Open sync-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label sync-failure --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            body=$(printf '%s\n\n%s' \
              "The scheduled Garmin sync failed. See the run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "Check data/sync-status.json for the error and failed endpoints. If the token expired (~yearly), run \`paceforge login\` locally and update the GARMIN_TOKEN secret.")
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Garmin sync is failing" \
              --label sync-failure \
              --body "$body"
          else
            echo "sync-failure issue already open — not duplicating."
          fi

      - name: Close sync-failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label sync-failure --state open --json number --jq '.[].number' \
            | xargs -r -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" --comment "Sync recovered in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
