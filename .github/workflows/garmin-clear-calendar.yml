name: garmin-clear-calendar

# Remove ALL scheduled Garmin-calendar workouts from today onwards (past
# untouched). Deterministic — no Claude. Defaults to a dry-run (list only);
# set dry_run=false to actually delete. Uses the CI GARMIN_TOKEN secret, so it
# needs no interactive login.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only, don't delete"
        type: boolean
        default: true
      days:
        description: "look-ahead window (days)"
        required: false
        default: "400"

permissions:
  contents: write

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Clear Garmin calendar from today onwards
        env:
          PACEFORGE_GARMIN_EMAIL: ${{ secrets.PACEFORGE_GARMIN_EMAIL }}
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
          # inputs via env, not inline interpolation — no shell injection
          DAYS: ${{ inputs.days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--days $DAYS"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          paceforge garmin-clear-calendar $ARGS

      - name: Commit cleared workout ids
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "paceforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/plan.json || true
          git commit -m "chore: clear future Garmin workout ids after calendar wipe" || echo "nothing to commit"
          git push
