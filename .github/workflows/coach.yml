name: coach

# Claude as the coach. Three ways in:
#   - weekly cron (Monday) → writes week-review.md
#   - workflow_dispatch → type an instruction ("reschedule Thursday's tempo to Saturday")
#   - a "coach"-labelled GitHub issue → the UI's Generate/adapt button opens one;
#     the issue body is the instruction. Gated to issues opened by the repo owner
#     (the repo is public) so nobody else can drive Claude with write access.
# Runs on your Claude subscription token (CLAUDE_CODE_OAUTH_TOKEN) — no LLM API bill.
on:
  schedule:
    - cron: "19 7 * * 1"  # Monday 07:19 UTC — weekly review (off the top of the hour; GitHub drops many :00 cron runs under load)
  workflow_dispatch:
    inputs:
      instruction:
        description: "What should the coach do?"
        required: false
        default: "Review last week and write week-review.md."
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write  # claude-code-action mints its GitHub App token via OIDC

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  coach:
    # cron + manual always run; issue-triggered only for coach-labelled issues
    # opened by the repo owner (prevents prompt-injection from public users).
    if: >
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'coach'))
    runs-on: ubuntu-latest
    env:
      PACEFORGE_GARMIN_EMAIL: ${{ secrets.PACEFORGE_GARMIN_EMAIL }}
      GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
      # Untrusted-ish text via env (not inlined into the prompt expression).
      COACH_TASK: >-
        ${{ github.event.inputs.instruction
            || github.event.issue.body
            || 'Review last week and write week-review.md.' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Sync from Garmin
        # Non-fatal (the coach can work from existing data), but surfaced as a
        # run warning — sync-status.json records the truth either way.
        run: paceforge sync || echo "::warning::Garmin sync failed — coach is running on existing data"

      - name: Run coach
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # COACH_TASK is issue/dispatch-derived text — Bash is scoped to the
          # commands the coach skill actually uses (paceforge, python, git),
          # not a blanket grant.
          claude_args: '--allowedTools "Bash(paceforge:*),Bash(python:*),Bash(python3:*),Bash(git:*),Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite"'
          prompt: |
            Use the coach skill in .claude/skills/coach/.
            The athlete's request is in the COACH_TASK environment variable — read it and do it.
            Then run `paceforge validate`, regenerate plan.md if the plan changed, and
            commit any changes to data/, plan.md, and week-review.md and push to master.

      # Weekly review headline → phone (Telegram). Skipped if the secrets are unset.
      - name: Notify weekly review
        if: github.event_name == 'schedule'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG_TOKEN/TG_CHAT_ID not set — skipping weekly review notification."
            exit 0
          fi
          body=$(head -c 600 week-review.md | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' | head -c 3900) || true
          text=$(printf '<b>📊 PaceForge weekly review</b>\n<pre>%s</pre>' "$body")
          api="https://api.telegram.org/bot$TG_TOKEN/sendMessage"
          resp=$(curl -s "$api" \
            --data-urlencode "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true) || true
          # A malformed-HTML rejection must not silently drop the review: resend as plain text.
          case "$resp" in
            *'"ok":true'*) echo "Telegram weekly review sent." ;;
            *) echo "Telegram HTML send failed ($resp) — retrying without parse_mode."
               curl -s "$api" \
                 --data-urlencode "chat_id=$TG_CHAT_ID" \
                 --data-urlencode "text=$text" \
                 -d disable_web_page_preview=true >/dev/null || true ;;
          esac

      - name: Acknowledge the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "🤖 Coach run complete — see the latest commits to \`data/\`, \`plan.md\`, and \`week-review.md\`. The site redeploys automatically."
          gh issue close "${{ github.event.issue.number }}"
