name: daily

# Coach's morning read for the landing page: after the morning sync, write
# data/daily-brief.json (body state, today's session, recent-days synthesis,
# focus points). The VM runner's `daily` job is the live implementation; this
# workflow is the GitHub-rollback twin. Guarded to mornings so the midday and
# evening syncs don't rewrite the brief.
on:
  workflow_run:
    workflows: [sync]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # claude-code-action mints its GitHub App token via OIDC

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Morning window only (Europe/Dublin)
        id: gate
        run: |
          hour=$(TZ=Europe/Dublin date +%H)
          echo "morning=$([ "$hour" -lt 10 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Write the daily brief with the coach
        if: steps.gate.outputs.morning == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(git:*),Read,Write,Glob,Grep,TodoWrite"'
          prompt: |
            Use the coach skill in .claude/skills/coach/ — the "Daily brief" section.
            Write data/daily-brief.json for today per that section's contract, then
            commit it and push to master.
