name: save-rpe

# Persist one session-RPE entry from the web UI into data/rpe.json. Same
# dispatch-and-commit path as save-benchmarks: the user's token only needs
# actions:write; the commit uses GITHUB_TOKEN. sRPE load for HR-less
# strength/HYROX sessions depends on these entries.
on:
  workflow_dispatch:
    inputs:
      data:
        description: 'One RPE entry: {"activity_id", "date", "rpe", "duration_min", "notes"}'
        required: true

permissions:
  contents: write

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upsert into data/rpe.json (validated)
        env:
          DATA: ${{ github.event.inputs.data }}
        run: |
          # Parse via env (never inline untrusted input); validate range + shape.
          python3 - <<'EOF'
          import json, os

          entry = json.loads(os.environ["DATA"])
          rpe = int(entry["rpe"])
          assert 1 <= rpe <= 10, "rpe must be 1-10"
          aid = entry.get("activity_id")
          clean = {
              "activity_id": int(aid) if aid is not None else None,
              "date": str(entry["date"])[:10],
              "rpe": rpe,
              "duration_min": float(entry["duration_min"]) if entry.get("duration_min") else None,
              "notes": (str(entry.get("notes") or "")[:500] or None),
              "source": "web",
          }
          path = "data/rpe.json"
          try:
              entries = json.load(open(path)).get("entries") or []
          except FileNotFoundError:
              entries = []
          if clean["activity_id"] is not None:
              entries = [e for e in entries if e.get("activity_id") != clean["activity_id"]]
          else:
              entries = [e for e in entries
                         if e.get("activity_id") is not None or e.get("date") != clean["date"]]
          entries.append(clean)
          entries.sort(key=lambda e: str(e.get("date") or ""))
          json.dump({"entries": entries}, open(path, "w"), indent=2)
          EOF

      - name: Commit
        run: |
          git config user.name "paceforge-bot"
          git config user.email "bot@paceforge.local"
          git add data/rpe.json
          git diff --cached --quiet || git commit -m "data: log session RPE"
          git push
