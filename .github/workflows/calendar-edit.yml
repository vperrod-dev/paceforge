name: calendar-edit

# Reschedule or delete one plan session from the portal calendar and sync it to
# the Garmin calendar. Deterministic — no Claude. Commits the updated plan.json;
# the Pages build regenerates the portal's view.
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "Workout.session_id from plan.json"
        required: true
      action:
        description: "reschedule or delete"
        required: true
        default: "reschedule"
      new_date:
        description: "new date YYYY-MM-DD (reschedule only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Edit calendar + sync Garmin
        env:
          PACEFORGE_GARMIN_EMAIL: ${{ secrets.PACEFORGE_GARMIN_EMAIL }}
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
          # inputs via env, not inline interpolation — no shell injection
          SESSION_ID: ${{ inputs.session_id }}
          EDIT_ACTION: ${{ inputs.action }}
          NEW_DATE: ${{ inputs.new_date }}
        run: |
          ARGS=""
          if [ -n "$NEW_DATE" ]; then ARGS="--new-date $NEW_DATE"; fi
          paceforge calendar-edit "$SESSION_ID" "$EDIT_ACTION" $ARGS

      - name: Commit updated plan
        env:
          SESSION_ID: ${{ inputs.session_id }}
          EDIT_ACTION: ${{ inputs.action }}
        run: |
          git config user.name "paceforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/plan.json
          git commit -m "calendar: $EDIT_ACTION session $SESSION_ID" || echo "nothing to commit"
          git push
