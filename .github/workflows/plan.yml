name: plan

# Create or reassess the athlete's RUNNING-only plan. Triggered from the portal
# (Create Plan / Reassess buttons) via workflow_dispatch. Deterministic — the
# engine scaffolds a valid, periodised, running-only plan and commits it every
# time. (Claude enrichment can be layered on later; claude-code-action was
# hitting its turn limit and silently committing nothing.)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "create or reassess"
        required: true
        default: "create"
      event_type:
        description: "5K, 10K, HALF_MARATHON, MARATHON or HYROX"
        required: false
        default: "HYROX"
      target_date:
        description: "race date YYYY-MM-DD"
        required: false
        default: ""
      days:
        description: "comma-separated training days"
        required: false
        default: "tuesday,thursday,saturday,sunday"
      level:
        description: "beginner, intermediate or advanced"
        required: false
        default: "intermediate"
      goal_time:
        description: "goal finish time in seconds (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Build / reassess plan (running-only)
        run: |
          set -e
          if [ "${{ inputs.mode }}" = "reassess" ]; then
            paceforge adapt || echo "::warning::adapt made no changes"
          else
            DAYS=$(echo "${{ inputs.days }}" | tr -d ' ')
            ARGS="--goal ${{ inputs.event_type }} --date ${{ inputs.target_date }} --level ${{ inputs.level }} --days $DAYS"
            if [ -n "${{ inputs.goal_time }}" ]; then ARGS="$ARGS --target-time ${{ inputs.goal_time }}"; fi
            paceforge plan $ARGS
            python -c "import json; p=json.load(open('data/plan.json')); p['accepted']=True; json.dump(p, open('data/plan.json','w'), indent=2, default=str)"
          fi
          paceforge validate || echo "::warning::plan has validation notes (committed anyway)"

      - name: Commit plan
        run: |
          git config user.name "paceforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/plan.json
          git commit -m "plan: ${{ inputs.event_type }} for ${{ inputs.target_date }} (${{ inputs.level }})" || echo "no change"
          git push
