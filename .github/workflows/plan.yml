name: plan

# Create or reassess the athlete's RUNNING-only plan. Triggered from the portal
# (Create Plan / Reassess buttons) via workflow_dispatch. Deterministic — the
# engine scaffolds a valid, periodised, running-only plan and commits it every
# time. (Claude enrichment can be layered on later; claude-code-action was
# hitting its turn limit and silently committing nothing.)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "create or reassess"
        required: true
        default: "create"
      event_type:
        description: "5K, 10K, HALF_MARATHON, MARATHON or HYROX"
        required: false
        default: "HYROX"
      target_date:
        description: "race date YYYY-MM-DD"
        required: false
        default: ""
      days:
        description: "comma-separated training days"
        required: false
        default: "tuesday,thursday,saturday,sunday"
      level:
        description: "beginner, intermediate or advanced"
        required: false
        default: "intermediate"
      goal_time:
        description: "goal finish time in seconds (optional)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write  # claude-code-action mints its token via OIDC

concurrency:
  group: paceforge-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Build / reassess plan (running-only)
        run: |
          set -e
          if [ "${{ inputs.mode }}" = "reassess" ]; then
            paceforge adapt || echo "::warning::adapt made no changes"
          else
            DAYS=$(echo "${{ inputs.days }}" | tr -d ' ')
            ARGS="--goal ${{ inputs.event_type }} --date ${{ inputs.target_date }} --level ${{ inputs.level }} --days $DAYS"
            if [ -n "${{ inputs.goal_time }}" ]; then ARGS="$ARGS --target-time ${{ inputs.goal_time }}"; fi
            paceforge plan $ARGS
            python -c "import json; p=json.load(open('data/plan.json')); p['accepted']=True; json.dump(p, open('data/plan.json','w'), indent=2, default=str)"
          fi
          paceforge validate || echo "::warning::plan has validation notes (committed anyway)"

      - name: Commit scaffold (safety net — always a plan)
        run: |
          git config user.name "paceforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/plan.json
          git commit -m "plan: ${{ inputs.event_type }} for ${{ inputs.target_date }} (${{ inputs.level }})" || echo "no change"
          git push

      # AI coach drives variety + experience on top of the scaffold. High turn
      # budget (the old failure was ~28 turns → is_error, committed nothing) and
      # continue-on-error so a failure never leaves the athlete plan-less: the
      # scaffold above is already committed.
      - name: Enrich with AI coach
        if: ${{ inputs.mode == 'create' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 200 --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep"'
          prompt: |
            data/plan.json already holds a valid, committed, running-only
            ${{ inputs.event_type }} plan (scaffolded + accepted). The engine now owns
            session variety, progression, and structure — do NOT rewrite sessions,
            reshuffle variants, rebuild the plan, or change the event, target date,
            training days, or paces. Your job is the athlete-specific judgement layer:
            - Write a specific coaching note on every workout: what today's session does
              for THIS athlete (readiness, RPE history, cadence flag, HYROX load on
              off-days) — never restate what the session obviously is.
            - Adapt to signals in data/profile.json (low training_readiness or
              hrv_status "Low" → swap a quality day for easy that week).
            - Fill the plan-level rationale and tips from data/profile.json evidence.
            Keep every workout a running type (never hyrox_mixed / cross_training) and
            keep "accepted": true. Then run `paceforge validate` (must pass), and commit
            data/plan.json (and plan.md if you regenerate it) and push to master. If you
            run low on turns, commit what you have rather than stopping.
