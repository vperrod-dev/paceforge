function formatMarkdown(md) {
  let s = escHtml(md)
    .replace(/^#{1,3} (.*)$/gm, '<div style="font-weight:700;color:var(--text);margin:12px 0 4px">$1</div>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" class="btn-link">$1</a>');
  // Tables: consecutive |...| lines (separator row dropped)
  s = s.replace(/(?:^\|.+\|\s*$\n?){2,}/gm, block => {
    const rows = block.trim().split('\n').filter(r => !/^\|[\s\-:|]+\|$/.test(r));
    const tr = rows.map((r, i) => '<tr>' + r.replace(/^\||\|$/g, '').split('|')
      .map(c => `<${i ? 'td' : 'th'} style="padding:4px 8px;border-bottom:1px solid var(--border-s);text-align:left">${c.trim()}</${i ? 'td' : 'th'}>`).join('') + '</tr>').join('');
    return `<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:.84rem;margin:8px 0">${tr}</table></div>`;
  });
  // Lists incl. one nesting level (2+ leading spaces)
  s = s.replace(/^ {2,}[-*] (.*)$/gm, '<li class="md-sub">$1</li>')
       .replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>')
       .replace(/(?:<li[^>]*>[\s\S]*?<\/li>\n?)+/g, m =>
         '<ul style="margin:4px 0 10px 18px">' + m.replace(/<li class="md-sub">([\s\S]*?)<\/li>/g,
           '<ul style="margin:2px 0 2px 16px"><li>$1</li></ul>') + '</ul>');
  return s.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
}

// Per-km area chart (inline SVG). invert=true puts the smallest value on top —
// used for pace, where fewer seconds = faster.
function miniChart(values, { color, invert = false, fmt = v => v, height = 140, band = null } = {}) {
  const clean = values.filter(v => v != null && !isNaN(v));
  if (clean.length < 2) return '<div style="color:var(--text-3);font-size:.82rem;padding:8px 0">Not enough split data.</div>';
  const W = 820, H = height, pl = 44, pr = 12, pt = 12, pb = 8, iw = W - pl - pr, ih = H - pt - pb;
  let mn = Math.min(...clean), mx = Math.max(...clean);
  if (band) { mn = Math.min(mn, band[0]); mx = Math.max(mx, band[1]); }  // keep the band in view
  const range = (mx - mn) || 1, n = values.length;
  const yOf = v => pt + (invert ? (v - mn) / range : 1 - (v - mn) / range) * ih;
  const pts = values.map((v, i) => v == null || isNaN(v) ? null : { x: pl + (i / Math.max(n - 1, 1)) * iw, y: yOf(v) }).filter(Boolean);
  let path = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const mxd = (pts[i - 1].x + pts[i].x) / 2;
    path += ` C${mxd.toFixed(1)},${pts[i - 1].y.toFixed(1)} ${mxd.toFixed(1)},${pts[i].y.toFixed(1)} ${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;
  }
  const gid = 'cg' + Math.random().toString(36).slice(2, 7);
  const top = invert ? mn : mx, bot = invert ? mx : mn;
  let bandSvg = '';
  if (band) {
    const yA = yOf(band[1]), yB = yOf(band[0]), yTop = Math.min(yA, yB), hgt = Math.abs(yB - yA);
    bandSvg = `<rect x="${pl}" y="${yTop.toFixed(1)}" width="${iw}" height="${Math.max(hgt, 1).toFixed(1)}" fill="var(--emerald)" opacity=".13"/>
      <line x1="${pl}" x2="${pl + iw}" y1="${yA.toFixed(1)}" y2="${yA.toFixed(1)}" stroke="var(--emerald)" stroke-width="1" stroke-dasharray="5 4" opacity=".55"/>
      <line x1="${pl}" x2="${pl + iw}" y1="${yB.toFixed(1)}" y2="${yB.toFixed(1)}" stroke="var(--emerald)" stroke-width="1" stroke-dasharray="5 4" opacity=".55"/>
      <text x="${pl + iw - 3}" y="${(yTop + 11).toFixed(1)}" text-anchor="end" fill="var(--emerald)" font-size="10" font-family="var(--font-m)" opacity=".85">efficient: ${fmt(band[0])}–${fmt(band[1])}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".26"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${bandSvg}
    <path d="${path} L${pts[pts.length - 1].x.toFixed(1)},${pt + ih} L${pts[0].x.toFixed(1)},${pt + ih} Z" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="3" y="${pt + 9}" fill="var(--text-3)" font-size="11" font-family="var(--font-m)">${fmt(top)}</text>
    <text x="3" y="${pt + ih}" fill="var(--text-3)" font-size="11" font-family="var(--font-m)">${fmt(bot)}</text>
  </svg>`;
}

const ZONE_COLORS = ['#3FB6E0', '#22C55E', '#EAB308', '#F97316', '#EF4444']; // Z1..Z5
const ZONE_LABELS = ['Recovery', 'Easy', 'Aerobic', 'Threshold', 'Max'];

// Time-in-HR-zone as labelled horizontal bars. Works for any activity with hr_zones.
function hrZoneBars(zones) {
  const z = (zones || []).filter(x => x && x.secs);
  if (!z.length) return '';
  const total = z.reduce((a, b) => a + (b.secs || 0), 0) || 1;
  const lowOf = {}; (zones || []).forEach(x => { if (x && x.low != null) lowOf[x.zone] = x.low; });
  return `<div class="zbars">` + z.map(x => {
    const pct = Math.round((x.secs / total) * 100);
    const c = ZONE_COLORS[(x.zone || 1) - 1] || 'var(--text-3)';
    const nextLow = lowOf[(x.zone || 0) + 1];
    const bpm = x.low != null ? `<span class="zbpm">${x.low}${nextLow ? '–' + (nextLow - 1) : '+'} bpm</span>` : '';
    return `<div class="zrow"><div class="zlbl">Z${x.zone} <span>${ZONE_LABELS[(x.zone || 1) - 1] || ''}</span>${bpm}</div>
      <div class="ztrack"><div class="zfill" style="width:${Math.max(pct, 1)}%;background:${c}"></div></div>
      <div class="zval">${Math.round(x.secs / 60)}m · ${pct}%</div></div>`;
  }).join('') + `</div>`;
}

// Histogram of values (e.g. per-km paces) into bins — the "distribution" view.
function paceHistogram(values, { fmt = v => v } = {}) {
  const vals = values.filter(v => v != null && !isNaN(v));
  if (vals.length < 3) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const BINS = Math.min(10, Math.max(5, Math.round(vals.length / 2)));
  const w = span / BINS, counts = new Array(BINS).fill(0);
  vals.forEach(v => { counts[Math.min(BINS - 1, Math.floor((v - mn) / w))]++; });
  const peak = Math.max(...counts) || 1;
  return `<div class="hist">` + counts.map((c, i) =>
    `<div class="hbar" title="${fmt(mn + i * w)} (${c})"><div class="hfill" style="height:${Math.round((c / peak) * 100)}%"></div></div>`
  ).join('') + `</div><div class="hist-x"><span>${fmt(mn)}</span><span>${fmt(mx)}</span></div>`;
}

function matchedWorkout(plan, activityId) {
  if (!plan || !plan.weeks) return null;
  const idStr = String(activityId);
  for (const wk of plan.weeks) for (const wo of (wk.workouts || []))
    if ((wo.matched_activity_ids || []).map(String).includes(idStr)) return { wo, week: wk };
  return null;
}

// Planned sessions this activity could be pinned to: unmatched, non-rest, within a
// week either way (you sometimes do a session days off its slot).
function linkCandidates(plan, act) {
  const day = String(act.start_time || '').slice(0, 10);
  if (!plan || !plan.weeks || !day) return [];
  const out = [];
  for (const wk of plan.weeks) for (const wo of (wk.workouts || [])) {
    if (!wo.scheduled_date || wo.workout_type === 'rest' || !wo.session_id) continue;
    if ((wo.matched_activity_ids || []).length) continue;
    const off = (new Date(wo.scheduled_date + 'T00:00:00') - new Date(day + 'T00:00:00')) / 86400000;
    if (Math.abs(off) <= 7) out.push(wo);
  }
  return out.sort((a, b) => String(a.scheduled_date).localeCompare(String(b.scheduled_date)));
}

// Manual match control. Link pins the activity (manual_activity_ids) so no future
// sync can re-assign it; unmatch detaches AND excludes it, so the matcher can't
// silently put it back. Bike rides are app-side, not Garmin activities — the
// link/unlink actions only know Garmin ids, so they get no control.
function matchEditHtml(act, match, candidates) {
  if (!Number.isFinite(Number(act.activity_id))) return '';
  const head = '<div class="eyebrow" style="margin-bottom:8px">Plan match</div>';
  if (match) {
    return `<div class="act-sec">${head}
      <div style="font-size:.85rem;color:var(--text-2);margin-bottom:8px">Counted as <b>${escHtml(match.wo.name || 'session')}</b>${match.wo.scheduled_date ? ' · ' + escHtml(match.wo.scheduled_date) : ''}.</div>
      <button class="btn btn-ghost btn-sm" id="match-unlink" style="color:var(--rose)">Unmatch</button>
      <div class="hint" style="margin-top:6px">Detaches it and stops the matcher re-linking it there.</div></div>`;
  }
  if (!candidates.length) {
    return `<div class="act-sec">${head}<div class="hint">Not counted against the plan — no free session within a week of this date.</div></div>`;
  }
  return `<div class="act-sec">${head}
    <div class="field"><label for="match-session">Count this as</label>
      <select id="match-session">${candidates.map(wo =>
        `<option value="${escHtml(wo.session_id)}">${escHtml(wo.scheduled_date)} — ${escHtml(wo.name || (wo.workout_type || '').replace(/_/g, ' '))}</option>`).join('')}</select></div>
    <button class="btn btn-primary btn-sm" id="match-link">Link to this session</button></div>`;
}

async function matchEdit(inputs, btn, container, act, onBack) {
  const baselineId = await latestJobRunId('match-edit.yml');
  await dispatchWorkflow('match-edit.yml', inputs, 'Updating…', 'Waiting for the plan to update.', btn);
  const run = await waitForJobRun('match-edit.yml', baselineId);
  if (!run || run.conclusion !== 'success') {
    toast('err', 'Match update failed', run ? 'Check Settings → Job history for the log.' : 'Timed out waiting for the job.');
    return;
  }
  await planStore.reset();
  toast('ok', inputs.action === 'unlink' ? 'Unmatched' : 'Linked', 'Plan updated.');
  await renderActivityDetail(container, act, { onBack });
}

function deterministicInsights(detail, act, match) {
  const out = [];
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const sp = ((detail && detail.splits) || []).filter(s => s.pace_sec);
  if (sp.length >= 3) {
    const k = Math.max(1, Math.floor(sp.length / 3));
    const first = avg(sp.slice(0, k).map(s => s.pace_sec)), last = avg(sp.slice(-k).map(s => s.pace_sec));
    const fade = (last - first) / first * 100;
    out.push(Math.abs(fade) < 2 ? 'Even pacing — held steady start to finish.'
      : fade > 0 ? `Positive split — slowed ${fade.toFixed(0)}% over the run (faded).`
      : `Negative split — sped up ${(-fade).toFixed(0)}%, strong finish.`);
    const hr = sp.filter(s => s.avg_hr);
    if (hr.length >= 3) {
      const drift = avg(sp.slice(-k).map(s => s.avg_hr || 0)) - avg(sp.slice(0, k).map(s => s.avg_hr || 0));
      if (drift > 5) out.push(`HR drifted up ~${Math.round(drift)} bpm — cardiac drift / fatigue.`);
    }
  }
  if (act.training_effect_aerobic) out.push(`Aerobic TE ${act.training_effect_aerobic.toFixed(1)}/5 — ${act.training_effect_aerobic >= 3 ? 'meaningful aerobic stimulus.' : 'maintenance / recovery level.'}`);
  if (match) {
    const tgtKm = match.wo.estimated_distance_meters ? match.wo.estimated_distance_meters / 1000 : null;
    const actKm = act.distance_meters ? act.distance_meters / 1000 : null;
    if (tgtKm && actKm) out.push(`Planned ~${tgtKm.toFixed(1)} km (${(match.wo.workout_type || '').replace(/_/g, ' ')}); ran ${actKm.toFixed(1)} km.`);
  }
  return out.length ? `<ul style="margin:0;padding-left:18px;line-height:1.7;font-size:.88rem;color:var(--text-2)">${out.map(x => `<li>${escHtml(x)}</li>`).join('')}</ul>` : '';
}

function analyzeActivityWithCoach(act, btn) {
  const id = act.activity_id;
  withBusy(btn, 'Requesting…', async () => {
    const title = `Coach: analyze activity ${id} (${act.name || 'activity'})`;
    const body = `Analyze Garmin activity **${id}** — "${act.name || ''}" on ${act.start_time || ''}.\n\nWrite the analysis to \`data/analyses/${id}.md\`: what was done, how it compares to the planned workout (if one matched), how it affects my athlete profile, and what I should improve.`;
    const res = await fetch(`${API}/repos/${REPO}/issues`, { method: 'POST', headers: JSON_HDR, body: JSON.stringify({ title, body, labels: ['coach'] }) });
    if (!res.ok) throw new Error(await jobError(res));
    const issue = await res.json();
    toast('ok', 'Analysis requested', `<a href="${issue.html_url}" target="_blank" rel="noopener">#${issue.number}</a> — tracking progress below.`);
    pollForAnalysis(id, issue.html_url);
  });
}

function coachProgressHtml(elapsedS, statusLine, issueUrl) {
  const m = Math.floor(elapsedS / 60), s = elapsedS % 60;
  return `<div class="act-analysis" style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="spinner" style="width:18px;height:18px;border-width:2px"></span>
      <b style="color:var(--text)">Coach is analyzing this session…</b>
    </div>
    <div class="hint">${escHtml(statusLine)} · elapsed ${m}:${String(s).padStart(2, '0')}</div>
    <div class="hint">Claude writes the analysis on the VM — usually 2–5 min. You can leave this page; the result lands here automatically.${issueUrl ? ` <a href="${issueUrl}" target="_blank" rel="noopener">View request</a>` : ''}</div>
  </div>`;
}

// After requesting an analysis, poll until the markdown file lands, then render it
// in place. The file check is authoritative; job status is just reassurance.
async function pollForAnalysis(id, issueUrl) {
  const slot = document.getElementById('coach-analysis-slot');
  if (!slot) return;
  const start = Date.now(), TIMEOUT = 15 * 60 * 1000, EVERY = 12000;
  let statusLine = 'Waiting for the coach job to start…';
  const tick = async () => {
    if (!document.body.contains(slot)) return;  // user navigated away — stop polling
    slot.innerHTML = coachProgressHtml(Math.floor((Date.now() - start) / 1000), statusLine, issueUrl);
    try {
      const r = await fetch(`${API}/repos/${REPO}/contents/data/analyses/${id}.md?ref=master&t=${Date.now()}`, { headers: JSON_HDR });
      if (r.ok) {
        const j = await r.json();
        const md = decodeURIComponent(escape(atob((j.content || '').replace(/\s/g, ''))));
        slot.innerHTML = `<div class="act-analysis">${formatMarkdown(md)}</div>`;
        toast('ok', 'Analysis ready', 'Your coaching analysis is in.');
        return;
      }
    } catch {}
    try {
      const wr = await fetch(`${API}/repos/${REPO}/actions/workflows/coach.yml/runs?per_page=1&t=${Date.now()}`, { headers: JSON_HDR });
      if (wr.ok) {
        const run = (await wr.json()).workflow_runs?.[0];
        // Only trust a run started around/after this request, not a stale prior one.
        if (run && new Date(run.created_at).getTime() >= start - 120000) {
          statusLine = run.status === 'completed'
            ? (run.conclusion === 'success' ? 'Job finished — fetching the analysis…'
               : `Job ${run.conclusion}. Check the run log.`)
            : run.status === 'in_progress' ? 'Coach job running…' : 'Coach job queued…';
        }
      }
    } catch {}
    if (Date.now() - start > TIMEOUT) {
      slot.innerHTML = `<div class="act-analysis"><div class="hint">This is taking longer than usual. It'll appear here once the coach finishes — reload in a few minutes${issueUrl ? `, or <a href="${issueUrl}" target="_blank" rel="noopener">check the job log</a>` : ''}.</div></div>`;
      return;
    }
    setTimeout(tick, EVERY);
  };
  tick();
}

// Inner body (metrics → charts → planned-vs-actual → coach analysis) shared by the
// full-page activity view and the inline calendar panel. No modal chrome.
function activityDetailBody(act, detail, analysisMd, match, candidates = []) {
  const distKm = act.distance_meters ? (act.distance_meters / 1000).toFixed(2) : '—';
  const duration = act.duration_seconds ? formatSeconds(act.duration_seconds) : '—';
  const pace = act.avg_pace_sec_per_km ? formatPace(act.avg_pace_sec_per_km) + '/km' : '—';
  const splits = (detail && detail.splits) || [];
  const series = (detail && detail.series) || [];
  const runSplits = splits.filter(s => s.pace_sec != null);
  const hrOverTime = series.map(s => s.hr);
  const paceOverTime = series.map(s => s.pace);
  const cadOverTime = series.map(s => s.cad);
  const strideOverTime = series.map(s => s.stride);
  const sec = (title, body) => body ? `<div class="act-sec"><div class="eyebrow" style="margin-bottom:6px">${title}</div>${body}</div>` : '';

  const runHr = runSplits.filter(s => s.avg_hr != null);
  let charts = '';
  // Heart rate over time (cardio + running); fall back to per-km HR for runs with
  // multiple splits. (Cardio's single session-lap isn't a per-km series.)
  if (hrOverTime.filter(v => v != null).length >= 3)
    charts += sec('Heart rate over time', miniChart(hrOverTime, { color: 'var(--rose)', fmt: v => Math.round(v) + ' bpm', height: 120 }));
  else if (runHr.length >= 2)
    charts += sec('Heart rate per km', miniChart(runSplits.map(s => s.avg_hr), { color: 'var(--rose)', fmt: v => Math.round(v) + ' bpm', height: 120 }));
  // Pace over time (running); fall back to per-km pace.
  if (paceOverTime.filter(v => v != null).length >= 3)
    charts += sec('Pace over time', miniChart(paceOverTime, { color: 'var(--sky)', invert: true, fmt: v => formatPace(v) }));
  else if (runSplits.length >= 2)
    charts += sec('Pace per km', miniChart(splits.map(s => s.pace_sec), { color: 'var(--sky)', invert: true, fmt: v => formatPace(v) }));
  // Cadence (running economy) — over time from the series, else per-km from splits.
  // Shaded band = the efficient 170–180 spm range (below it usually means over-striding).
  const cadFmt = v => Math.round(v) + ' spm', CAD_BAND = [170, 180];
  if (cadOverTime.filter(v => v != null).length >= 3)
    charts += sec('Cadence over time', miniChart(cadOverTime, { color: 'var(--violet)', fmt: cadFmt, height: 110, band: CAD_BAND }));
  else if (runSplits.some(s => s.avg_cadence))
    charts += sec('Cadence per km', miniChart(runSplits.map(s => s.avg_cadence), { color: 'var(--violet)', fmt: cadFmt, height: 110, band: CAD_BAND }));
  // Stride length over time. Efficient band is pace-aware: the stride you'd take at
  // THIS run's speed with an efficient cadence (speed ÷ 180 to ÷ 170). Above it = over-striding.
  if (strideOverTime.filter(v => v != null).length >= 3) {
    const spdMmin = (act.distance_meters && act.duration_seconds) ? act.distance_meters / act.duration_seconds * 60 : null;
    const strideBand = spdMmin ? [spdMmin / 180 * 100, spdMmin / 170 * 100] : null;  // cm, matching the series
    charts += sec('Stride length over time', miniChart(strideOverTime, { color: 'var(--amber)', fmt: v => (v / 100).toFixed(2) + ' m', height: 110, band: strideBand }));
  }
  // Time-in-HR-zone distribution (cardio + running).
  charts += sec('Heart-rate zones', hrZoneBars(detail && detail.hr_zones));
  // Pace distribution (running).
  if (runSplits.length >= 3)
    charts += sec('Pace distribution', paceHistogram(runSplits.map(s => s.pace_sec), { fmt: v => formatPace(v) }));
  // Per-km splits table (running).
  if (runSplits.length >= 2)
    charts += `<div class="act-sec"><div class="eyebrow" style="margin-bottom:8px">Splits</div>

  const matchHtml = matchEditHtml(act, match, candidates);

  const insights = deterministicInsights(detail, act, match);
  const analysisInner = analysisMd
    ? `<div class="act-analysis">${formatMarkdown(analysisMd)}</div>`
    : `<div>${insights || '<div style="color:var(--text-3);font-size:.85rem">No AI analysis yet.</div>'}
        <button class="btn btn-primary btn-sm" id="act-analyze" style="margin-top:12px">${icons.spark} Analyze with Coach</button>
        <div class="hint" style="margin-top:6px">Asks Claude to write a full coaching analysis of this session.</div></div>`;

  if (act.bike) {
    const b = act.bike;
    return `
    <div class="detail-grid">
      ${detailItem(duration, 'Duration')}${detailItem(b.avg_power != null ? Math.round(b.avg_power) + 'W' : '—', 'Avg Power')}
      ${detailItem(b.np != null ? Math.round(b.np) + 'W' : '—', 'NP')}${detailItem(b.if != null ? b.if.toFixed(2) : '—', 'IF')}
      ${detailItem(b.tss != null ? Math.round(b.tss) : '—', 'TSS')}${detailItem(b.kj != null ? Math.round(b.kj) : '—', 'kJ')}
      ${detailItem(act.avg_hr || '—', 'Avg HR')}${detailItem(b.avg_cadence != null ? Math.round(b.avg_cadence) : '—', 'Cadence')}
      ${detailItem(b.ftp != null ? Math.round(b.ftp) + 'W' : '—', 'FTP')}
    </div>

      `<div class="act-sec" style="margin-top:0"><div class="eyebrow" style="margin-bottom:8px">Coach analysis</div><div id="coach-analysis-slot">${analysisInner}</div></div><div class="detail-grid">`);
  }
  return `
    <div class="act-sec" style="margin-top:0"><div class="eyebrow" style="margin-bottom:8px">Coach analysis</div><div id="coach-analysis-slot">${analysisInner}</div></div>
    <div class="detail-grid">
      ${detailItem(distKm, 'Distance km')}${detailItem(duration, 'Duration')}${detailItem(pace, 'Avg Pace')}
      ${detailItem(act.avg_hr || '—', 'Avg HR')}${detailItem(act.max_hr || '—', 'Max HR')}${detailItem(act.calories || '—', 'Calories')}
      ${detailItem(act.avg_running_cadence ? Math.round(act.avg_running_cadence) : '—', 'Cadence')}
      ${detailItem(act.avg_stride_length ? (act.avg_stride_length / 100).toFixed(2) + 'm' : '—', 'Stride')}
      ${detailItem(act.avg_ground_contact_time ? Math.round(act.avg_ground_contact_time) + 'ms' : '—', 'GCT')}
      ${detailItem(act.training_effect_aerobic ? act.training_effect_aerobic.toFixed(1) : '—', 'Aerobic TE')}
      ${detailItem(act.training_effect_anaerobic ? act.training_effect_anaerobic.toFixed(1) : '—', 'Anaerobic TE')}

    </div>

}

// Render an activity's full detail into a container (page or calendar panel). onBack,
// when given, shows a back button wired to it.
async function renderActivityDetail(container, act, { onBack } = {}) {
  container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const id = act.activity_id;
  let detail = null, analysisMd = null, plan = null;
  try { detail = await loadJSON(`details/${id}.json`); } catch {}
  try { analysisMd = await loadText(`analyses/${id}.md`); } catch {}
  try { plan = await planStore.get(); } catch {}
  const match = matchedWorkout(plan, id);
  const w = detail && detail.weather;
  // Conditions-adjusted pace (mirror of engine/enviro.py) — what the run was
  // "worth" in neutral weather, so hot days aren't misread as bad days.
  let adjNote = '';
  if (w && w.temp_c != null && act.avg_pace_sec_per_km) {
    let eff = w.temp_c + (w.humidity > 60 ? (w.humidity - 60) / 10 : 0);
    const bands = [[15, 0.002], [22, 0.003], [28, 0.005]];
    let cost = 0;
    bands.forEach(([th, per], i) => {
      const upper = bands[i + 1] ? bands[i + 1][0] : Infinity;
      if (eff > th) cost += (Math.min(eff, upper) - th) * per;
    });
    const factor = Math.min(1 + cost, 1.12);
    if (factor > 1.005) adjNote = ` · conditions-adjusted ${formatPace(act.avg_pace_sec_per_km / factor)}/km`;
  }
  const sub = `${escHtml(act.activity_type || '')}${act.start_time ? ' · ' + new Date(act.start_time).toLocaleString() : ''}${w && w.temp_c != null ? ` · ${Math.round(w.temp_c)}°C${w.desc ? ' ' + escHtml(w.desc) : ''}` : ''}${adjNote}`;
  container.innerHTML = `<div class="fade-in">
    <div class="detail-head">
      ${onBack ? `<button class="btn btn-ghost btn-sm" data-back>${icons.back} Back</button>` : ''}
      <div><div class="detail-h-title">${escHtml(act.name || 'Activity')}</div><div class="detail-h-sub">${sub}</div></div>
    </div>
    ${activityDetailBody(act, detail, analysisMd, match, linkCandidates(plan, act))}
    ${rpeSelectorHtml(id, null)}
  </div>`;
  const ab = container.querySelector('#act-analyze');
  if (ab) ab.addEventListener('click', () => analyzeActivityWithCoach(act, ab));
  const bb = container.querySelector('[data-back]');
  if (bb && onBack) bb.addEventListener('click', onBack);
  const unlinkBtn = container.querySelector('#match-unlink');
  if (unlinkBtn) unlinkBtn.addEventListener('click', () =>
    matchEdit({ action: 'unlink', activity_id: String(id) }, unlinkBtn, container, act, onBack));
  const linkBtn = container.querySelector('#match-link');
  if (linkBtn) linkBtn.addEventListener('click', () => {
    const sid = container.querySelector('#match-session')?.value;
    if (!sid) return;
    matchEdit({ action: 'link', activity_id: String(id), session_id: sid }, linkBtn, container, act, onBack);
  });
  bindRpeSelector(container, {
    date: act.start_time ? String(act.start_time).slice(0, 10) : null,
    durationMin: act.duration_seconds ? Math.round(act.duration_seconds / 60 * 10) / 10 : null,
  });
  rpeForActivity(id).then(r => {
    if (!r) return;
    container.querySelectorAll(`[data-rpe-for="${id}"] [data-rpe]`).forEach(b => {
      b.classList.toggle('btn-primary', Number(b.dataset.rpe) === r);
      b.classList.toggle('btn-outline', Number(b.dataset.rpe) !== r);
    });
  });
}

// Radar of the 8 stations' percentiles — strengths vs weaknesses at a glance.
function radarChart(items, { size = 250 } = {}) {
  const n = items.length, cx = size / 2, cy = size / 2, R = size / 2 - 42;
  const ang = i => (Math.PI * 2 * i / n) - Math.PI / 2;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * R * (r / 100), cy + Math.sin(ang(i)) * R * (r / 100)];
  const rings = [25, 50, 75, 100].map(r =>
    `<polygon points="${items.map((_, i) => pt(i, r).map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--border-s)" stroke-width="1"/>`).join('');
  const poly = `<polygon points="${items.map((it, i) => pt(i, Math.max(it.value, 2)).map(v => v.toFixed(1)).join(',')).join(' ')}" fill="var(--violet)" fill-opacity="0.16" stroke="var(--violet)" stroke-width="2"/>`;
  const dots = items.map((it, i) => { const [x, y] = pt(i, Math.max(it.value, 2)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${pctColor(it.value)}"/>`; }).join('');
  const labels = items.map((it, i) => { const x = cx + Math.cos(ang(i)) * (R + 18), y = cy + Math.sin(ang(i)) * (R + 18); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="8.5" fill="var(--text-3)" text-anchor="middle" dominant-baseline="middle">${escHtml(it.label)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:300px;display:block;margin:0 auto">${rings}${poly}${dots}${labels}</svg>`;
}
function stationRadarCard(segments) {
  const stations = (segments || []).filter(s => !s.is_run && s.percentile != null);
  if (stations.length < 3) return '';
  return fxCard('Station strengths', icons.hyrox,
    radarChart(stations.map(s => ({ label: s.display.replace('Broad Jump', 'BBJ'), value: s.percentile }))) +
    `<div class="hint" style="margin-top:6px;text-align:center">Each spoke is your field percentile for that station.</div>`);
}

// Cumulative pacing curve + per-run-lap fade vs the field.
function pacingCard(r) {
  const segs = (r.segments || []).filter(s => s.cumulative != null);
  if (segs.length < 4) return '';
  const cumLine = sparkline(segs.map(s => s.cumulative), { width: 260, height: 50 });
  const runs = segs.filter(s => s.is_run);
  const maxRun = Math.max(...runs.map(s => s.seconds), 1);
  const bars = runs.map(s => {
    const h = Math.round((s.seconds / maxRun) * 56) + 4;
    const c = s.percentile != null ? pctColor(s.percentile) : 'var(--sky)';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:100%;max-width:22px;height:${h}px;background:${c};border-radius:3px 3px 0 0"></div>
      <div class="hint" style="font-size:.62rem">${escHtml(s.display_time)}</div></div>`;
  }).join('');
  const pq = r.pacing_quality || {};
  const scoreColor = pq.score >= 75 ? 'var(--emerald)' : pq.score >= 45 ? 'var(--amber)' : 'var(--rose)';
  const quality = pq.available ? `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">

      <div class="hint" style="flex:1">Run spread ${Math.round(pq.spread_seconds)}s (elite &lt;15s) · worst run ${Math.round(pq.worst_deviation_seconds)}s off your average (elite ≈28s) · slowest: Run ${pq.slowest_run}</div>
    </div>
    ${(pq.flags || []).map(f => `<div style="display:flex;gap:8px;padding:3px 0"><span style="color:${scoreColor};font-weight:700">•</span><span style="font-size:.83rem;line-height:1.45">${escHtml(f)}</span></div>`).join('')}
    <div style="height:8px"></div>` : '';
  return fxCard('Pacing', icons.activity || icons.hyrox, `
    ${quality}
    <div class="eyebrow" style="margin-bottom:4px">Run laps — height = time, colour = field percentile</div>
    <div style="display:flex;align-items:flex-end;gap:5px;height:74px">${bars}</div>

function fmtSecs(secs) {
  if (secs == null) return '—';
  const t = Math.round(secs), m = Math.floor(t / 60), s = t % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function fmtRaceTime(secs) {
  if (secs == null) return '—';
  const t = Math.round(secs), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}

// Map a finish time to an estimated field percentile by interpolating the
// athlete's own (time, percentile) points across their races. Own-data anchored —
// no benchmark table can know this athlete's typical fields better.
function estimatePercentile(races, seconds) {
  const pts = (races || [])
    .filter(x => Number(x.rank) && Number(x.field_size) && x.total_time)
    .map(x => ({ t: x.total_time, p: 100 * (Number(x.field_size) - Number(x.rank)) / Number(x.field_size) }))
    .sort((a, b) => a.t - b.t);
  if (pts.length < 2) return null;
  if (seconds <= pts[0].t) {
    const [a, b] = [pts[0], pts[1]];
    const slope = (b.p - a.p) / (b.t - a.t || 1);
    return Math.max(1, Math.min(99, Math.round(a.p + slope * (seconds - a.t))));
  }
  if (seconds >= pts[pts.length - 1].t) {
    const [a, b] = [pts[pts.length - 2], pts[pts.length - 1]];
    const slope = (b.p - a.p) / (b.t - a.t || 1);
    return Math.max(1, Math.min(99, Math.round(b.p + slope * (seconds - pts[pts.length - 1].t))));
  }
  for (let i = 1; i < pts.length; i++) {
    if (seconds <= pts[i].t) {
      const [a, b] = [pts[i - 1], pts[i]];
      const f = (seconds - a.t) / (b.t - a.t || 1);
      return Math.max(1, Math.min(99, Math.round(a.p + f * (b.p - a.p))));
    }
  }
  return null;
}

// ── "Where your minutes are hiding" — time-recoverable waterfall ──
// Red bars ranked by seconds lost vs the chosen target; the headline number is
// the total a coach would call "on the table".
function waterfallRows(items, maxSeconds) {
  return items.map(i => {
    const w = Math.max(3, Math.round(100 * i.seconds / (maxSeconds || 1)));
    return `<div style="display:flex;align-items:center;gap:10px;padding:3px 0">
      <div style="width:126px;font-size:.8rem">${escHtml(i.display)}${i.is_run ? '' : ' <span style="color:var(--text-3);font-size:.68rem">station</span>'}</div>
      <div style="flex:1;height:14px;background:var(--border-s);border-radius:4px;overflow:hidden">
        <div style="width:${w}%;height:100%;background:var(--rose);opacity:.85"></div></div>
      <div style="width:56px;text-align:right;font-family:var(--font-m);font-size:.78rem;font-weight:600;color:var(--rose)">+${fmtSecs(i.seconds)}</div>
    </div>`;
  }).join('');
}

function waterfallCard(r, stationBests) {
  const tl = r.time_lost || {};
  // "vs your PB" is derived here: each segment vs your best across all races.
  const prItems = (r.segments || []).map(s => {
    const best = stationBests && stationBests[s.name];
    return best && s.seconds - best.seconds > 0.5
      ? { name: s.name, display: s.display, seconds: Math.round((s.seconds - best.seconds) * 10) / 10, is_run: s.is_run }
      : null;
  }).filter(Boolean).sort((a, b) => b.seconds - a.seconds);
  const views = {
    top3: { label: 'vs cohort top-3', data: tl.vs_top3 || { total: 0, items: [] } },
    field: { label: 'vs cohort average', data: tl.vs_field || { total: 0, items: [] } },
    pr: { label: 'vs your PBs', data: { total: Math.round(prItems.reduce((a, b) => a + b.seconds, 0) * 10) / 10, items: prItems } },
  };
  const body = Object.entries(views).map(([key, v]) => {
    const items = v.data.items.slice(0, 10);
    const maxS = items.length ? items[0].seconds : 1;
    return `<div data-wf-view="${key}" style="display:${key === 'top3' ? 'block' : 'none'}">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
        <div style="font-family:var(--font-m);font-size:1.7rem;font-weight:800;color:var(--rose)">${fmtSecs(v.data.total)}</div>
        <div class="hint">recoverable ${v.label}</div>
      </div>
      ${items.length ? waterfallRows(items, maxS) : '<div class="hint">Nothing on the table — you beat this benchmark everywhere.</div>'}
    </div>`;
  }).join('');
  return fxCard('Where your minutes are hiding', icons.hyrox, `
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      ${Object.entries(views).map(([key, v]) =>
        `<button class="btn btn-sm ${key === 'top3' ? 'btn-primary' : 'btn-outline'}" data-wf-btn="${key}">${v.label}</button>`).join('')}
    </div>
    ${body}
    <div class="hint" style="margin-top:8px">Seconds lost per segment, biggest first — only segments where you're behind count. Fixing the top two rows is usually worth more than everything else combined.</div>`);
}

// ── What-if finish simulator (hyresult-style) ──
function simulatorCard(r, races, stationBests) {
  const segs = (r.split_analysis || []);
  if (!segs.length || !r.total_time) return '';
  const stations = segs.filter(s => !s.is_run);
  const stationRows = stations.map(s => `
    <div style="display:flex;align-items:center;gap:8px;padding:3px 0" data-sim-row="${escHtml(s.name)}">
      <div style="width:126px;font-size:.8rem">${escHtml(s.display)}</div>
      <button class="btn-icon" data-sim-minus="${escHtml(s.name)}" aria-label="faster">−</button>
      <div style="width:52px;text-align:center;font-family:var(--font-m);font-size:.8rem" data-sim-val="${escHtml(s.name)}">${fmtSecs(s.athlete_seconds)}</div>
      <button class="btn-icon" data-sim-plus="${escHtml(s.name)}" aria-label="slower">+</button>
      <div class="hint" style="flex:1;text-align:right" data-sim-delta="${escHtml(s.name)}"></div>
    </div>`).join('');
  return fxCard('What-if simulator', icons.spark, `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn btn-outline btn-sm" data-sim-preset="reset">Reset</button>
      <button class="btn btn-outline btn-sm" data-sim-preset="weak2field">2 weakest → cohort avg</button>
      <button class="btn btn-outline btn-sm" data-sim-preset="weak2top3">2 weakest → top-3</button>
      <button class="btn btn-outline btn-sm" data-sim-preset="prs">All stations → your PBs</button>
    </div>
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:10px">
      <div><div class="eyebrow">Simulated finish</div>
        <div style="font-family:var(--font-m);font-size:1.9rem;font-weight:800;color:var(--emerald)" id="sim-total">${fmtRaceTime(r.total_time)}</div></div>
      <div><div class="eyebrow">vs actual</div>
        <div style="font-family:var(--font-m);font-size:1.1rem;font-weight:700" id="sim-delta">±0:00</div></div>
      <div><div class="eyebrow">est. percentile</div>
        <div style="font-family:var(--font-m);font-size:1.1rem;font-weight:700" id="sim-pct">—</div></div>
    </div>
    ${stationRows}
    <div class="hint" style="margin-top:8px">Steppers move a station ±5s (your runs and roxzone stay as raced). Percentile is interpolated from your own races' placings — an estimate, not a promise.</div>`);
}

function bindSimulator(page, r, races, stationBests) {
  const base = {};
  (r.split_analysis || []).filter(s => !s.is_run).forEach(s => { base[s.name] = s.athlete_seconds; });
  const sim = { ...base };
  const stationsMeta = {};
  (r.split_analysis || []).filter(s => !s.is_run).forEach(s => { stationsMeta[s.name] = s; });

  function refresh() {
    let total = r.total_time;
    Object.keys(base).forEach(k => { total += sim[k] - base[k]; });
    const delta = total - r.total_time;
    const el = id => page.querySelector('#' + id);
    if (el('sim-total')) el('sim-total').textContent = fmtRaceTime(total);
    if (el('sim-delta')) {
      el('sim-delta').textContent = (delta <= 0 ? '−' : '+') + fmtSecs(Math.abs(delta));
      el('sim-delta').style.color = delta < 0 ? 'var(--emerald)' : delta > 0 ? 'var(--rose)' : 'var(--text-2)';
    }
    const pct = estimatePercentile(races, total);
    const basePct = estimatePercentile(races, r.total_time);
    if (el('sim-pct')) el('sim-pct').textContent = pct != null ? `${pct}th${basePct != null && pct !== basePct ? ` (${pct > basePct ? '+' : ''}${pct - basePct})` : ''}` : '—';
    Object.keys(base).forEach(k => {
      const v = page.querySelector(`[data-sim-val="${k}"]`);
      const d = page.querySelector(`[data-sim-delta="${k}"]`);
      if (v) { v.textContent = fmtSecs(sim[k]); v.style.color = sim[k] < base[k] ? 'var(--emerald)' : ''; }
      if (d) d.textContent = sim[k] !== base[k] ? `${sim[k] < base[k] ? '−' : '+'}${fmtSecs(Math.abs(sim[k] - base[k]))}` : '';
    });
  }

  page.querySelectorAll('[data-sim-minus]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.simMinus; sim[k] = Math.max(30, sim[k] - 5); refresh();
  }));
  page.querySelectorAll('[data-sim-plus]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.simPlus; sim[k] += 5; refresh();
  }));
  page.querySelectorAll('[data-sim-preset]').forEach(b => b.addEventListener('click', () => {
    const preset = b.dataset.simPreset;
    Object.keys(base).forEach(k => { sim[k] = base[k]; });
    if (preset === 'weak2field' || preset === 'weak2top3') {
      const key = preset === 'weak2field' ? 'field_avg' : 'top3_avg';
      Object.values(stationsMeta)
        .filter(s => s[key] != null && s.athlete_seconds > s[key])
        .sort((a, b) => (b.athlete_seconds - b[key]) - (a.athlete_seconds - a[key]))
        .slice(0, 2)
        .forEach(s => { sim[s.name] = s[key]; });
    } else if (preset === 'prs') {
      Object.keys(base).forEach(k => {
        const best = stationBests && stationBests[k];
        if (best && best.seconds < base[k]) sim[k] = best.seconds;
      });
    }
    refresh();
  }));
  refresh();
}

// ── Cumulative gap-to-top-3 + per-segment standing ──
function gapCurveCard(r) {
  const segs = (r.segments || []).filter(s => s.cumulative_gap_top3 != null);
  if (segs.length < 6) return '';
  const gaps = segs.map(s => s.cumulative_gap_top3);
  const final = gaps[gaps.length - 1];
  // Which segments open the gap fastest (biggest per-segment increase)?
  const jumps = segs.map((s, i) => ({ display: s.display, inc: gaps[i] - (i ? gaps[i - 1] : 0) }))
    .sort((a, b) => b.inc - a.inc).slice(0, 2).filter(j => j.inc > 5);
  return fxCard('Gap to the top-3 through the race', icons.hyrox, `
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px">
      <div style="font-family:var(--font-m);font-size:1.5rem;font-weight:800;color:${final > 0 ? 'var(--rose)' : 'var(--emerald)'}">${final > 0 ? '+' : '−'}${fmtSecs(Math.abs(final))}</div>
      <div class="hint">${final > 0 ? 'behind' : 'ahead of'} your cohort's top-3 pace at the finish</div>
    </div>
    ${miniChart(gaps, { color: final > 0 ? 'var(--rose)' : 'var(--emerald)', fmt: v => (v > 0 ? '+' : '−') + fmtSecs(Math.abs(v)) })}
    <div class="hint" style="margin-top:6px">Cumulative seconds vs top-3 average after each segment — where the line jumps is where the race is decided.${jumps.length ? ` Biggest jumps: <b>${jumps.map(j => `${escHtml(j.display)} (+${Math.round(j.inc)}s)`).join(', ')}</b>.` : ''}</div>`);
}

function standingCard(r) {
  const segs = (r.segments || []).filter(s => s.percentile != null);
  if (segs.length < 6) return '';
  return fxCard('Your standing, segment by segment', icons.activity || icons.hyrox, `
    ${miniChart(segs.map(s => s.percentile), { color: 'var(--sky)', fmt: v => Math.round(v) + 'th' })}
    <div class="hint" style="margin-top:6px">Field percentile at each segment in race order (higher = nearer the front). Rises on your strengths, dips where the field takes time back. Note: per-segment standing, not cumulative race position.</div>`);
}

// ── Target-time split calculator ──
function targetCalcCard(r) {
  if (!r.total_time || !(r.segments || []).length) return '';
  return fxCard('Target-time splits', icons.plan, `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
      <label class="hint" for="tgt-time">Goal finish</label>
      <input id="tgt-time" class="mono-input" style="width:110px" placeholder="e.g. 1:15:00" value="">
      <button class="btn btn-primary btn-sm" id="tgt-go">Build my splits</button>
    </div>
    <div id="tgt-out"><div class="hint">Enter a goal — your actual splits are scaled to it, so the plan respects your personal strengths instead of a generic table.</div></div>`);
}

function bindTargetCalc(page, r) {
  const btn = page.querySelector('#tgt-go');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const raw = (page.querySelector('#tgt-time') || {}).value || '';
    const parts = raw.trim().split(':').map(Number);
    let goal = null;
    if (parts.length === 3) goal = parts[0] * 3600 + parts[1] * 60 + parts[2];
    else if (parts.length === 2) goal = parts[0] * 3600 + parts[1] * 60;  // h:mm
    const out = page.querySelector('#tgt-out');
    if (!goal || !isFinite(goal) || goal < 2400 || goal > 3 * 3600) {
      out.innerHTML = '<div class="hint" style="color:var(--rose)">Enter a goal like 1:15:00 (between 0:40:00 and 3:00:00).</div>';
      return;
    }
    const factor = goal / r.total_time;
    const rows = (r.segments || []).map(s => {
      const tgt = s.seconds * factor;
      const delta = tgt - s.seconds;
      return `<tr>
        <td style="padding:4px 8px;font-size:.8rem">${escHtml(s.display)}</td>
        <td style="padding:4px 8px;font-family:var(--font-m);font-size:.78rem;text-align:right;color:var(--text-3)">${escHtml(s.display_time)}</td>
        <td style="padding:4px 8px;font-family:var(--font-m);font-size:.78rem;text-align:right;font-weight:700">${fmtSecs(tgt)}</td>
        <td style="padding:4px 8px;font-family:var(--font-m);font-size:.78rem;text-align:right;color:${delta < 0 ? 'var(--emerald)' : 'var(--rose)'}">${delta < 0 ? '−' : '+'}${fmtSecs(Math.abs(delta))}</td>
      </tr>`;
    }).join('');
    const rox = r.roxzone ? `<div class="hint" style="margin-top:6px">Roxzone budget: ${fmtSecs(r.roxzone * factor)} (was ${escHtml(r.roxzone_display)}).</div>` : '';
    out.innerHTML = `
      <div class="hint" style="margin-bottom:6px">${factor < 1 ? `You need to find <b>${fmtSecs(r.total_time - goal)}</b> vs this race (${Math.round((1 - factor) * 100)}% faster everywhere — or more where you're weakest).` : 'That goal is slower than this race — you already have it.'}</div>
      <div style="overflow-x:auto;max-height:320px;overflow-y:auto"><table style="width:100%;border-collapse:collapse">
        <thead><tr style="border-bottom:1px solid var(--border)">
          <th style="padding:4px 8px;text-align:left;font-size:.7rem;color:var(--text-3)">Segment</th>
          <th style="padding:4px 8px;text-align:right;font-size:.7rem;color:var(--text-3)">Raced</th>
          <th style="padding:4px 8px;text-align:right;font-size:.7rem;color:var(--text-3)">Target</th>
          <th style="padding:4px 8px;text-align:right;font-size:.7rem;color:var(--text-3)">Δ</th>
        </tr></thead><tbody>${rows}</tbody></table></div>${rox}`;
  });
}

// Per-race ranks: Overall (position in the gender field) + Age-group.
// results.hyrox.com only had a season-cumulative number; hyresult gives these per race.
function hyroxRankText(r) {
  const parts = [];
  if (r.rank) parts.push('#' + r.rank + (r.field_size ? '/' + r.field_size : '') + ' overall');
  if (r.rank_age_group) parts.push('#' + r.rank_age_group + (r.age_group ? ' in ' + r.age_group : ' AG'));
  return parts.length ? ' · ' + parts.join(' · ') : '';
}

function hyroxRaceCard(r) {

// ── Progression / evolution across all races ──
function sparkline(values, { width = 220, height = 44 } = {}) {
  const v = (values || []).filter(x => x != null);
  if (v.length < 2) return '';
  const min = Math.min(...v), max = Math.max(...v), span = (max - min) || 1;
  const dx = width / (v.length - 1);
  const pts = v.map((x, i) => `${(i * dx).toFixed(1)},${(height - ((x - min) / span) * height).toFixed(1)}`);
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none" style="overflow:visible">
    <polyline fill="none" stroke="var(--emerald)" stroke-width="2" points="${pts.join(' ')}"/>
    ${pts.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="2.5" fill="var(--emerald)"/>`).join('')}
  </svg>`;
}

// Headline strip — the five numbers that matter, everything else lives below the fold.
function hyroxHeadlineStrip(prog, prediction, ordered) {
  if (!prog || !prog.num_races) return '';
  const best = prog.best_race || {};
  const latest = ordered[0] || {};
  const pt = prog.percentile_trend || {};
  const overallPct = (pt.overall || []).map(p => p.percentile);
  const nowPct = overallPct.length ? overallPct[overallPct.length - 1] : null;
  const trend = prog.num_races >= 3 ? (prog.improving ? 'improving' : 'plateauing') : '';
  const stats = [
    { label:'Latest race', value: latest.total_display || latest.total_time_display || '—', unit:'', sub: [latest.city, latest.event_date].filter(Boolean).join(' · '), accent:'var(--sky)', accentD:'var(--sky-d)' },
    { label:'Personal best', value: best.total_display || '—', unit:'', sub: best.event_date || '', accent:'var(--emerald)', accentD:'var(--emerald-d)' },
    { label:'Field percentile', value: nowPct != null ? nowPct : '—', unit: nowPct != null ? 'th' : '', sub: trend, accent:'var(--violet)', accentD:'var(--violet-d)' },
    { label:'Next-race projection', value: prediction && prediction.predicted_display ? prediction.predicted_display : '—', unit:'', sub: prediction && prediction.trend ? prediction.trend : '', accent:'var(--amber)', accentD:'var(--amber-d)' },
    { label:'Races', value: prog.num_races, unit:'', sub: 'career', accent:'var(--rose)', accentD:'var(--rose-d)' },
  ];
  return `<div class="grid stat-row" style="margin-bottom:16px">${stats.map(statCard).join('')}</div>`;
}

function hyroxFocusCard(priorities) {
  const focus = (priorities || []).slice(0, 4).map(p =>
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-s)">
      <span style="font-size:.84rem;font-weight:500">${escHtml(p.display)}${p.train_priority ? ' ' + pill('train priority', 'var(--rose)') : ''}</span>
      <span class="hint">${p.gap_seconds > 0 ? '+' + Math.round(p.gap_seconds) + 's vs top-3 (' + p.gap_pct + '%)' : 'at top-3 level'}</span>
    </div>`).join('');
  if (!focus) return '';
  return `<div class="card">
    <div class="card-h"><div class="card-title"><span class="ico">${icons.spark}</span>Focus for next race</div></div>
    <div class="hint" style="margin-bottom:6px">Biggest gaps to the top-3 field in your latest race. <span style="color:var(--rose)">Train priority</span> = &gt;60s over your division benchmark, or a 2-weakest station.</div>
    ${focus}
  </div>`;

// Everything analytical folds into <details> sections — open what you need, when you need it.
function foldSection(title, body, open = false) {
  return `<details class="card" style="margin-bottom:12px" ${open ? 'open' : ''}>
    <summary style="cursor:pointer;font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px;list-style:none">
      <span class="ico">${icons.hyrox}</span>${title}<span style="margin-left:auto;color:var(--text-3);font-weight:400;font-size:.78rem">show ↓</span></summary>
    <div style="margin-top:12px">${body}</div>
  </details>`;
}

function hyroxDeepAnalysis(prog, prediction, compromiseByStation, pacingStrategy) {
  if (!prog || !prog.num_races) return '';
  const pt = prog.percentile_trend || {};
  const overallPct = (pt.overall || []).map(p => p.percentile);
  const sections = [];

  const progressionBody = `
    <div class="hint" style="margin-bottom:4px">Finish-time trend (lower is better)</div>
    ${sparkline(prog.total_trend)}
    ${overallPct.length >= 2 ? `
      <div class="hint" style="margin:12px 0 4px">Overall field percentile per race — rank-based, so it controls for how strong each field was.</div>
      ${miniChart(overallPct, { color: 'var(--sky)', fmt: v => Math.round(v) + 'th' })}
      <div class="hint" style="margin:8px 0 4px">Run-fade trend per race (lower = better pacing)</div>
      ${sparkline(prog.fade_trend)}` : ''}
    ${prediction && prediction.predicted_seconds != null ? `<div class="hint" style="margin-top:10px">Projection basis: ${escHtml(prediction.basis || '')}</div>` : ''}
    ${pacingStrategy && pacingStrategy.available ? `<div class="hint" style="margin-top:6px">Even-pacing payoff: r = ${pacingStrategy.correlation} — ${escHtml(pacingStrategy.read)} (${pacingStrategy.races_used} races)</div>` : ''}`;
  sections.push(foldSection('Progression & competitiveness', progressionBody));

  const cbs = compromiseByStation;
  if (cbs && cbs.available && (cbs.stations || []).length) {
    const max = Math.max(...cbs.stations.map(s => Math.abs(s.excess_fade_pct)), 1);
    const rows = cbs.stations.map(s => {
      const width = Math.min(100, Math.abs(s.excess_fade_pct) / max * 100);
      const color = s.excess_fade_pct > 0 ? 'var(--rose)' : 'var(--emerald)';
      return `<div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px">
          <span>Run ${s.run_position} — after ${escHtml(s.station_display)}</span>
          <span style="font-family:var(--font-m);font-weight:700;color:${color}">${s.excess_fade_pct > 0 ? '+' : ''}${s.excess_fade_pct}%</span>
        </div>
        <div style="height:6px;border-radius:3px;background:var(--border-s)">
          <div style="height:100%;border-radius:3px;width:${width}%;background:${color}"></div>
        </div>
      </div>`;
    }).join('');
    sections.push(foldSection('Compromised running, by station',
      `<div class="hint" style="margin-bottom:10px">Run-pace fade at each stage vs. how much the field typically fades by that same point — isolates which transition costs <b>you</b> more than it costs the average athlete. Positive = worse than expected there; negative = you hold up better than the field.</div>${rows}`));
  }

  const heat = heatmapBody(prog);
  if (heat) sections.push(foldSection('Every race × every segment',
    `<div class="hint" style="margin-bottom:8px">Field percentile per segment across your career. A red <b>column</b> is a chronic limiter worth training; a red <b>row</b> was just a bad day.</div>${heat}`));

  const sc = (prog.station_comparison || []).filter(s => s.improvement_seconds != null);
  sc.sort((a, b) => b.improvement_seconds - a.improvement_seconds);
  if (sc.length) {
    const stationRows = sc.map(s => {
      const imp = s.improvement_seconds;
      const col = imp > 1 ? 'var(--emerald)' : imp < -1 ? 'var(--rose)' : 'var(--text-3)';
      const sign = imp > 0 ? '−' : imp < 0 ? '+' : '±';
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-s)">
        <span style="font-size:.84rem">${escHtml(s.display)}</span>
        <span style="display:flex;gap:12px;align-items:center">
          <span class="hint">best ${escHtml(s.best_display)}</span>
          <span style="font-family:var(--font-m);font-size:.8rem;font-weight:600;color:${col};min-width:54px;text-align:right">${sign}${Math.abs(Math.round(imp))}s</span>
        </span></div>`;
    }).join('');
    sections.push(foldSection('Station evolution — first race → latest', stationRows));
  }

  return `<div class="eyebrow" style="margin:22px 0 12px">Deep analysis</div>${sections.join('')}`;
}

// ── Career heatmap: races × segments, coloured by field percentile ──
// One glance separates chronic limiters (red columns) from one-off bad days
// (red rows) — the "whole career at a glance" view.
function heatmapBody(prog) {
  const pt = (prog || {}).percentile_trend || {};
  const stations = pt.stations || {};
  const events = (pt.overall || []).map(p => ({ index: p.race_index, event: p.event }));
  if (!events.length || !Object.keys(stations).length) return '';
  // Column order = race order of segments; rows = races.
  const colNames = Object.keys(stations);
  const order = ['Running_1', 'SkiErg_1000m', 'Running_2', 'Sled_Push_50m', 'Running_3',
    'Sled_Pull_50m', 'Running_4', 'Burpee_Broad_Jump_80m', 'Running_5', 'Row_1000m',
    'Running_6', 'Farmers_Carry_200m', 'Running_7', 'Sandbag_Lunges_100m', 'Running_8',
    'Wall_Balls'].filter(n => colNames.includes(n));
  const byRace = {};
  order.forEach(name => (stations[name] || []).forEach(p => {
    (byRace[p.race_index] = byRace[p.race_index] || {})[name] = p.percentile;
  }));
  const short = n => n.startsWith('Running_') ? 'R' + n.slice(8)
    : { SkiErg_1000m: 'Ski', Sled_Push_50m: 'SlPu', Sled_Pull_50m: 'SlPl',
        Burpee_Broad_Jump_80m: 'BBJ', Row_1000m: 'Row', Farmers_Carry_200m: 'FC',
        Sandbag_Lunges_100m: 'SL', Wall_Balls: 'WB' }[n] || n.slice(0, 4);
  const head = `<tr><th style="padding:4px 6px;text-align:left;font-size:.68rem;color:var(--text-3)">Race</th>
    ${order.map(n => `<th style="padding:4px 3px;font-size:.64rem;color:var(--text-3)" title="${escHtml(n.replace(/_/g, ' '))}">${short(n)}</th>`).join('')}</tr>`;
  const rows = events.map(e => {
    const cells = order.map(n => {
      const p = (byRace[e.index] || {})[n];
      const bg = p == null ? 'transparent' : `color-mix(in srgb, ${pctColor(p)} ${Math.round(20 + p * 0.55)}%, transparent)`;
      return `<td style="padding:0"><div title="${escHtml(e.event)} · ${escHtml(n.replace(/_/g, ' '))} · ${p != null ? p + 'th pct' : 'no data'}"
        style="margin:1px;height:22px;border-radius:3px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:.62rem;font-family:var(--font-m);color:var(--text-2)">${p != null ? p : ''}</div></td>`;
    }).join('');
    return `<tr><td style="padding:2px 6px;font-size:.72rem;white-space:nowrap">${escHtml(e.event)}</td>${cells}</tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%">${head}${rows}</table></div>`;
}

// ── Single-race detail ──
async function openHyroxRace(id) {
  const page = document.getElementById('page-content');
  if (!page) return;
  let data = null; try { data = await loadJSON('hyrox_analysis.json'); } catch {}
  const r = ((data && data.races) || []).find(x => x.id === id);
  if (!r) { goTab('hyrox'); return; }
  let coachMd = null; try { coachMd = await loadText(`analyses/hyrox-${id}.md`); } catch {}
  // Average each segment across your OTHER races for the "vs your past races" compare.
  const pastAvg = {};
  const acc = {};
  ((data && data.races) || []).filter(x => x.id !== id).forEach(o =>
    (o.segments || []).forEach(s => { (acc[s.name] = acc[s.name] || []).push(s.seconds); }));
  Object.entries(acc).forEach(([k, v]) => { pastAvg[k] = v.reduce((a, b) => a + b, 0) / v.length; });
  const races = (data && data.races) || [];
  const stationBests = ((data && data.progression) || {}).station_bests || {};
  setTopbar(r.city || 'Race', 'HYROX race detail', '');
  page.innerHTML = `<div class="fade-in">
    <div class="detail-head">
      <button class="btn btn-ghost btn-sm" data-back>${icons.back} Back</button>
      <div><div class="detail-h-title">${escHtml(r.city || 'Race')}</div>
        <div class="detail-h-sub">${escHtml(r.event_date || '')}${r.division ? ' · ' + escHtml(r.division) : ''}${hyroxRankText(r)} · ${escHtml(r.total_display || '')}</div></div>
    </div>
    ${hyroxDetailBody(r, coachMd, pastAvg, stationBests, races)}
  </div>`;
  page.querySelector('[data-back]')?.addEventListener('click', () => goTab('hyrox'));
  on('hyrox-coach', 'click', () => askCoachAboutRace(r));
  bindWaterfall(page);
  bindSimulator(page, r, races, stationBests);
  bindTargetCalc(page, r);
  document.querySelector('.page')?.scrollTo({ top: 0 });
}

function bindWaterfall(page) {
  page.querySelectorAll('[data-wf-btn]').forEach(b => b.addEventListener('click', () => {
    page.querySelectorAll('[data-wf-btn]').forEach(x => {
      x.classList.toggle('btn-primary', x === b);
      x.classList.toggle('btn-outline', x !== b);
    });
    page.querySelectorAll('[data-wf-view]').forEach(v => {
      v.style.display = v.dataset.wfView === b.dataset.wfBtn ? 'block' : 'none';
    });
  }));
}

function hyroxRaceFeedback(r) {
  const sa = r.split_analysis || [];
  const behind = sa.filter(s => s.gap_vs_top3 != null && s.gap_vs_top3 > 0)
    .sort((a, b) => b.gap_vs_top3 - a.gap_vs_top3).slice(0, 3);
  const ahead = sa.filter(s => s.beats_top3).slice(0, 3);
  const mistakes = [];
  if (r.fade_pct >= 15) mistakes.push(`Severe run fade (${r.fade_pct}%) — you went out too hot. Even pacing across the 8 runs is your biggest free time.`);
  else if (r.fade_pct >= 8) mistakes.push(`Moderate run fade (${r.fade_pct}%) — a positive split. Hold the first two runs ~10s/km easier.`);
  if (r.roxzone_pct >= 8) mistakes.push(`Roxzone is ${r.roxzone_pct}% of your race (${r.roxzone_display}) — slow transitions. Drill station entries/exits and walk-to-work tempo.`);
  return { behind, ahead, mistakes };
}

function hyroxDetailBody(r, coachMd, pastAvg = {}, stationBests = {}, races = []) {

  const feedback = fxCard('Coach read — what to fix', icons.spark, `

    ${fb.ahead.length ? `<div class="eyebrow" style="margin:10px 0 4px">Strengths to protect</div>${fb.ahead.map(s => fbItem(`<b>${escHtml(s.display)}</b> — beating the top-3 (${escHtml(s.athlete_display)} vs ${escHtml(s.top3_avg_display)}).`, 'var(--emerald)')).join('')}` : ''}`);

  const rows = (r.split_analysis || []).map(s => {
    const col = s.beats_top3 ? 'var(--emerald)' : s.beats_field ? 'var(--amber)' : 'var(--rose)';
    const gapTxt = s.gap_vs_top3 != null ? (s.gap_vs_top3 > 0 ? '+' : '') + Math.round(s.gap_vs_top3) + 's' : '—';
    const pctTxt = s.percentile != null ? `${s.percentile}th` : '—';
    const pctCol = s.percentile != null ? pctColor(s.percentile) : 'var(--text-3)';
    return `<tr>
      <td style="padding:6px 8px;font-size:.83rem">${escHtml(s.display)}</td>
      <td style="padding:6px 8px;font-family:var(--font-m);font-size:.82rem;text-align:right">${escHtml(s.athlete_display)}</td>
      <td style="padding:6px 8px;font-family:var(--font-m);font-size:.8rem;text-align:right;font-weight:600;color:${pctCol}">${pctTxt}</td>
      <td style="padding:6px 8px;font-family:var(--font-m);font-size:.82rem;text-align:right;color:var(--text-3)">${escHtml(s.field_avg_display)}</td>
      <td style="padding:6px 8px;font-family:var(--font-m);font-size:.82rem;text-align:right;color:var(--text-3)">${escHtml(s.top3_avg_display)}</td>
      <td style="padding:6px 8px;font-family:var(--font-m);font-size:.82rem;text-align:right;font-weight:600;color:${col}">${gapTxt}</td>
    </tr>`;
  }).join('');
  const table = fxCard('Every split vs the field', icons.hyrox, `
    ${r.benchmark_cohort ? `<div class="hint" style="margin-bottom:8px">Benchmarks: <b>vs your division — ${escHtml(r.benchmark_cohort)}</b>${r.benchmark_source && r.benchmark_source !== 'men_open_s7s8' ? ' (scaled from Men/Open season 7-8 data)' : ' (season 7-8 measured data)'}</div>` : ''}
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="padding:6px 8px;text-align:left;font-size:.72rem;color:var(--text-3)">Split</th>
        <th style="padding:6px 8px;text-align:right;font-size:.72rem;color:var(--text-3)">You</th>
        <th style="padding:6px 8px;text-align:right;font-size:.72rem;color:var(--text-3)">Pct</th>
        <th style="padding:6px 8px;text-align:right;font-size:.72rem;color:var(--text-3)">Field</th>
        <th style="padding:6px 8px;text-align:right;font-size:.72rem;color:var(--text-3)">Top-3</th>

  const coach = coachMd

    : `<div class="card mb"><div class="card-h"><div class="card-title"><span class="ico">${icons.spark}</span>Coach's race review</div></div>
        <div class="hint" style="margin-bottom:10px">No written review yet. Ask the coach for a personalised breakdown of this race.</div>
        <button class="btn btn-outline btn-sm" id="hyrox-coach">${icons.spark} Ask coach to review this race</button></div>`;

  return ranks + waterfallCard(r, stationBests) + simulatorCard(r, races, stationBests)
    + stationPercentileCard(r.segments) + stationRadarCard(r.segments)
    + pacingCard(r) + standingCard(r) + gapCurveCard(r) + roxzoneCard(r)
    + breakdown + feedback
    + comparePastCard(r, pastAvg) + targetCalcCard(r) + table + coach;
}

function askCoachAboutRace(r) {

`**Race:** ${r.city || ''} (${r.event_date || ''}) — finish ${r.total_display || ''}, #${r.rank || '—'} overall${r.field_size ? '/' + r.field_size : ''}${r.rank_age_group ? `, #${r.rank_age_group} in ${r.age_group || 'AG'}` : ''}.

// Garmin login through the local runner: password →
// optional MFA code. Credentials go to this VM over HTTPS and are held in
// the runner's memory only for the handshake; the token lands on the VM.
function openGarminLoginModal() {
  openModal(`
    <div class="modal-h">
      <div>
        <div class="modal-title">Connect Garmin</div>
        <div class="modal-sub">Sign in once — the token then self-maintains for ~a year.</div>
      </div>
      <button class="modal-close" data-close>${icons.x}</button>
    </div>
    <div class="field"><label for="gl-email">Garmin email</label><input id="gl-email" value="${escHtml(state.user.email || '')}" autocomplete="off"></div>
    <div class="field"><label for="gl-pass">Garmin password</label><input type="password" id="gl-pass" autocomplete="new-password">
      <div class="hint" style="color:var(--amber)">Your <b>Garmin</b> account password — NOT the password you used to open this site. If the browser auto-filled this field, clear it and type the Garmin one.</div></div>
    <div class="field" id="gl-mfa-row" style="display:none"><label for="gl-mfa">MFA code</label><input id="gl-mfa" inputmode="numeric" autocomplete="one-time-code"></div>
    <div class="hint" id="gl-status">Credentials go only to this VM (HTTPS) — never stored or logged; only the Garmin token is kept.</div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-close>Cancel</button>
      <button class="btn btn-primary" id="gl-submit">Sign in</button>
    </div>`);
  let phase = 'creds';
  // Browsers autofill the saved PORTAL password into any password box on this
  // site — that sends the wrong secret to Garmin. Blank it just after render.
  setTimeout(() => { const p = document.getElementById('gl-pass'); if (p && !p.dataset.touched) p.value = ''; }, 400);
  document.getElementById('gl-pass')?.addEventListener('input', e => { e.target.dataset.touched = '1'; });
  const status = t => { const el = document.getElementById('gl-status'); if (el) el.textContent = t; };
  const poll = async () => {
    if (!document.getElementById('gl-status')) return;          // modal closed
    let s;
    try { s = await (await fetch('api/garmin/status')).json(); }
    catch { setTimeout(poll, 2000); return; }
    const btn = document.getElementById('gl-submit');
    if (s.status === 'authenticating') {
      status('Authenticating with Garmin… (the library tries several sign-in routes — this can take a few minutes)');
      setTimeout(poll, 2000);
    } else if (s.status === 'waiting_retry') {
      status('Garmin is rate-limiting this server (429). The runner keeps retrying by itself — '
        + (s.detail || '') + '. You can close this window: a Telegram message arrives when it connects or needs an MFA code.');
      setTimeout(poll, 15000);
    } else if (s.status === 'pending_mfa') {
      phase = 'mfa';
      document.getElementById('gl-mfa-row').style.display = '';
      if (btn) { btn.disabled = false; btn.textContent = 'Verify code'; }
      status('Garmin sent you an MFA code — enter it above.');
      document.getElementById('gl-mfa')?.focus();
    } else if (s.status === 'ok') {
      closeModal();
      toast('ok', 'Garmin connected', 'Token saved on the VM — a full sync is already running; data refreshes in a few minutes.');
    } else if (s.status === 'error') {
      if (btn) btn.disabled = false;
      status('Failed: ' + (s.error || 'unknown error') + (phase === 'mfa' ? ' — cancel and restart the login.' : ''));
    }
  };
  on('gl-submit', 'click', async () => {
    const btn = document.getElementById('gl-submit');
    const post = (p, body) => fetch('api/garmin/' + p, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (phase === 'mfa') {
      const code = (val('gl-mfa') || '').trim();
      if (!code) { status('Enter the MFA code first.'); return; }
      btn.disabled = true;
      await post('mfa', { code });
    } else {
      const password = val('gl-pass');
      if (!password) { status('Enter your password first.'); return; }
      btn.disabled = true;
      await post('login', { email: (val('gl-email') || '').trim(), password });
    }
    setTimeout(poll, 1500);
  });
}

// The runner's record of the last sync job (null on error).
async function fetchLastSyncRun() {
  try {
    const res = await fetch(`${API}/repos/${REPO}/actions/workflows/sync.yml/runs?per_page=1`, { headers: JSON_HDR });
    if (!res.ok) return null;
    const j = await res.json();
    return (j.workflow_runs || [])[0] || null;
  } catch { return null; }
}

// Per-endpoint outcome of the last sync (from sync-status.json) — makes a
// "partial" sync explain itself instead of silently showing stale numbers.
function syncEndpointTable(ss) {
  const eps = ss && ss.endpoints ? Object.entries(ss.endpoints) : [];
  if (!eps.length) return '';
  const bad = eps.filter(([, v]) => !v.ok);
  if (!bad.length) return `<div class="settings-row"><span class="settings-label">Endpoints</span><span class="settings-value" style="color:var(--emerald)">all ${eps.length} OK</span></div>`;
  return `<div class="settings-row" style="align-items:flex-start"><span class="settings-label">Failed endpoints</span><span class="settings-value" style="text-align:right">
    ${bad.map(([k, v]) => `<div style="color:var(--rose)">${escHtml(k.replace(/_/g, ' '))}<span style="color:var(--text-3);font-weight:400"> — ${escHtml((v.error || '').slice(0, 80))}</span></div>`).join('')}
  </span></div>`;
}

function syncRunHtml(run) {
  if (!run) return '<span style="color:var(--text-3)">no runs yet</span>';
  const when = formatTimeAgo(run.run_started_at || run.created_at);
  let label = 'running…', color = 'var(--sky)';
  if (run.status === 'completed') {
    const ok = run.conclusion === 'success';
    label = ok ? 'succeeded' : (run.conclusion || 'failed');
    color = ok ? 'var(--emerald)' : 'var(--rose)';
  }
  return `<a href="${run.html_url}" target="_blank" rel="noopener" style="color:${color};font-weight:600">${label}</a> · ${when}`;
}

      <div class="card">
        <div class="card-h"><div class="card-title"><span class="ico">${icons.sync}</span>Actions</div></div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-ghost btn-block" id="set-sync">${icons.sync} Sync latest from Garmin</button>
          <button class="btn btn-ghost btn-block" id="set-coach">${icons.spark} Generate / adapt plan (ask Coach)</button>
          <button class="btn btn-outline btn-block" id="set-export">${icons.download} Export plan.json</button>
          <button class="btn btn-outline btn-block" id="set-hyrox">${icons.hyrox} View HYROX results</button>
        </div>
      </div>
    </div>

    <div class="span-12">${hyroxImportCard()}</div>
    <div class="span-12">${eventsCard(events)}</div>
  </div></div>`;

  on('set-sync', 'click', e => syncFromGarmin(e.currentTarget));
  on('set-sync-now', 'click', e => syncFromGarmin(e.currentTarget));  // honest wait + refresh inside
  on('set-logout', 'click', async () => {
    await fetch('api/auth/logout', { method: 'POST', headers: JSON_HDR }).catch(() => {});
    location.reload();
  });
  on('garmin-connect', 'click', () => openGarminLoginModal());
  on('set-coach', 'click', () => openCoachModal());
  on('set-export', 'click', () => { planStore.export(); toast('ok', 'Exported', 'plan.json downloaded.'); });
  on('set-hyrox', 'click', () => goTab('hyrox'));
  bindHyroxImport(page);
  bindEventsCard(page);
}

// ── Settings: HYROX race import (hyresult.com profile) ──
function hyroxImportCard() {
  return `<div class="card">
    <div class="card-h"><div class="card-title"><span class="ico">${icons.hyrox}</span>HYROX races</div></div>
    <div class="hint" style="margin-bottom:12px">Import every race from your <a href="https://www.hyresult.com" target="_blank" rel="noopener">hyresult.com</a> profile — per-race Overall + Age-group placing and full splits. Paste your profile URL or slug.</div>
    <div style="display:grid;grid-template-columns:1fr 90px auto;gap:10px;align-items:end">
      <div class="field" style="margin:0"><label for="hx-slug">Profile URL or slug</label><input id="hx-slug" placeholder="victor-perez-rodriguez"></div>
      <div class="field" style="margin:0"><label for="hx-gender">Gender</label><select id="hx-gender"><option value="M">M</option><option value="F">F</option></select></div>
      <button class="btn btn-primary" id="hx-import">Import races</button>
    </div>
    <div class="hint" id="hx-status" style="margin-top:10px"></div>
  </div>`;
}

async function dispatchHyrox(inputs) {
  const res = await fetch(`${API}/repos/${REPO}/actions/workflows/hyrox.yml/dispatches`,
    { method: 'POST', headers: JSON_HDR, body: JSON.stringify({ inputs }) });
  if (!res.ok && res.status !== 204) throw new Error(await jobError(res));
}

// Poll the committed hyrox.json on raw (public, no Pages-deploy wait) until the
// import workflow overwrites it for this profile slug; returns the race count.
async function pollHyrox(slug, prevName, { tries = 25, delay = 6000 } = {}) {
  const url = './data/hyrox.json';
  for (let i = 0; i < tries; i++) {
    await new Promise(r => setTimeout(r, delay));
    try {
      const res = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
      if (res.ok) {
        const p = await res.json();
        if (p.search_name === slug && p.search_name !== prevName) return (p.results || []).length;
      }
    } catch {}
  }
  return null;
}

function bindHyroxImport(page) {
  const status = page.querySelector('#hx-status');
  on('hx-import', 'click', e => withBusy(e.currentTarget, 'Importing…', async () => {
      let slug = val('hx-slug').trim();
    const m = slug.match(/\/athlete\/([a-z0-9-]+)/i);   // accept a full profile URL too
    if (m) slug = m[1];
    slug = slug.replace(/^\/+|\/+$/g, '');
    if (!slug) { toast('err', 'Slug required', 'Paste your hyresult profile URL or slug.'); return; }
    let prevName = null;
    try { const r0 = await fetch(`./data/hyrox.json?t=${Date.now()}`, { cache: 'no-store' }); if (r0.ok) prevName = (await r0.json()).search_name; } catch {}
    await dispatchHyrox({ mode: 'profile', slug, gender: val('hx-gender') || 'M' });
    status.textContent = 'Importing from hyresult.com… ~30–60s, then the dashboard redeploys.';
    const count = await pollHyrox(slug, prevName);
    if (count == null) { status.textContent = 'Import started — your races appear here once it finishes (~1 min).'; return; }
    status.textContent = `Imported ${count} race(s). The dashboard refreshes on the next redeploy (~1 min).`;
  }));
}

// ── Settings: upcoming events ──
const EVENT_TYPES = ['HYROX', '5K', '10K', 'Half Marathon', 'Marathon', 'Other'];
function eventRow(ev = {}) {
  return `<div class="ev-row" style="display:grid;grid-template-columns:140px 1fr 130px 90px 32px;gap:8px;align-items:center;margin-bottom:8px">
    <input type="date" value="${escHtml(ev.date || '')}" data-ev="date" class="mono-input">
    <input type="text" placeholder="Event name / city" value="${escHtml(ev.name || '')}" data-ev="name">
    <select data-ev="type">${EVENT_TYPES.map(t => `<option ${ev.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <input type="text" placeholder="goal" value="${escHtml(ev.goal_time || '')}" data-ev="goal_time" class="mono-input">
    <button class="btn-icon" data-ev-remove aria-label="Remove event">×</button>
  </div>`;
}
function eventsCard(events) {
  const rows = (events && events.length ? events : []).map(eventRow).join('') || eventRow();
  return `<div class="card">
    <div class="card-h"><div class="card-title"><span class="ico">${icons.calendar || icons.hyrox}</span>Upcoming events</div></div>
    <div class="hint" style="margin-bottom:12px">Add your next races/runs. The coach reads these (with your health metrics) to taper into events and build between them — ask it to "rebalance my plan around my events".</div>
    <div id="events-rows">${rows}</div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn btn-outline btn-sm" id="ev-add">+ Add event</button>
      <button class="btn btn-primary btn-sm" id="ev-save">${icons.check || ''} Save events</button>
    </div>
  </div>`;
}
function bindEventsCard(page) {
  const rows = page.querySelector('#events-rows');
  if (!rows) return;
  const bindRemoves = () => rows.querySelectorAll('[data-ev-remove]').forEach(b =>
    b.onclick = () => b.closest('.ev-row').remove());
  bindRemoves();
  on('ev-add', 'click', () => { rows.insertAdjacentHTML('beforeend', eventRow()); bindRemoves(); });
  on('ev-save', 'click', e => withBusy(e.currentTarget, 'Saving…', async () => {
      const list = [...rows.querySelectorAll('.ev-row')].map(r => {
      const g = k => (r.querySelector(`[data-ev="${k}"]`)?.value || '').trim();
      return { date: g('date'), name: g('name'), type: g('type'), goal_time: g('goal_time') };
    }).filter(ev => ev.date || ev.name).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    const res = await fetch(`${API}/repos/${REPO}/actions/workflows/save-events.yml/dispatches`,
      { method: 'POST', headers: JSON_HDR, body: JSON.stringify({ inputs: { data: JSON.stringify(list) } }) });
    if (!res.ok && res.status !== 204) throw new Error(await jobError(res));
    toast('ok', 'Events saved', 'Rebuilding (~1–2 min). Ask the coach to rebalance your plan around them.');
  }));
}

// ═══════════════════════════════════════════════════════
// UTILITIES (preserved)
// ═══════════════════════════════════════════════════════
function on(id, event, handler) { document.getElementById(id)?.addEventListener(event, handler); }
function val(id) { return (document.getElementById(id)?.value || '').trim(); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

function labelValue(label, value) {
  if (value == null || value === '') return '';
  return `<div class="lv"><span class="lv-label">${label}</span><span class="lv-val">${escHtml(String(value))}</span></div>`;
}
function detailItem(value, label) {
  return `<div class="detail-item"><div class="d-val">${value}</div><div class="d-lbl">${label}</div></div>`;
}

function formatPace(secPerKm) {
  if (!secPerKm || secPerKm <= 0) return '—';
  const m = Math.floor(secPerKm / 60); const s = Math.round(secPerKm % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function formatSeconds(totalSec) {
  if (!totalSec || totalSec <= 0) return '—';
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = Math.round(totalSec%60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function formatTimeAgo(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return new Date(iso).toLocaleDateString();
}

// ── Boot ───────────────────────────────────────────────
try { sessionStorage.removeItem('pf_gh_token' + NS); } catch {}   // pre-runner PAT, no longer used
try { const u = JSON.parse(localStorage.getItem(USER_KEY) || 'null'); if (u && u.name) state.user = u; } catch {}
render();

// ── Auto-refresh: the server syncs every ~15 min on its own now ──
// Re-render when a newer sync has landed; otherwise just keep the chip honest.
let _lastSyncSeen = '';
async function checkForFreshSync(rerender) {
  const ss = await loadSyncStatus();
  if (!ss) return;
  const ts = ss.last_success || ss.last_attempt || '';
  if (!_lastSyncSeen) { _lastSyncSeen = ts; return; }
  // Never yank the page out from under an open modal or a field being typed in.
  const busy = document.getElementById('modal-overlay')
    || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if (ts !== _lastSyncSeen) {
    _lastSyncSeen = ts;
    if (rerender && !busy) await refreshAfterSync();
  } else {
    const chip = document.getElementById('sync-chip');
    if (chip) chip.outerHTML = syncChipHtml(ss);
  }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkForFreshSync(true);
});
setInterval(() => { if (!document.hidden) checkForFreshSync(true); }, 90000);
checkForFreshSync(false);
// Name the athlete this instance belongs to, before Settings is ever opened.
profileMeta().then(p => {
  if (p.name === state.user.name && p.email === state.user.email) return;
  state.user = { name: p.name, email: p.email, role: p.role };
  try { localStorage.setItem(USER_KEY, JSON.stringify(state.user)); } catch {}
  render();
});
