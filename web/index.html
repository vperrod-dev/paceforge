<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="pf-180.png">
<meta name="apple-mobile-web-app-title" content="PaceForge">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D12">
<title>PaceForge</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='18' width='5' height='8' rx='1' fill='%2310B981' opacity='.3'/><rect x='13' y='12' width='5' height='14' rx='1' fill='%2310B981' opacity='.6'/><rect x='20' y='5' width='5' height='21' rx='1' fill='%2310B981'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Surfaces (near-black, layered) ── */
  --bg:#0B0D12;--bg-2:#0E1118;--surface:#12151E;--card:#161A24;--elevated:#1B202C;--hover:#1F2430;
  --border:rgba(150,165,200,.10);--border-s:rgba(150,165,200,.06);--border-x:rgba(150,165,200,.18);
  /* ── Text ── */
  --text:#EAEEF6;--text-2:#9AA4BC;--text-3:#5E6678;
  /* ── Accents ── */
  --emerald:#13C892;--emerald-2:#34D8A8;--emerald-d:rgba(19,200,146,.14);--emerald-g:rgba(19,200,146,.06);
  --amber:#F5A623;--amber-d:rgba(245,166,35,.14);
  --sky:#38BDF8;--sky-d:rgba(56,189,248,.14);
  --rose:#FB5A6E;--rose-d:rgba(251,90,110,.14);
  --violet:#A78BFA;--violet-d:rgba(167,139,250,.14);
  /* ── Geometry ── */
  --r:16px;--r-md:12px;--r-sm:9px;--r-pill:999px;
  --sp:4px;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 8px 30px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  --ease:cubic-bezier(.22,1,.36,1);
  --t-fast:.14s;--t:.24s;
  --font-d:'Bricolage Grotesque',sans-serif;--font-b:'Figtree',sans-serif;--font-m:'JetBrains Mono',monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --sidebar-w:248px;--maxw:1320px;
}
html{height:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--font-b);color:var(--text);
  background:
    radial-gradient(1200px 600px at 12% -8%,rgba(19,200,146,.10),transparent 60%),
    radial-gradient(900px 500px at 100% 0%,rgba(56,189,248,.06),transparent 55%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--emerald);text-decoration:none}
::selection{background:var(--emerald-d);color:var(--emerald-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--elevated);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--hover);background-clip:padding-box}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ════════ APP SHELL ════════ */
#app{min-height:100dvh}
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100dvh}

/* ── Sidebar (desktop) ── */
.sidebar{
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(18,21,30,.9),rgba(11,13,18,.9));
  border-right:1px solid var(--border);padding:22px 16px;backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.brand-mark{width:34px;height:34px;flex-shrink:0}
.brand-name{font-family:var(--font-d);font-weight:700;font-size:1.18rem;letter-spacing:-.02em}
.brand-name .dot{color:var(--emerald)}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav-label{font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);
  color:var(--text-2);font-weight:600;font-size:.9rem;cursor:pointer;border:none;background:none;
  width:100%;text-align:left;transition:background var(--t-fast),color var(--t-fast);position:relative;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--emerald-d);color:var(--emerald-2)}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--emerald)}
.sidebar-foot{border-top:1px solid var(--border);padding-top:14px;margin-top:8px}
.side-user{display:flex;align-items:center;gap:10px;padding:6px 8px}
.side-avatar{width:34px;height:34px;border-radius:50%;background:var(--emerald-d);color:var(--emerald-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.side-user-name{font-weight:600;font-size:.85rem;line-height:1.2}
.side-user-mail{font-size:.72rem;color:var(--text-3);line-height:1.2}

/* ── Main ── */
.main{min-width:0;display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto}
.page-inner{max-width:var(--maxw);margin:0 auto;padding:28px 36px 64px;width:100%}

/* ── Top bar (sticky) ── */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:16px 36px;border-bottom:1px solid var(--border);
  background:rgba(11,13,18,.72);backdrop-filter:blur(16px);
}
.topbar .page-title{font-family:var(--font-d);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.topbar .page-sub{font-size:.8rem;color:var(--text-2);margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ── Bottom tab bar (mobile only) ── */
.tab-bar{display:none}

/* ════════ BUTTONS ════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border:1px solid transparent;border-radius:var(--r-sm);
  font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;
  transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast),opacity var(--t-fast);
}
.btn svg{width:17px;height:17px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--emerald);color:#06251A;box-shadow:0 6px 18px -8px var(--emerald)}
.btn-primary:hover:not(:disabled){background:var(--emerald-2)}
.btn-ghost{background:var(--elevated);color:var(--text);border-color:var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--hover);border-color:var(--border-x)}
.btn-outline{background:transparent;color:var(--text-2);border-color:var(--border-x)}
.btn-outline:hover:not(:disabled){color:var(--text);background:var(--elevated)}
.btn-danger{background:var(--rose-d);color:var(--rose);border-color:rgba(251,90,110,.3)}
.btn-danger:hover:not(:disabled){background:rgba(251,90,110,.2)}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:var(--r-sm)}
.btn-icon{width:38px;height:38px;padding:0;border-radius:var(--r-sm);background:var(--elevated);border:1px solid var(--border);color:var(--text-2)}
.btn-icon:hover{color:var(--text);background:var(--hover)}
.btn-block{width:100%}
.btn-link{background:none;border:none;color:var(--text-2);font-size:.85rem;cursor:pointer;font-weight:600}
.btn-link:hover{color:var(--emerald)}

/* ════════ CARDS ════════ */
.card{
  background:linear-gradient(180deg,var(--card),var(--surface));
  border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);
}
.card-pad-sm{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-title{font-family:var(--font-d);font-weight:600;font-size:1rem;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.card-title .ico{color:var(--emerald)}
.card-title .ico svg{width:18px;height:18px}
.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

/* ── Grids ── */
.grid{display:grid;gap:18px}
.stat-row{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cols-auto{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.dash-grid{display:grid;gap:18px;grid-template-columns:repeat(12,1fr)}
.dash-grid>*{min-width:0}   /* grid items default min-width:auto — long content otherwise widens the track past the viewport */
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}
.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.mt{margin-top:18px}.mt-sm{margin-top:10px}

/* ── Stat cards (hero) ── */
.stat{
  background:linear-gradient(160deg,var(--card),var(--surface));
  border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;
  position:relative;overflow:hidden;transition:border-color var(--t),transform var(--t);
}
.stat:hover{border-color:var(--border-x);transform:translateY(-2px)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--accent,var(--emerald));opacity:.07;filter:blur(8px)}
.stat-label{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.stat-value{font-family:var(--font-m);font-size:2rem;font-weight:700;line-height:1.05;margin-top:10px;letter-spacing:-.02em}
.stat-value .unit{font-size:.9rem;color:var(--text-3);font-weight:500;margin-left:3px}
.stat-sub{font-size:.78rem;color:var(--text-2);margin-top:6px;display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);background:var(--accent-d,var(--emerald-d));color:var(--accent,var(--emerald))}
.dotmark{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* ── Mini label/value rows ── */
.lv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-s);font-size:.88rem}
.lv:last-child{border-bottom:none}
.lv-label{color:var(--text-2)}
.lv-val{font-weight:600;font-family:var(--font-m);font-size:.86rem}

/* ── Gauges ── */
.gauge-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.gauge-row:last-child{margin-bottom:0}
.gauge-tag{font-size:.78rem;color:var(--text-2);width:96px;flex-shrink:0}
.gauge-bar{flex:1;height:8px;background:var(--elevated);border-radius:var(--r-pill);overflow:hidden}
.gauge-fill{height:100%;border-radius:var(--r-pill)}
.gauge-num{font-family:var(--font-m);font-size:.78rem;width:46px;text-align:right;color:var(--text-2)}
.grade-badge{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:var(--r-pill)}

/* ════════ ACTIVITY / WORKOUT ITEMS ════════ */
.act-item{
  display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:var(--r-md);
  border:1px solid transparent;cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast);
}
.act-item:hover{background:var(--elevated);border-color:var(--border)}
.act-bar{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0}
.act-icon{width:38px;height:38px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--elevated)}
.act-icon svg{width:18px;height:18px}
.act-info{flex:1;min-width:0}
.act-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-meta{font-size:.78rem;color:var(--text-2);margin-top:2px}
.act-stat{text-align:right;flex-shrink:0}
.act-stat .v{font-family:var(--font-m);font-weight:600;font-size:.9rem}
.act-stat .l{font-size:.66rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.wo-badge{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;flex-shrink:0}

.divlist > * + *{border-top:1px solid var(--border-s)}

/* ── Week selector ── */
.week-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:thin}
.week-btn{
  flex-shrink:0;padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--elevated);color:var(--text-2);font-size:.82rem;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all var(--t-fast);display:flex;flex-direction:column;gap:1px;align-items:flex-start;line-height:1.2;
}
.week-btn small{font-size:.62rem;color:var(--text-3);font-weight:500}
.week-btn:hover{border-color:var(--border-x)}
.week-btn.active{background:var(--emerald-d);color:var(--emerald-2);border-color:rgba(19,200,146,.4)}
.week-btn.active small{color:var(--emerald)}

/* ── Pace grid / editor ── */
.pace-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pace-item{padding:12px 14px;background:var(--elevated);border:1px solid var(--border);border-radius:var(--r-md)}
.pace-item .pl{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700}
.pace-item .pv{font-family:var(--font-m);font-weight:700;font-size:1.05rem;color:var(--emerald);margin-top:4px}
.pace-item .pv .u{font-size:.72rem;color:var(--text-3);font-weight:400}

/* ════════ CALENDAR ════════ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day-label{font-size:.68rem;color:var(--text-3);font-weight:700;text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal-day{
  min-height:86px;border:1px solid var(--border-s);border-radius:var(--r-sm);padding:7px 8px;
  cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast);display:flex;flex-direction:column;gap:4px;
}
.cal-day:hover{background:var(--elevated);border-color:var(--border)}
.cal-day.today{border-color:rgba(19,200,146,.5)}
.cal-day.today .cal-num{color:var(--emerald)}
.cal-day.selected{background:var(--emerald-d);border-color:var(--emerald)}
.cal-day.other-month{opacity:.35}
.cal-num{font-size:.82rem;font-weight:600;font-family:var(--font-m)}
.cal-pill{font-size:.64rem;padding:2px 6px;border-radius:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.cal-grid.compact{gap:4px}
.cal-grid.compact .cal-day{min-height:44px;padding:5px 6px;gap:3px}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cal-dot{width:6px;height:6px;border-radius:50%}
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.detail-head .btn svg{width:15px;height:15px}
.detail-h-title{font-size:1.15rem;font-weight:700;line-height:1.2}
.detail-h-sub{font-size:.82rem;color:var(--text-3);margin-top:2px}

/* ════════ HYROX ════════ */
.hyrox-station{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-s)}
.hyrox-station:last-child{border-bottom:none}
.hyrox-name{font-size:.86rem;font-weight:500}
.hyrox-time{font-family:var(--font-m);font-size:.9rem;font-weight:600}

/* ════════ SETTINGS ════════ */
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border-s)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:.9rem;font-weight:500}
.settings-value{font-size:.85rem;color:var(--text-2);font-family:var(--font-m)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin-bottom:7px}
.field input,.field textarea,.field select,.bm-field input,.ev-row input,.ev-row select{
  width:100%;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:12px 14px;font-size:.92rem;outline:none;transition:border-color var(--t-fast);
}
.field input:focus,.field textarea:focus,.field select:focus,.bm-field input:focus,.ev-row input:focus,.ev-row select:focus{border-color:var(--emerald)}
.field .hint{font-size:.74rem;color:var(--text-3);margin-top:6px;line-height:1.45}
.mono-input{font-family:var(--font-m)}
.conn-status{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;padding:5px 11px;border-radius:var(--r-pill)}
.conn-on{background:var(--emerald-d);color:var(--emerald)}
.conn-off{background:var(--elevated);color:var(--text-3)}
.sync-chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap}
.sync-chip.sync-ok{background:var(--emerald-d);color:var(--emerald)}
.sync-chip.sync-warn{background:var(--amber-d);color:var(--amber)}
.sync-chip.sync-err{background:var(--rose-d);color:var(--rose)}

/* ── Sub tabs ── */
.sub-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px;scrollbar-width:thin}
.sub-tab{
  flex-shrink:0;padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:var(--elevated);color:var(--text-2);font-size:.82rem;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all var(--t-fast);
}
.sub-tab:hover{border-color:var(--border-x)}
.sub-tab.active{background:var(--emerald-d);color:var(--emerald-2);border-color:rgba(19,200,146,.4)}

/* ════════ STATES ════════ */
.loading{display:flex;justify-content:center;padding:64px 0}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--emerald);border-radius:50%;animation:spin .6s linear infinite}
.empty{
  text-align:center;padding:48px 24px;color:var(--text-3);font-size:.92rem;
  border:1px dashed var(--border-x);border-radius:var(--r);background:var(--surface);
}
.empty .e-ico{width:46px;height:46px;margin:0 auto 14px;border-radius:14px;background:var(--elevated);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.empty .e-ico svg{width:24px;height:24px}
.empty .e-title{color:var(--text);font-weight:600;font-size:1rem;margin-bottom:6px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r-md);font-size:.86rem}
.banner.warn{background:var(--amber-d);border:1px solid rgba(245,166,35,.3);color:var(--text)}
.banner .b-ico{flex-shrink:0;color:var(--amber)}
.banner .b-ico svg{width:20px;height:20px}

/* ════════ ANIMATIONS ════════ */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp .32s var(--ease)}
.fade-in > *{animation:fadeUp .4s var(--ease) backwards}
.fade-in > *:nth-child(2){animation-delay:.04s}
.fade-in > *:nth-child(3){animation-delay:.08s}
.fade-in > *:nth-child(4){animation-delay:.12s}
.fade-in > *:nth-child(5){animation-delay:.16s}

/* ════════ MODAL ════════ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(5,7,11,.66);backdrop-filter:blur(4px);z-index:200;
  opacity:0;transition:opacity var(--t);pointer-events:none;display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;

<body>
<div id="app"></div>
<div id="toasts"></div>

<script>
// ═══════════════════════════════════════════════════════
// PaceForge — single-user static training dashboard
// Data layer (apiJson / loadJSON) reads ./data/*.json only.
// Actions post to the local job runner (scripts/runner.py) on this origin.
// ═══════════════════════════════════════════════════════

// ── State ──────────────────────────────────────────────
const state = {
  // Placeholder until profile.json loads — every instance serves its own athlete.
  user: { name: 'Athlete', email: '', role: 'user' },
  tab: 'today',
};
// The job runner serves this page, so its API is same-origin and needs no auth
// beyond the portal session cookie. The /repos/<owner>/<repo>/… URL shapes are
// inherited from the GitHub Actions era it replaced — the runner ignores owner
// and repo, hence the placeholder.
const REPO = 'local/paceforge';
const API = 'api/gh';
const JSON_HDR = { 'Content-Type': 'application/json' };
// Browser storage is per-ORIGIN, and every instance is served from the same host
// under a different base path (/paceforge, /pf/<name>, …). Suffix every storage
// key with that base so two portals open in one browser never mix state.
const NS = '@' + (location.pathname.replace(/\/(index\.html)?$/, '') || '/');
const RPE_PENDING_KEY = 'pf_rpe_pending' + NS;
const BENCHMARKS_KEY = 'pf_benchmarks' + NS;
const USER_KEY = 'pf_user' + NS;

// ═══════════════════════════════════════════════════════
// STATIC DATA LAYER  (unchanged contract — DO NOT BREAK)
// ═══════════════════════════════════════════════════════
const cache = {};

// Live files change server-side every few minutes (15-min light syncs,
// intraday pulses) — caching them for the page's lifetime shows stale data.
const NEVER_CACHE = new Set(['sync-status.json', 'daily-brief.json', 'calendar.json']);

async function loadJSON(file) {
  const key = 'f:' + file;
  if (cache[key] && !NEVER_CACHE.has(file)) return cache[key];
  const res = await fetch('./data/' + file);
  if (!res.ok) throw new Error('Failed to load ' + file);
  const v = await res.json();
  cache[key] = v;
  return v;
}

// Drop every file cache entry — used when a sync lands so re-renders refetch.
function clearFileCache() {
  for (const k of Object.keys(cache)) if (k.startsWith('f:')) delete cache[k];
}

async function apiJson(path, opts = {}) {
  const p = path.split('?')[0];
  if (opts.method && opts.method !== 'GET') return {};   // static: no writes
  switch (p) {
    case '/profile/analytics': return loadJSON('analytics.json');
    case '/plans': { const plan = await planStore.get().catch(() => null); return plan ? [plan] : []; }
    case '/activities': return allActivities();
    case '/auth/profile': return profileMeta();
    case '/garmin/status': {
      // Truthful connection state: derived from the last sync attempt's outcome,
      // not from profile.json merely existing (which survives failed syncs).
      const ss = await loadSyncStatus();
      if (ss) {
        const ts = ss.last_success || ss.last_attempt;
        const fresh = ts && (Date.now() - Date.parse(ts)) < 48 * 3600 * 1000;
        return { connected: ss.result !== 'failed' && !!fresh, sync: ss };
      }
      const pr = await loadJSON('profile.json').catch(() => null);
      return { connected: !!(pr && pr.profile_date), sync: null };
    }
    case '/weekly-overview': return loadJSON('weekly.json').catch(() => ({ content: null }));
    case '/feed': return feedFromActivities();
    default:
      if (p.startsWith('/feed/')) return [];
      return null;
  }
}

async function loadSyncStatus() {
  return loadJSON('sync-status.json').catch(() => null);
}

// Topbar freshness chip: green synced / amber partial-or-stale / red failing.
// The only honest signal — profile.json keeps old values across failed syncs.
function syncChipHtml(ss) {
  if (!ss) return '';
  const ts = ss.last_success || ss.last_attempt;
  const hours = ts ? (Date.now() - Date.parse(ts)) / 3.6e6 : Infinity;
  const failed = Object.entries(ss.endpoints || {}).filter(([, v]) => !v.ok).map(([k]) => k.replace(/_/g, ' '));
  let cls = 'ok', label = `Synced ${formatTimeAgo(ts)}`, title = 'Garmin sync healthy';
  if (ss.result === 'partial') {
    cls = 'warn';
    label = `Partial sync · ${formatTimeAgo(ts)}`;
    title = failed.length ? `Failed: ${failed.join(', ')}` : 'Some wellness data missing';
  }
  // Light syncs land every ~15 min during the day; overnight (23:00-06:45)
  // there are no passes, so only flag staleness the schedule could have avoided.
  const hr = new Date().getHours();
  const staleAfter = (hr >= 8 && hr < 23) ? 2 : 10;
  if (ss.result === 'ok' && hours > staleAfter) {
    cls = 'warn'; label = `Stale · synced ${formatTimeAgo(ts)}`; title = 'No recent sync run';
  }
  if (ss.result === 'failed') {
    cls = 'err';
    label = ss.last_success ? `Sync failing · last good ${formatTimeAgo(ss.last_success)}` : 'Sync failing';
    title = ss.error || 'Sync is failing';
  }
  const age = ss.token && ss.token.age_days;
  if (age != null && age >= 300 && cls === 'ok') {
    cls = 'warn'; label += ` · token ${age}d old`;
    title = 'Garmin token expires ~yearly — run `paceforge login` soon';
  }
  return `<span class="sync-chip sync-${cls}" id="sync-chip" title="${escHtml(title)}"><span class="dotmark"></span>${escHtml(label)}</span>`;
}

// Identity comes from this instance itself — the portal account it is running for
// and the address its Garmin login was made with — so every portal shows its own
// athlete.
async function profileMeta() {
  const pr = await loadJSON('profile.json').catch(() => ({}));
  const tm = await loadJSON('token-meta.json').catch(() => ({}));
  const who = await fetch('api/auth/whoami').then(r => r.json()).catch(() => ({}));
  const name = who.user ? who.user.charAt(0).toUpperCase() + who.user.slice(1) : state.user.name;
  const email = tm.email || who.email || state.user.email;
  return { name, email, role: 'user', status: 'active',
           garmin_email: email, created_at: pr.profile_date || '' };
}

// Garmin activities + app-recorded bike rides (data/bike/rides.json) as one
// list. Rides never reach Garmin, so they get pseudo-activity entries here —
// same ids ("bike:<date>") the load engine uses.
let _actsCache = null, _actsCacheAt = 0;
const ACTS_CACHE_TTL = 15_000; // 15s cache invalidates on data changes

async function allActivities() {
  if (_actsCache && Date.now() - _actsCacheAt < ACTS_CACHE_TTL) return _actsCache;
  const [acts, rides] = await Promise.all([
    loadJSON('activities.json').catch(() => []),
    loadJSON('bike/rides.json').then(r => r.rides || []).catch(() => []),
  ]);
  const bike = rides.map(r => ({
    activity_id: 'bike:' + r.date, name: r.workout || 'Indoor ride',
    activity_type: 'indoor_cycling', start_time: r.date,
    duration_seconds: r.duration_sec, avg_hr: r.avg_hr,
    calories: r.kj ? Math.round(r.kj) : null, bike: r,
  }));
  _actsCache = [...acts, ...bike].sort((a, b) => String(b.start_time || '').localeCompare(String(a.start_time || '')));
  _actsCacheAt = Date.now();
  return _actsCache;
}

async function feedFromActivities() {
  const acts = await allActivities();
  return acts.slice(0, 20).map(a => ({

// ═══════════════════════════════════════════════════════
// PLAN STORE  — localStorage-backed editable plan
// Seeded from ./data/plan.json on first load (key: pf_plan).
// All Plan-view reads go through planStore.get().
// ═══════════════════════════════════════════════════════
const PLAN_KEY = 'pf_plan' + NS;
const planStore = {
  _mem: null,
  async _seed() {
    let plan;
    try { plan = await loadJSON('plan.json'); } catch { return null; }  // deleted server-side
    return plan ? JSON.parse(JSON.stringify(plan)) : null;
  },
  async get() {
    if (this._mem) return this._mem;
    const raw = localStorage.getItem(PLAN_KEY);
    if (raw) { try { this._mem = JSON.parse(raw); } catch {} }
    if (this._mem) {
      // A new plan_id server-side means Create/Reassess replaced the whole plan —
      // the cached edits belong to a plan that no longer exists, so reseed instead
      // of silently pinning the browser to the old one forever (2026-08-02: this is
      // why a freshly-regenerated plan kept showing as "the same" in the portal).
      const fresh = await this._checkFresh();
      if (fresh === 'reseed') this._mem = await this._seed();
    }
    else this._mem = await this._seed();
    this._persist();
    return this._mem;
  },
  // The daily Garmin sync marks workouts completed/matched in ./data/plan.json, but the
  // editable plan lives in localStorage. Pull those completions in (additively, so a manual
  // "Mark done" is never un-done) when the synced plan is still the same plan.
  async _checkFresh() {
    let synced;
    try { synced = await loadJSON('plan.json'); } catch { return 'reseed'; }  // gone server-side too
    if (!synced || synced.plan_id !== this._mem.plan_id) return 'reseed';
    await this._mergeSynced(synced);
  },
  async _mergeSynced(synced) {
    if (!synced) { try { synced = await loadJSON('plan.json'); } catch { return; } }
    if (!synced || synced.plan_id !== this._mem.plan_id) return;
    (synced.weeks || []).forEach((sw, wi) => {
      const lw = this._mem.weeks?.[wi];
      (sw.workouts || []).forEach((swo, woi) => {
        const lwo = lw?.workouts?.[woi];
        if (!lwo) return;
        if (!swo.completed) {
          // The server dropped the match (re-match, or an explicit unlink). Only a
          // match-derived completion is cleared — a manual "Mark done" carries no
          // matched ids and stays, which is what keeps the merge additive.
          if ((lwo.matched_activity_ids || []).length) {
            lwo.completed = false;
            lwo.matched_activity_ids = [];
            lwo.completion_analysis = swo.completion_analysis ?? null;
            lwo.completion_metrics = swo.completion_metrics ?? null;
          }
          return;
        }
        lwo.completed = true;
        lwo.matched_activity_ids = swo.matched_activity_ids || lwo.matched_activity_ids;
        lwo.completion_analysis = swo.completion_analysis ?? lwo.completion_analysis;
        lwo.completion_metrics = swo.completion_metrics ?? lwo.completion_metrics;
      });
    });
  },
  _persist() {
    try { localStorage.setItem(PLAN_KEY, JSON.stringify(this._mem)); } catch {}
  },
  // mutator receives the live plan object; mutate it then persist
  async update(mutator) {
    const plan = await this.get();
    mutator(plan);
    this._mem = plan;
    this._persist();
    clearCache('plans');           // invalidate apiJson('/plans') TTL cache
    delete cache['f:plan.json'];   // not strictly needed, but keep synced-source clean
    return plan;
  },
  async reset() {
    delete cache['f:plan.json'];      // bust the in-memory fetch cache — re-read the live file
    localStorage.removeItem(PLAN_KEY); // drop the stale cached plan so _seed wins
    this._mem = await this._seed();
    this._persist();
    clearCache('plans');
    return this._mem;
  },
  // helpers to address a workout deterministically
  workoutKey(weekIdx, woIdx) { return weekIdx + ':' + woIdx; },
  async setPaces(paces) {
    return this.update(plan => {
      ['easy_pace','marathon_pace','threshold_pace','interval_pace','repetition_pace'].forEach(k => {
        if (paces[k] != null && !isNaN(paces[k])) plan[k] = paces[k];
      });
    });
  },
  async toggleComplete(weekIdx, woIdx) {
    return this.update(plan => {
      const wo = plan.weeks?.[weekIdx]?.workouts?.[woIdx];
      if (wo) wo.completed = !wo.completed;
    });
  },
  async reschedule(weekIdx, woIdx, date) {
    return this.update(plan => {
      const wo = plan.weeks?.[weekIdx]?.workouts?.[woIdx];
      if (wo) wo.scheduled_date = date;
    });
  },
  async setNote(weekIdx, woIdx, note) {
    return this.update(plan => {
      const wo = plan.weeks?.[weekIdx]?.workouts?.[woIdx];
      if (wo) wo.notes = note;
    });
  },
  async deleteWorkout(weekIdx, woIdx) {
    return this.update(plan => {
      const week = plan.weeks?.[weekIdx];
      if (week?.workouts) week.workouts.splice(woIdx, 1);
    });
  },
  async export() {
    const plan = await this.get();
    const blob = new Blob([JSON.stringify(plan, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'plan.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
};

// ── ACTION 1: Sync from Garmin (runner job: sync) ──
async function syncFromGarmin(btn) {
  withBusy(btn, 'Syncing…', async () => {
    const baseline = await latestJobRunId('sync.yml');
    const res = await fetch(`${API}/repos/${REPO}/actions/workflows/sync.yml/dispatches`, {
      method: 'POST', headers: JSON_HDR,
    });
    if (res.status !== 204) throw new Error(await jobError(res));
    // A real sync takes ~8s — wait for it and refresh in place, no reload.
    const run = await waitForJobRun('sync.yml', baseline, 45000);
    refreshAfterSync();
    if (run && run.conclusion === 'success') {
      toast('ok', 'Garmin synced', 'Fresh data loaded.');
    } else if (run) {
      toast('err', 'Sync failed', 'Check Settings → Garmin for details.');
    } else {
      toast('warn', 'Sync still running', 'Taking longer than usual — the page will refresh itself when it lands.');
    }
  });
}

// Invalidate everything a completed sync can change, then re-render the tab.

  clearCache('');

  await planStore.reset();

}

// ── ACTION 2b: Log session RPE (runner job: save-rpe) ──
// HR-less strength/HYROX sessions only count toward training load via these.
async function saveRpe(entry) {
  const res = await fetch(`${API}/repos/${REPO}/actions/workflows/save-rpe.yml/dispatches`, {
    method: 'POST', headers: JSON_HDR,
    body: JSON.stringify({ inputs: { data: JSON.stringify(entry) } }),
  });
  if (res.status !== 204) throw new Error(await jobError(res));
  // Optimistic local cache so the pills stay lit until the next data deploy.
  try {
    const pending = JSON.parse(localStorage.getItem(RPE_PENDING_KEY) || '{}');
    pending[entry.activity_id ?? entry.date] = entry;
    localStorage.setItem(RPE_PENDING_KEY, JSON.stringify(pending));
  } catch {}
  // Close the loop: the rating triggers a coach re-read (save-rpe deletes the
  // old analysis, analyze rewrites it) — tell the athlete when it actually lands.
  if (entry.activity_id) watchAnalysisRewrite(entry.activity_id);
}

async function watchAnalysisRewrite(activityId) {
  const url = './data/analyses/' + activityId + '.md';
  const deadline = Date.now() + 6 * 60 * 1000;
  const before = await fetch(url).then(r => r.ok ? r.text() : '').catch(() => '');
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 15000));
    const now_ = await fetch(url).then(r => r.ok ? r.text() : '').catch(() => '');
    if (now_ && now_ !== before) {
      toast('ok', 'Coach re-read your session', 'The analysis now reflects your effort rating.');
      return;
    }
  }
}

async function rpeForActivity(activityId) {
  try {
    const pending = JSON.parse(localStorage.getItem(RPE_PENDING_KEY) || '{}');
    if (pending[activityId]) return pending[activityId].rpe;
  } catch {}
  const data = await loadJSON('rpe.json').catch(() => ({ entries: [] }));
  const e = (data.entries || []).find(e => e.activity_id === activityId);
  return e ? e.rpe : null;
}

// Map CI step names to human-readable plan-building stages (in order).
const PLAN_STAGES = [
  [/build .*plan/i, 'Designing the training structure'],
  [/commit scaffold/i, 'Saved a first draft'],
  [/enrich with ai/i, 'AI coach adding variety & coaching notes'],
  [/complete job/i, 'Publishing your plan'],
];
function planStageList(steps) {
  const icon = (s) => s.status !== 'completed' ? '<span class="spinner" style="width:13px;height:13px;border-width:2px;display:inline-block;vertical-align:-2px"></span>'
    : (s.conclusion === 'success' ? '✅' : s.conclusion === 'skipped' ? '⏭️' : '⚠️');
  const rows = [];
  for (const [re, label] of PLAN_STAGES) {
    const step = steps.find(s => re.test(s.name || ''));
    if (step) rows.push(`<div style="display:flex;gap:8px;align-items:center;justify-content:flex-start;text-align:left;padding:3px 0"><span style="width:18px">${icon(step)}</span><span>${label}</span></div>`);
  }
  return rows.length ? `<div style="max-width:320px;margin:10px auto 0">${rows.join('')}</div>` : '';
}

// ── Plan intake (2026-08-10): the plan is built from what YOU state — goal,
// times, declared volume. Garmin history only prefills and suggests.
const RACE_KM = { '5K': 5, '10K': 10, HALF_MARATHON: 21.0975, MARATHON: 42.195 };

function parseHms(s) {
  const p = (s || '').trim().split(':').map(Number);
  if (p.some(isNaN) || !p.length) return null;
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if (p.length === 2) return p[0] * 60 + p[1];
  return null;
}
function fmtHms(sec) {
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
// Riegel: t2 = t1 * (d2/d1)^1.06 — the standard cross-distance estimate.
function riegel(fromKm, fromSec, toKm) { return fromSec * Math.pow(toKm / fromKm, 1.06); }

      const days = [...document.querySelectorAll('.cp-day:checked')].map(c => c.value);
      if (days.length < 2) { toast('err', 'Pick at least 2 training days', ''); return; }
      const goalSec = parseHms(val('cp-goal'));
      const rd = val('cp-recent-dist');
      const rs = parseHms(val('cp-recent-time'));
      const inputs = {
        mode: 'create', event_type: val('cp-event'), target_date: val('cp-date'),
        days: days.join(','), level: val('cp-level'),
        goal_time: goalSec ? String(goalSec) : '',
        long_run_day: val('cp-lrd'),
      };
      if (rd && rs) inputs.recent_race = `${rd}=${rs}`;
      if (val('cp-weekly')) inputs.weekly_km = val('cp-weekly');
      closeModal();
      dispatchWorkflow('plan.yml', inputs, 'Plan build started',
        'Watch it build below — this page tracks each stage live.');
      planDispatchedAt = Date.now(); goTab('plan');
    });
  });
}

function reassessPlan(btn) {
  dispatchWorkflow('plan.yml', { mode: 'reassess' }, 'Reassess started', 'Watch it below — tracked live.', btn);
  planDispatchedAt = Date.now(); goTab('plan');
}

function deleteFromGarmin(btn) {
  if (!confirm('Delete ALL pushed plan workouts from your Garmin calendar?')) return;
  dispatchWorkflow('garmin-delete.yml', {}, 'Garmin cleanup started',
    'Removing plan workouts from your Garmin calendar.', btn);
}

// Sync one rescheduled/deleted session to the Garmin calendar (calendar-edit.yml).
function calendarSyncSession(sessionId, action, newDate) {
  if (!sessionId) {
    toast('err', 'Not synced to Garmin', 'This plan predates session ids — regenerate it with Create Plan to enable Garmin calendar sync.');
    return;
  }
  const inputs = { session_id: sessionId, action };
  if (newDate) inputs.new_date = newDate;
  dispatchWorkflow('calendar-edit.yml', inputs,
    action === 'delete' ? 'Session removed' : 'Session moved',
    'Garmin syncs shortly; the calendar updates after the next build.');
}

async function jobError(res) {
  let detail = '';
  try { const j = await res.json(); detail = j.message || ''; } catch {}
  if (res.status === 401) return 'Session expired (401). Reload the page and sign in again.';
  if (res.status === 404) return 'Unknown job (404). ' + detail;
  if (res.status === 422) return 'Invalid request (422). ' + detail;
  return `Runner error ${res.status}. ${detail}`;
}

// Run an async action with a busy button + error toast.
async function withBusy(btn, busyLabel, fn) {
  const orig = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.dataset.orig = orig; btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px"></span>${busyLabel}`; }
  try { await fn(); }
  catch (e) { toast('err', 'Action failed', escHtml(e.message || 'Unknown error')); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = orig; } }
}

// ── Toasts ─────────────────────────────────────────────
function toast(kind, title, body) {
  const ico = kind === 'ok' ? icons.check : kind === 'err' ? icons.alert : icons.info;
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<span class="t-ico">${ico}</span><div class="t-body"><b>${escHtml(title)}</b>${body || ''}</div><button class="t-x" aria-label="Dismiss">×</button>`;
  document.getElementById('toasts').appendChild(el);
  const kill = () => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 200); };
  el.querySelector('.t-x').addEventListener('click', kill);
  if (kind !== 'err') setTimeout(kill, 6000); else setTimeout(kill, 10000);
}

// ── Modal ──────────────────────────────────────────────
function openModal(content, wide) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modal-overlay';
  ov.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${content}</div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('open'));
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  document.addEventListener('keydown', escClose);
}
function closeModal() {
  const ov = document.getElementById('modal-overlay');
  if (ov) { ov.classList.remove('open'); setTimeout(() => ov.remove(), 220); }
  document.removeEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }

// ── Cache helpers ──────────────────────────────────────
async function cached(key, fetcher, ttl = 60000) {
  if (cache[key] && Date.now() - cache[key].t < ttl) return cache[key].v;
  const v = await fetcher();
  if (v !== null && v !== undefined) cache[key] = { v, t: Date.now() };
  return v;
}
function clearCache(prefix) { for (const k of Object.keys(cache)) { if (k.startsWith(prefix)) delete cache[k]; } }

function setTopbar(title, sub, actionsHtml) {
  const t = document.getElementById('tb-title'), s = document.getElementById('tb-sub'), a = document.getElementById('tb-actions');
  if (t) t.textContent = title;
  if (s) s.textContent = sub || '';
  if (a) a.innerHTML = actionsHtml || '';
}

async function loadTab(tab) {
  const meta = NAV.find(n => n[0] === tab);
  setTopbar(meta ? meta[1] : 'PaceForge', meta ? meta[3] : '', '');
  const page = document.getElementById('page-content');
  if (!page) return;
  page.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    switch (tab) {
      case 'today': await renderToday(page); break;
      case 'home': await renderToday(page); break;  // legacy deep-links
      case 'fitness': await renderFitness(page); break;
      case 'plan': await renderPlan(page); break;
      case 'calendar': await renderCalendar(page); break;
      case 'settings': await renderSettings(page); break;
      case 'coach': await renderCoach(page); break;
      case 'hyrox': await renderHyroxPage(page); break;   // via Fitness → HYROX
      case 'bike': await renderBikeTab(page); break;
      default: page.innerHTML = emptyState('Coming soon', '');
    }
  } catch (e) {
    page.innerHTML = emptyState('Failed to load', escHtml(e.message));
  }
}

async function renderToday(page) {
  const [fitness, plan, events, weekly, syncStatus, activities, rpeData, profile, analytics, dailyBrief, calItems, analysesIdx] = await Promise.all([
    cached('fitness', () => loadJSON('fitness.json').catch(() => null)),
    planStore.get().catch(() => null),
    loadJSON('events.json').catch(() => []),
    loadJSON('weekly.json').catch(() => ({})),
    loadSyncStatus(),
    cached('activities', () => apiJson('/activities').catch(() => [])),
    loadJSON('rpe.json').catch(() => ({ entries: [] })),
    loadJSON('profile.json').catch(() => ({})),
    cached('analytics', () => apiJson('/profile/analytics').catch(() => null)),
    loadJSON('daily-brief.json').catch(() => null),
    loadJSON('calendar.json').catch(() => []),
    fetch('api/analyses', { headers: JSON_HDR }).then(r => r.ok ? r.json() : []).catch(() => []),
  ]);

  setTopbar('Today', new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
    `${syncChipHtml(syncStatus)}
     <button class="btn btn-ghost btn-sm" id="td-coach">${icons.spark} Ask Coach</button>
     <button class="btn btn-primary btn-sm" id="td-sync">${icons.sync} Sync Garmin</button>`);

  const f = fitness || {};
  const rd = (f.load || {}).readiness_composite || {};
  const band = rd.band || '';
  const bandColor = band === 'low' ? 'var(--rose)' : band === 'moderate' ? 'var(--amber)' : 'var(--emerald)';
  const iw = (f.load || {}).illness_watch || {};
  const iwColor = iw.level === 'alert' ? 'var(--rose)' : 'var(--amber)';
  const iwRow = (iw.level === 'watch' || iw.level === 'alert') ? `
      <div style="margin-top:10px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb, ${iwColor} 12%, transparent);font-size:.8rem;color:${iwColor}">
        <b>${iw.level === 'alert' ? 'Illness alert' : 'Illness watch'}</b> — ${escHtml((iw.signals || []).map(s => s.replace(/_/g, ' ')).join(', '))}. ${iw.level === 'alert' ? 'Skip intensity until signals clear.' : 'Overnight signals off baseline — recheck tomorrow.'}
      </div>` : '';

  // ── Today's (or next) session — DATE-sorted across plan + calendar items.
  // (The old array-order scan showed a workout two days out while the coach
  // brief talked about today's run — the two cards contradicted each other.)
  const todayISO = new Date().toISOString().slice(0, 10);
  let sessionCard = '';
  let todaysWo = null, todaysIdx = null, todaysItem = null;
  const cands = [];
  if (plan && plan.accepted) {
    (plan.weeks || []).forEach((week, wk) => (week.workouts || []).forEach((w, wo) => {
      if (w.workout_type !== 'rest' && w.scheduled_date >= todayISO) {
        cands.push({ date: w.scheduled_date, kind: 'plan', w, idx: [wk, wo] });
      }
    }));
  }
  for (const it of (calItems || [])) {
    if (it.date >= todayISO && !it.completed) {
      cands.push({ date: it.date, kind: 'item', it });
    }
  }
  cands.sort((a, b) => a.date.localeCompare(b.date) ||
    (a.kind === 'plan' ? -1 : 1));   // same day: the run leads, the class follows
  const lead = cands[0] || null;
  if (lead && lead.kind === 'plan') { todaysWo = lead.w; todaysIdx = lead.idx; }
  else if (lead) { todaysItem = lead.it; }
  if (todaysWo) {
    const isToday = todaysWo.scheduled_date === todayISO;
    const dist = todaysWo.estimated_distance_meters ? (todaysWo.estimated_distance_meters / 1000).toFixed(1) + ' km' : '';
    const dur = todaysWo.estimated_duration_seconds ? '~' + Math.round(todaysWo.estimated_duration_seconds / 60) + ' min' : '';
    const why = (todaysWo.briefing && todaysWo.briefing.purpose) || todaysWo.description || '';
    sessionCard = `<div class="card" style="border-left:3px solid var(--emerald)">
      <div class="card-h"><div class="card-title"><span class="ico">${icons.run}</span>${isToday ? "Today's session" : `Next session · ${todaysWo.scheduled_date}`}</div>
        ${todaysWo.completed ? `<span class="chip" style="background:var(--emerald-d);color:var(--emerald)">${icons.check} done</span>` : ''}</div>
      <div style="font-size:1.25rem;font-weight:800;margin-bottom:4px">${escHtml(todaysWo.name || 'Workout')}</div>
      <div style="font-size:.84rem;color:var(--text-2)">${escHtml((todaysWo.workout_type || '').replace(/_/g, ' '))}${dist ? ' · ' + dist : ''}${dur ? ' · ' + dur : ''}</div>
      ${why ? `<div style="font-size:.88rem;color:var(--text-2);line-height:1.55;margin-top:10px">${escHtml(why)}</div>` : ''}

      ${(todaysWo.steps || []).length ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-size:.85rem;color:var(--text-2);padding:6px 0">Step-by-step breakdown</summary>${stepListHtml(todaysWo)}</details>` : ''}
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-primary" id="td-open-wo" style="min-height:44px">Open workout</button>
        <button class="btn btn-outline" id="td-goto-plan" style="min-height:44px">Full plan</button>

  } else if (todaysItem) {

      <div class="card-h"><div class="card-title"><span class="ico">${icons.run}</span>${isToday ? "Today's session" : `Next up · ${todaysItem.date}`}</div></div>
      <div style="font-size:1.25rem;font-weight:800;margin-bottom:4px">${escHtml(todaysItem.title || todaysItem.sport)}</div>
      <div style="font-size:.84rem;color:var(--text-2)">${escHtml(todaysItem.sport)} · ~${todaysItem.duration_min} min</div>
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn btn-outline" id="td-goto-cal" style="min-height:44px">Open calendar</button></div>
    </div>`;
  } else {
    sessionCard = `<div class="card">${emptyState('Nothing scheduled', plan ? 'Enjoy the rest day — recovery is training.' : 'Create a plan from your goal — Plan tab.', icons.plan)}</div>`;
  }

  // ── Done today — every activity done today (Garmin + app-recorded rides) ──
  const doneToday = (activities || []).filter(a => String(a.start_time || '').slice(0, 10) === todayISO);
  if (doneToday.length) {
    const rows = doneToday.map((a, i) => {
      const b = a.bike;
      const stats = b
        ? [formatSeconds(a.duration_seconds), b.np != null ? 'NP ' + Math.round(b.np) + 'W' : null,
           b.tss != null ? 'TSS ' + Math.round(b.tss) : null].filter(Boolean).join(' · ')
        : [a.distance_meters ? (a.distance_meters / 1000).toFixed(1) + ' km' : null,
           a.duration_seconds ? formatSeconds(a.duration_seconds) : null,
           a.avg_hr ? a.avg_hr + ' bpm' : null].filter(Boolean).join(' · ');
      return `<div class="feed-row" data-done-act="${i}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-s);cursor:pointer">
        <div><div style="font-weight:600;font-size:.88rem">${b ? '🚴' : '🏃'} ${escHtml(a.name || a.activity_type || 'Activity')}</div>
        <div style="font-size:.8rem;color:var(--text-2);margin-top:2px">${stats}</div></div>
        <span style="color:var(--text-3)">${icons.chevron || '›'}</span></div>`;
    }).join('');
    sessionCard += `<div class="card"><div class="card-h"><div class="card-title"><span class="ico">${icons.check}</span>Done today</div></div>${rows}</div>`;
  }

  // ── Readiness gauge ──
  const readinessCard = `<div class="card">
    <div class="card-h"><div class="card-title"><span class="ico">${icons.heart}</span>Readiness</div></div>
    <div style="display:flex;align-items:center;gap:18px">
      <div style="font-family:var(--font-m);font-weight:800;font-size:2.6rem;color:${bandColor}">${rd.score != null ? Math.round(rd.score) : '—'}</div>
      <div>
        <div style="font-weight:700;color:${bandColor};text-transform:capitalize">${band || 'unknown'}</div>
        ${rd.dominant_driver ? `<div style="font-size:.82rem;color:var(--text-2);margin-top:3px">Driver: ${escHtml(rd.dominant_driver)}</div>` : ''}
        <div style="font-size:.78rem;color:var(--text-3);margin-top:3px">${band === 'low' ? 'Easy day — the hard work waits.' : band === 'moderate' ? 'Train, but keep quality honest.' : 'Green light for quality.'}</div>
        ${iwRow}
      </div>
    </div>
    ${(f.insights && f.insights.verdict) ? `<div style="margin-top:12px;padding:9px 11px;border-radius:9px;background:color-mix(in srgb, ${SEV_COLOR[f.insights.verdict.band] || 'var(--text-2)'} 10%, transparent);font-size:.83rem">
      <b>Today's call:</b> ${escHtml(f.insights.verdict.action)}
      <button class="btn-link" data-jump-fitness style="margin-left:6px">Why? →</button>
    </div>` : ''}
    <div id="td-vitals-row" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px"></div>
  </div>`;

  // ── Race countdown ──
  const nextEvent = (events || []).filter(e => e.date >= todayISO).sort((a, b) => a.date.localeCompare(b.date))[0];
  const eventCard = nextEvent ? (() => {
    const days = Math.ceil((Date.parse(nextEvent.date) - Date.parse(todayISO)) / 86400e3);
    return `<div class="card">
      <div class="card-h"><div class="card-title"><span class="ico">${icons.hyrox}</span>Next race</div></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div style="font-family:var(--font-m);font-weight:800;font-size:2.2rem;color:var(--sky)">${days}<span style="font-size:.9rem;color:var(--text-3)"> days</span></div>
        <div><div style="font-weight:700">${escHtml(nextEvent.name || nextEvent.type || 'Race')}</div>
        <div style="font-size:.82rem;color:var(--text-2)">${nextEvent.date}${nextEvent.goal_time ? ' · goal ' + escHtml(String(nextEvent.goal_time)) : ''}</div></div>
      </div>
    </div>`;
  })() : '';

  // ── RPE check-in: most recent activity (48h) without a rating ──
  let pending = {};
  try { pending = JSON.parse(localStorage.getItem(RPE_PENDING_KEY) || '{}'); } catch {}
  const rated = new Set((rpeData.entries || []).map(e => e.activity_id).filter(Boolean));
  Object.keys(pending).forEach(k => rated.add(Number(k)));
  const cutoff48 = new Date(Date.now() - 48 * 3600e3).toISOString();
  const unrated = (activities || []).find(a => a.start_time >= cutoff48 && !rated.has(a.activity_id));
  const rpeCard = unrated ? `<div class="card">
    <div class="card-h"><div class="card-title"><span class="ico">${icons.edit}</span>How hard was it?</div></div>
    <div style="font-size:.88rem;margin-bottom:2px"><b>${escHtml(unrated.name || unrated.activity_type)}</b> · ${formatTimeAgo(unrated.start_time)}</div>
    ${rpeSelectorHtml(unrated.activity_id, null)}
  </div>` : '';

  // ── Daily vitals strip (health snapshot for the day) ──
  const p = profile || {};
  const sleepDur = p.sleep_duration_seconds
    ? `${Math.floor(p.sleep_duration_seconds / 3600)}h${String(Math.round(p.sleep_duration_seconds % 3600 / 60)).padStart(2, '0')}` : '';
  const deepPct = p.sleep_duration_seconds && p.sleep_deep_seconds
    ? Math.round(p.sleep_deep_seconds / p.sleep_duration_seconds * 100) : null;
  const snap = (analytics || {}).snapshot || {};
  const vitals = [
    { label:'Sleep', value: p.sleep_score ?? '—', unit: sleepDur ? ' · ' + sleepDur : '', sub: deepPct != null ? `deep ${deepPct}% (13–23% ideal)` : '', accent:'var(--sky)', accentD:'var(--sky-d)' },
    { label:'HRV', value: p.hrv_last_night ?? '—', unit: p.hrv_last_night != null ? 'ms' : '', sub: p.hrv_status || '', accent:'var(--emerald)', accentD:'var(--emerald-d)' },
    { label:'Body Battery', value: p.body_battery_current ?? '—', unit:'', sub: p.stress_avg != null ? 'Stress avg · ' + p.stress_avg : '', accent:'var(--amber)', accentD:'var(--amber-d)' },
    { label:'Resting HR', value: p.resting_hr ?? '—', unit: p.resting_hr != null ? 'bpm' : '', sub: p.training_status || '', accent:'var(--rose)', accentD:'var(--rose-d)' },
    { label:'VO₂max', value: p.vo2_max ?? '—', unit:'', sub: snap.vdot != null ? 'VDOT ' + snap.vdot.toFixed(1) : '', accent:'var(--violet)', accentD:'var(--violet-d)' },
  ];

  // ── Coach's morning read (daily-brief.json, written by the daily job) ──
  let briefCard = '';
  if (dailyBrief && dailyBrief.headline) {
    const isToday = dailyBrief.date === todayISO;
    const section = (title, md) => md ? `
      <div class="eyebrow" style="margin:12px 0 4px">${title}</div>
      <div style="font-size:.87rem;line-height:1.55;color:var(--text-2)">${formatMarkdown(md)}</div>` : '';
    briefCard = `<div class="card" style="${isToday ? '' : 'opacity:.7'}">
      <div class="card-h"><div class="card-title"><span class="ico">${icons.spark}</span>Coach's morning read</div>
        ${isToday ? '' : `<span class="chip" style="color:var(--text-3)">from ${escHtml(dailyBrief.date || '')}</span>`}</div>
      <div style="font-size:.98rem;font-weight:700;line-height:1.45">${escHtml(dailyBrief.headline)}</div>
      ${section('Your body today', dailyBrief.body_state)}
      ${section("Today's session", dailyBrief.session)}
      ${section('The last few days', dailyBrief.recent)}
      ${(dailyBrief.focus || []).length ? `
        <div class="eyebrow" style="margin:12px 0 4px">Focus</div>
        <ul style="margin:0 0 0 18px;font-size:.87rem;color:var(--text-2)">
          ${dailyBrief.focus.map(f => `<li style="margin-bottom:4px">${escHtml(f)}</li>`).join('')}</ul>` : ''}
      ${(dailyBrief.pulses || []).map(p => `
        <div style="margin-top:12px;padding:10px 12px;border-left:3px solid var(--sky);background:var(--elevated);border-radius:var(--r-sm)">
          <div class="eyebrow" style="margin-bottom:4px">Day pulse · ${escHtml(formatTimeAgo(p.at))}</div>
          <div style="font-size:.87rem;line-height:1.55;color:var(--text-2)">${escHtml(p.text)}</div>
        </div>`).join('')}
    </div>`;
  }

  // ── This week: one 7-day strip built from plan + calendar + done work ──
  const monday = (() => { const d = new Date(); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; })();
  const strip = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const ds = d.toISOString().slice(0, 10);
    const dayActs = (activities || []).filter(a => String(a.start_time || '').slice(0, 10) === ds);
    let planned = null;
    if (plan && plan.accepted) {
      for (const week of plan.weeks || []) for (const w of week.workouts || []) {
        if (w.scheduled_date === ds && w.workout_type !== 'rest') { planned = w; break; }
      }
    }
    const item = (calItems || []).find(it => String(it.date) === ds);
    const done = dayActs.length || (planned && planned.completed) || (item && item.completed);
    const label = planned ? (planned.name || '').split(' ').slice(0, 2).join(' ')
      : item ? (item.title || item.sport) : (dayActs[0] ? (dayActs[0].name || '') : '');
    const color = planned ? colorForWorkout(planned.workout_type) : item ? 'var(--violet)' : dayActs.length ? 'var(--emerald)' : 'var(--border)';
    strip.push(`<div data-week-day="${ds}" style="flex:1;min-width:0;text-align:center;padding:8px 2px;border-radius:10px;cursor:pointer;${ds === todayISO ? 'background:var(--elevated);box-shadow:inset 0 0 0 1px var(--border)' : ''}">
      <div style="font-size:.68rem;color:var(--text-3);text-transform:uppercase">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</div>
      <div style="font-size:1rem;font-weight:700;margin:2px 0;color:${done ? 'var(--emerald)' : 'var(--text)'}">${done ? '✓' : d.getDate()}</div>
      <div style="height:4px;border-radius:2px;background:${color};margin:0 6px"></div>
      <div style="font-size:.62rem;color:var(--text-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(label)}</div>
    </div>`);
  }
  const weekNo = (plan && plan.accepted && (plan.weeks || []).find(w => (w.workouts || []).some(x => x.scheduled_date >= todayISO))) || null;
  const weekStrip = `<div class="card">
    <div class="card-h"><div class="card-title"><span class="ico">${icons.calendar}</span>This week${weekNo ? ` · W${weekNo.week_number} ${escHtml(weekNo.phase || '')}` : ''}</div>
      ${weekNo && weekNo.focus ? `<span style="font-size:.74rem;color:var(--text-3)">${escHtml(weekNo.focus)}</span>` : ''}</div>
    <div style="display:flex;gap:2px">${strip.join('')}</div>
  </div>`;

  page.innerHTML = `<div class="fade-in">
    <div class="dash-grid">
    <div class="span-12">${sessionCard}</div>
    ${briefCard ? `<div class="span-12">${briefCard}</div>` : ''}
    <div class="span-7">${readinessCard}</div>
    <div class="span-5">${weekStrip}${eventCard || ''}</div>
    ${rpeCard ? `<div class="span-7">${rpeCard}</div>` : ''}
    <div class="span-12">${recentActivitiesCard((activities || []).slice(0, 3), analysesIdx)}</div>
  </div></div>`;
  // Vitals as compact chips inside Readiness (tap → Fitness) — the five giant
  // stat cards were the "too much info" complaint's biggest offender.
  const chipRow = document.getElementById('td-vitals-row');
  if (chipRow) {
    chipRow.innerHTML = vitals.map(v => `<span style="display:inline-flex;align-items:baseline;gap:4px;padding:6px 10px;border-radius:999px;background:var(--elevated);border:1px solid var(--border-s);font-size:.74rem;color:var(--text-3)">${v.label}
      <b style="color:${v.accent};font-size:.85rem">${v.value}${v.unit || ''}</b></span>`).join('');
    chipRow.style.cursor = 'pointer';
    chipRow.title = 'Open Fitness for the full picture';
    chipRow.addEventListener('click', () => goTab('fitness'));
  }
  page.querySelectorAll('[data-week-day]').forEach(el =>
    el.addEventListener('click', () => goTab('calendar')));
  on('td-goto-cal', 'click', () => goTab('calendar'));

  on('td-coach', 'click', () => openCoachModal());
  on('td-sync', 'click', e => syncFromGarmin(e.currentTarget));
  on('sync-chip', 'click', () => goTab('settings'));
  on('td-goto-plan', 'click', () => goTab('plan'));
  bindActivityRows(page, activities);
  page.querySelectorAll('[data-done-act]').forEach(el =>
    el.addEventListener('click', () => openActivity(doneToday[Number(el.dataset.doneAct)])));
  bindWeekJump(page);
  if (todaysWo) on('td-open-wo', 'click', () => showWorkoutSheet(todaysWo, todaysIdx[0], todaysIdx[1]));
  if (unrated) {
    bindRpeSelector(page, {
      date: String(unrated.start_time).slice(0, 10),
      durationMin: unrated.duration_seconds ? Math.round(unrated.duration_seconds / 60 * 10) / 10 : null,
    });
  }
}

function statCard(s) {
  return `<div class="stat" style="--accent:${s.accent};--accent-d:${s.accentD}">
    <div class="stat-label">${s.label}</div>
    <div class="stat-value">${s.value}${s.unit ? `<span class="unit">${s.unit}</span>` : ''}</div>
    ${s.sub ? `<div class="stat-sub"><span class="chip"><span class="dotmark"></span>${escHtml(s.sub)}</span></div>` : ''}
  </div>`;
}

function recentActivitiesCard(activities, analysesIdx) {
  const heads = {};
  for (const a of analysesIdx || []) heads[a.id] = a.headline;
  const recent = (activities || []).slice(0, 6);
  let rows = '';
  if (recent.length) {
    rows = `<div class="divlist">${recent.map((act, i) => activityRow(act, i, heads[String(act.activity_id)])).join('')}</div>`;
  } else {
    rows = emptyState('No activities yet', 'Sync from Garmin to populate your feed.', icons.run);
  }
  return `<div class="card" style="height:100%">
    <div class="card-h">
      <div class="card-title"><span class="ico">${icons.run}</span>Recent Activity</div>
      <button class="btn-link" data-jump-cal>Calendar →</button>
    </div>
    ${rows}
  </div>`;
}

function activityRow(act, i, coachLine) {
  const isRun = (act.activity_type || '').toLowerCase().includes('run');
  const color = isRun ? 'var(--emerald)' : 'var(--violet)';
  const distKm = act.distance_meters ? (act.distance_meters / 1000).toFixed(1) : null;
  const pace = act.avg_pace_sec_per_km ? formatPace(act.avg_pace_sec_per_km) + '/km'
            : (isRun && distKm && act.duration_seconds ? formatPace(act.duration_seconds / (act.distance_meters/1000)) + '/km' : '');
  const when = act.start_time ? formatTimeAgo(act.start_time) : '';
  return `<div class="act-item" data-act-idx="${i}">
    <div class="act-icon" style="color:${color}">${isRun ? icons.run : icons.dumbbell}</div>
    <div class="act-info">
      <div class="act-name">${escHtml(act.name || act.activity_type || 'Activity')}</div>
      <div class="act-meta">${when}${pace ? ' · ' + pace : ''}${act.avg_hr ? ' · ' + Math.round(act.avg_hr) + ' bpm' : ''}</div>
      ${coachLine ? `<div style="font-size:.78rem;color:var(--sky);margin-top:3px;line-height:1.35">✦ ${escHtml(coachLine.length > 110 ? coachLine.slice(0, 110) + '…' : coachLine)}</div>` : ''}
    </div>
    <div class="act-stat">
      <div class="v">${distKm != null ? distKm : (act.duration_seconds ? formatSeconds(act.duration_seconds) : '—')}</div>
      <div class="l">${distKm != null ? 'km' : 'time'}</div>
    </div>
  </div>`;
}

function bindActivityRows(page, activities) {
  page.querySelectorAll('[data-act-idx]').forEach(el => {
    el.addEventListener('click', () => {
      const act = (activities || [])[+el.dataset.actIdx];
      if (act) openActivity(act);
    });
  });
}
function bindWeekJump(page) {
  page.querySelectorAll('[data-jump-cal]').forEach(el => el.addEventListener('click', () => goTab('calendar')));
  page.querySelectorAll('[data-jump-plan]').forEach(el => el.addEventListener('click', () => goTab('plan')));
  page.querySelectorAll('[data-jump-fitness]').forEach(el => el.addEventListener('click', () => goTab('fitness')));
}

function woColor(type) {
  const c = { easy_run:'var(--emerald)', recovery_run:'var(--text-3)', tempo:'var(--amber)', threshold:'var(--amber)', long_run:'var(--sky)', intervals:'var(--rose)', speed:'var(--rose)', race_pace:'var(--violet)', fartlek:'var(--sky)', hyrox_mixed:'var(--violet)', cross_training:'var(--text-2)', rest:'var(--text-3)' };
  return c[type] || 'var(--text-2)';
}
function currentWeekIndex(plan) {
  const weeks = plan.weeks || [];
  const today = new Date().toISOString().slice(0,10);
  for (let i = 0; i < weeks.length; i++) {
    const dates = (weeks[i].workouts || []).map(x => x.scheduled_date).filter(Boolean);
    if (dates.some(d => d >= today)) return i;
  }
  return 0;
}

// ═══════════════════════════════════════════════════════
// VIEW: FITNESS (sub-sections — renderers preserved)
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
// VIEW: COACH — everything the coach writes, one tap from anywhere
// ═══════════════════════════════════════════════════════
async function renderCoach(page) {
  const [dailyBrief, weekly, fitness, analysesIdx, activities] = await Promise.all([
    loadJSON('daily-brief.json').catch(() => null),
    loadJSON('weekly.json').catch(() => null),
    cached('fitness', () => loadJSON('fitness.json').catch(() => null)),
    fetch('api/analyses', { headers: JSON_HDR }).then(r => r.ok ? r.json() : []).catch(() => []),
    cached('activities', () => apiJson('/activities').catch(() => [])),
  ]);
  setTopbar('Coach', 'Briefs, reviews and every session analysis',
    `<button class="btn btn-ghost btn-sm" id="co-ask">${icons.spark} Ask Coach</button>`);

  const actById = {};
  for (const a of activities || []) actById[String(a.activity_id)] = a;

  let briefHtml = '';
  if (dailyBrief && dailyBrief.headline) {
    const section = (title, md) => md ? `
      <div class="eyebrow" style="margin:12px 0 4px">${title}</div>
      <div style="font-size:.87rem;line-height:1.55;color:var(--text-2)">${formatMarkdown(md)}</div>` : '';
    briefHtml = `<div class="card">
      <div class="card-h"><div class="card-title"><span class="ico">${icons.spark}</span>Daily brief · ${escHtml(dailyBrief.date || '')}</div></div>
      <div style="font-size:.95rem;font-weight:700;line-height:1.45">${escHtml(dailyBrief.headline)}</div>
      ${section('Your body today', dailyBrief.body_state)}
      ${section("Today's session", dailyBrief.session)}
      ${section('The last few days', dailyBrief.recent)}
      ${(dailyBrief.pulses || []).map(p => `
        <div style="margin-top:10px;padding:10px 12px;border-left:3px solid var(--sky);background:var(--elevated);border-radius:var(--r-sm)">
          <div class="eyebrow" style="margin-bottom:4px">Day pulse · ${escHtml(formatTimeAgo(p.at))}</div>
          <div style="font-size:.86rem;line-height:1.5;color:var(--text-2)">${escHtml(p.text)}</div>
        </div>`).join('')}
    </div>`;
  }

  let weeklyHtml = '';
  if (weekly && (weekly.headline || weekly.content_md)) {
    weeklyHtml = `<div class="card">
      <div class="card-h"><div class="card-title"><span class="ico">${icons.fitness}</span>Week review</div>
        ${weekly.compliance_pct != null ? `<span class="chip">${weekly.compliance_pct}% on plan</span>` : ''}</div>
      ${weekly.headline ? `<div style="font-size:.95rem;font-weight:700;line-height:1.45;margin-bottom:6px">${escHtml(weekly.headline)}</div>` : ''}
      ${(weekly.limiters || []).length ? `<div class="eyebrow" style="margin:10px 0 4px">Limiters</div>
        <ul style="margin:0 0 0 18px;font-size:.85rem;color:var(--text-2)">${weekly.limiters.map(l => `<li style="margin-bottom:3px">${escHtml(typeof l === 'string' ? l : l.text || JSON.stringify(l))}</li>`).join('')}</ul>` : ''}
      ${weekly.content_md ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-size:.85rem;color:var(--text-2);padding:6px 0">Full review</summary>
        <div style="font-size:.87rem;line-height:1.6;color:var(--text-2)">${formatMarkdown(weekly.content_md)}</div></details>` : ''}
    </div>`;
  }

  const rows = (analysesIdx || []).slice(0, 30).map(a => {
    const act = actById[a.id] || null;
    const when = act ? String(act.start_time).slice(0, 10) : (a.id.startsWith('bike:') ? a.id.slice(5, 15) : '');
    const name = act ? (act.name || act.activity_type) : (a.id.startsWith('bike:') ? 'Bike ride' : a.id.startsWith('hyrox-') ? 'HYROX race review' : 'Activity ' + a.id);
    return `<div class="feed-row" data-an-id="${escHtml(a.id)}" style="display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--border-s);cursor:pointer;min-height:44px">
      <div style="display:flex;justify-content:space-between;gap:10px"><b style="font-size:.88rem">${escHtml(name)}</b><span style="font-size:.76rem;color:var(--text-3);white-space:nowrap">${when}</span></div>
      <div style="font-size:.8rem;color:var(--text-2);line-height:1.4">${escHtml(a.headline)}</div>
    </div>`;
  }).join('');
  const analysesHtml = `<div class="card">
    <div class="card-h"><div class="card-title"><span class="ico">${icons.run}</span>Session analyses</div>
      <span style="font-size:.74rem;color:var(--text-3)">${(analysesIdx || []).length} written</span></div>
    ${rows || `<div class="empty" style="border:none;padding:20px 0">Analyses appear here after each synced session.</div>`}
  </div>`;

  page.innerHTML = `<div class="fade-in"><div class="dash-grid">
    ${briefHtml ? `<div class="span-7">${briefHtml}</div>` : ''}
    <div class="span-5">${weeklyHtml}${fitness ? renderCoachTake(fitness) : ''}</div>
    ${fitness ? `<div class="span-12">${renderInsightsPanel(fitness)}</div>` : ''}
    <div class="span-12">${analysesHtml}</div>
  </div></div>`;

  on('co-ask', 'click', () => openCoachModal());
  page.querySelectorAll('[data-an-id]').forEach(el => el.addEventListener('click', async () => {
    const id = el.dataset.anId;
    const act = actById[id];
    if (act) { openActivity(act); return; }
    // No activity object (hyrox reviews, pruned history): show the markdown inline.
    try {
      const md = await loadText('analyses/' + id + '.md');
      openModal(`<div class="modal-h"><div class="modal-title">Coach analysis</div>
        <button class="modal-close" data-close>${icons.x}</button></div>
        <div style="font-size:.88rem;line-height:1.6">${formatMarkdown(md)}</div>`, true);
    } catch { toast('err', 'Analysis not found', ''); }
  }));
}

async function renderFitness(page) {
  const [analytics, fitness] = await Promise.all([
    cached('analytics', () => apiJson('/profile/analytics').catch(() => null)),
    cached('fitness', () => loadJSON('fitness.json').catch(() => null)),
  ]);
  if (!analytics && !fitness) {
    page.innerHTML = `<div class="fade-in">${emptyState('No analytics data', 'Sync from Garmin first.', icons.fitness)}</div>`;
    return;
  }
  const subTabs = [
    ['engine', 'Engine'], ['durability', 'Durability'], ['recovery', 'Recovery'],
    ['strength', 'Strength'], ['form', 'Form'], ['economy', 'Economy'], ['races', 'Races'], ['hyrox_p', 'HYROX'],
  ];
  let activeSub = 'engine';

  function draw() {
    page.innerHTML = `<div class="fade-in">
      ${fitness ? renderInsightsPanel(fitness) : ''}
      ${fitness ? renderCoachTake(fitness) : ''}
      <div class="sub-tabs">${subTabs.map(([id,l]) => `<button class="sub-tab ${activeSub===id?'active':''}" data-sub="${id}">${l}</button>`).join('')}</div>
      <div id="fitness-content"></div>
    </div>`;
    page.querySelectorAll('.sub-tab').forEach(b => b.addEventListener('click', () => {
      activeSub = b.dataset.sub;
      page.querySelectorAll('.sub-tab').forEach(x => x.classList.toggle('active', x.dataset.sub === activeSub));
      drawContent();
    }));
    drawContent();
  }
  function drawContent() {
    const el = document.getElementById('fitness-content');
    if (!el) return;
    el.className = '';
    switch (activeSub) {
      case 'engine': el.innerHTML = fitness ? renderEngine(fitness) : emptyState('No data', ''); break;
      case 'durability': el.innerHTML = fitness ? renderDurability(fitness) : emptyState('No data', ''); break;
      case 'recovery': el.innerHTML = fitness ? renderRecovery(fitness) : emptyState('No data', ''); break;
      case 'strength': el.innerHTML = fitness ? renderStrength(fitness) : emptyState('No data', ''); bindBenchmarkForm(el, draw); break;
      case 'form': el.className = ''; el.innerHTML = fitness ? renderForm(fitness) : emptyState('No data', ''); break;
      case 'economy': el.className = 'grid cols-auto'; el.innerHTML = renderEconomy(analytics); break;
      case 'races': el.className = 'grid cols-auto'; el.innerHTML = renderRaces(analytics); break;
      case 'hyrox_p': el.className = 'grid cols-auto'; el.innerHTML =
        `<div class="span-12" style="margin-bottom:10px"><button class="btn btn-outline btn-sm" data-tab="hyrox">Full HYROX page — races &amp; splits →</button></div>`
        + renderHyroxProfile(analytics); el.querySelector('[data-tab]')?.addEventListener('click', () => goTab('hyrox')); break;
    }
  }
  draw();
}

// ── Fitness 2.0 renderers (consume data/fitness.json) ──────────────────────
const _GRADE_COLOR = { strong: 'var(--emerald)', good: 'var(--emerald)', moderate: 'var(--amber)',
  developing: 'var(--amber)', weak: 'var(--rose)', too_hard: 'var(--rose)', too_much_mid: 'var(--rose)',
  needs_work: 'var(--rose)', high: 'var(--amber)', low: 'var(--amber)' };
function gradeColor(g) { return _GRADE_COLOR[(g || '').toLowerCase()] || 'var(--text-2)'; }
function paceOrDash(sec) { return sec ? formatPace(sec) + '/km' : '—'; }
function metricCard(label, value, sub, accent) {
  return `<div class="fx-metric"><div class="fx-m-label">${label}</div><div class="fx-m-val" style="${accent ? `color:${accent}` : ''}">${value}</div>${sub ? `<div class="fx-m-sub">${sub}</div>` : ''}</div>`;
}
function fxCard(title, icon, body) {
  return `<div class="card mb"><div class="card-h"><div class="card-title"><span class="ico">${icon || icons.fitness}</span>${title}</div></div>${body}</div>`;

// ── Daily insights panel: verdict + freshness + the "do this" list ──
const SEV_COLOR = { red: 'var(--rose)', amber: 'var(--amber)', green: 'var(--emerald)', info: 'var(--sky)' };

function freshnessChip(ins) {
  if (!ins || ins.data_age_hours == null) return '';
  const h = ins.data_age_hours;
  const label = h < 1 ? 'synced <1 h ago' : h < 24 ? `synced ${Math.round(h)} h ago` : `synced ${Math.round(h / 24)} d ago`;
  const color = ins.stale ? 'var(--text-3)' : 'var(--emerald)';
  return `<span class="conn-status" style="background:${color}22;color:${color}"><span class="dotmark"></span>${label}${ins.stale ? ' · stale' : ''}</span>`;
}

function renderInsightsPanel(f) {
  const ins = f.insights;
  if (!ins || !ins.verdict) return '';

        <div class="hint" style="margin-top:2px">${escHtml(i.evidence)}</div>

    <div style="display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb, ${vColor} 10%, transparent);margin-bottom:${items ? '10px' : '0'}">
      <span style="margin-top:5px;width:10px;height:10px;border-radius:50%;background:${vColor};flex:none"></span>
      <div>
        <div style="font-weight:700;font-size:.92rem">${escHtml(v.headline)}</div>
        <div style="font-size:.86rem;color:var(--text-2);margin-top:2px">${escHtml(v.action)}</div>
