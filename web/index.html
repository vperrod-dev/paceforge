      </div>
    </div>
    ${items}
    ${ins.stale ? `<div class="hint" style="margin-top:8px">Data is more than 36 h old — colours may not reflect this morning. Sync first.</div>` : ''}
  </div>`;
}

// ── Form: cadence vs coach target, recovery HR, contact/vertical trends ──
function renderForm(f) {
  const fm = f.form || {};
  if (!fm.available) return emptyState('No form data yet', 'Sync a few runs first.', icons.run);
  const cad = fm.cadence || {}, rec = fm.recovery_hr || {}, gct = fm.gct_ms || {}, vr = fm.vert_ratio || {};
  const cadSeries = (fm.series || []).map(r => r.cadence);
  const cadColor = cad.current == null ? 'var(--text-2)'
    : cad.current >= cad.target_lo ? 'var(--emerald)'
    : cad.current >= cad.target_lo - 8 ? 'var(--amber)' : 'var(--rose)';
  const trendTxt = (t, unit, goodUp) => t == null ? '' :
    `<span style="color:${t === 0 ? 'var(--text-3)' : (t > 0) === goodUp ? 'var(--emerald)' : 'var(--rose)'}">${t > 0 ? '+' : ''}${t}${unit} / 4wk</span>`;
  const recSeries = (rec.series || []).map(s => s.hrr60_best);
  return `<div class="dash-grid">
    <div class="span-12"><div class="card">
      <div class="card-h"><div class="card-title"><span class="ico">${icons.run}</span>Cadence — the project</div>
        <span class="chip">coach target ${cad.target_lo}–${cad.target_hi} spm</span></div>
      <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:8px">
        <span style="font-family:var(--font-m);font-weight:800;font-size:2.2rem;color:${cadColor}">${cad.current ?? '—'}</span>
        <span style="color:var(--text-3);font-size:.85rem">spm, last 3 runs</span>
        ${trendTxt(cad.trend_28d, ' spm', true)}
      </div>
      ${miniChart(cadSeries, { color: cadColor, band: [cad.target_lo, cad.target_hi], height: 150, fmt: v => Math.round(v) })}
      <div class="hint" style="margin-top:6px">Teal band = the coach's current prescription (also live on your watch). Quicker, shorter steps — the band moves up as you consolidate.</div>
    </div></div>
    <div class="span-6"><div class="card" style="height:100%">
      <div class="card-h"><div class="card-title"><span class="ico">${icons.heart}</span>Recovery HR</div></div>
      <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:8px">
        <span style="font-family:var(--font-m);font-weight:800;font-size:2rem;color:var(--sky)">${rec.current_best_avg ?? '—'}</span>
        <span style="color:var(--text-3);font-size:.85rem">bpm drop in 60s after efforts</span>
        ${trendTxt(rec.trend_28d, '', true)}
      </div>
      ${miniChart(recSeries, { color: 'var(--sky)', height: 120, fmt: v => Math.round(v) })}
      <div class="hint" style="margin-top:6px">Best 60-second HR drop per session (runs AND classes). Bigger = fitter; a shrinking number under normal training is an early fatigue flag.</div>
    </div></div>
    <div class="span-6"><div class="card" style="height:100%">
      <div class="card-h"><div class="card-title"><span class="ico">${icons.fitness}</span>Mechanics</div></div>
      <div class="fx-grid">
        ${metricCard('Ground contact', gct.current != null ? Math.round(gct.current) + ' ms' : '—', gct.trend_28d != null ? (gct.trend_28d > 0 ? '+' : '') + gct.trend_28d + ' ms / 4wk (down = better)' : '', gct.trend_28d != null && gct.trend_28d < 0 ? 'var(--emerald)' : 'var(--text-2)')}
        ${metricCard('Vertical ratio', vr.current != null ? vr.current + ' %' : '—', vr.trend_28d != null ? (vr.trend_28d > 0 ? '+' : '') + vr.trend_28d + ' % / 4wk (down = better)' : '', vr.trend_28d != null && vr.trend_28d < 0 ? 'var(--emerald)' : 'var(--text-2)')}
        ${metricCard('Stride length', (fm.stride_m || {}).current != null ? fm.stride_m.current + ' m' : '—', 'outcome of cadence x pace — not a goal itself', 'var(--text-2)')}
      </div>
      <div class="hint" style="margin-top:8px">Contact time and vertical ratio fall naturally as cadence rises — they confirm the cadence work is landing, no separate drills needed.</div>
    </div></div>
  </div>`;
}

function renderCoachTake(f) {

    <div class="lim-row">
      <div class="lim-rank">${i + 1}</div>
      <div style="min-width:0">
        <div class="lim-name">${escHtml(l.name)} <span class="lim-area">${escHtml(l.area)}</span></div>

function _trendChart(series, key, opts) {
  const vals = (series || []).map(p => p[key]);
  if (vals.filter(v => v != null).length < 2) return '<div class="hint">Not enough history yet.</div>';
  return miniChart(vals, opts);
}

function renderEngine(f) {
  const r = f.running || {};
  const cs = r.critical_speed || {}, ef = r.efficiency_factor || {}, vv = r.vvo2max || {};
  const an = f.strength && f.strength.anaerobic_capacity || {};
  const csCard = cs.available ? fxCard('Critical Speed & reserve', icons.spark, `
    <div class="fx-grid">
      ${metricCard('Critical Speed', paceOrDash(cs.cs_pace_sec_per_km), `${cs.cs_mps} m/s · ${cs.confidence} conf`, 'var(--sky)')}
      ${metricCard("Anaerobic reserve D′", (cs.d_prime_m != null ? Math.round(cs.d_prime_m) + ' m' : '—'), 'burst above CS')}
      ${metricCard('vVO2max', paceOrDash(vv.pace_sec_per_km), vv.source || '')}
      ${cs.cp_available ? metricCard('Critical Power', (cs.cp_watts ? Math.round(cs.cp_watts) + ' W' : '—'), "W′ " + (cs.w_prime_j ? Math.round(cs.w_prime_j/1000) + ' kJ' : '—')) : ''}
    </div>
    <div class="hint" style="margin-top:8px">CS is your true sustainable speed — the master endurance number. R²=${cs.r2 ?? '—'}.</div>`) : '';
  const efCard = ef.available ? fxCard('Efficiency Factor (are you getting fitter?)', icons.fitness, `
    <div class="fx-grid">
      ${metricCard('EF now', ef.current ?? '—', 'speed per heartbeat')}
      ${metricCard('Trend', (ef.trend_per_week > 0 ? '↑ improving' : ef.trend_per_week < 0 ? '↓ declining' : 'flat'), `${ef.n} easy runs`, ef.trend_per_week > 0 ? 'var(--emerald)' : 'var(--text-2)')}
    </div>
    ${_trendChart(ef.series, 'ef', { color: 'var(--emerald)', fmt: v => v.toFixed(2) })}`) : '';
  const anCard = an.anaerobic_te_sessions_28d != null ? fxCard('Anaerobic stimulus', icons.spark, `
    <div class="fx-grid">
      ${metricCard('Hard sessions / 28d', an.anaerobic_te_sessions_28d, 'TE-anaerobic ≥ 3')}
      ${metricCard('Signal', (an.signal || '—').replace(/_/g, ' '), '', an.signal === 'under-stimulated' ? 'var(--rose)' : 'var(--emerald)')}
    </div>`) : '';
  return (csCard + efCard + anCard) || emptyState('Engine metrics need more run detail', 'They appear after a sync.');
}

function renderDurability(f) {
  const r = f.running || {};
  const dec = r.decoupling || {}, comp = r.compromised_run || {}, hrr = r.hrr || {},
        idist = r.intensity_distribution || {}, pac = r.pacing || {}, raceFade = (f.strength || {}).compromised_run_race || {};
  const decCard = dec.available ? fxCard('Aerobic decoupling', icons.heart, `
    <div class="fx-grid">
      ${metricCard('Avg decoupling', (dec.average_pct != null ? dec.average_pct + '%' : '—'), '<5% = strong base', gradeColor(dec.grade))}
      ${metricCard('Latest', (dec.latest_pct != null ? dec.latest_pct + '%' : '—'), `${dec.n} steady runs`)}
      ${metricCard('Grade', dec.grade || '—', '', gradeColor(dec.grade))}
    </div>
    <div class="hint" style="margin-top:8px">How much efficiency fades within a run — the durability signature.</div>`) : '';
  const fadePct = raceFade.available ? raceFade.fade_pct : comp.mean_fade_pct;
  const fadeGrade = raceFade.available ? raceFade.grade : comp.grade;
  const compCard = (fadePct != null) ? fxCard('Compromised running (fade under fatigue)', icons.run, `
    <div class="fx-grid">
      ${metricCard('Run fade', fadePct + '%', raceFade.available ? 'across the 8 HYROX runs' : 'within a session', gradeColor(fadeGrade))}
      ${metricCard('Grade', (fadeGrade || '—').replace(/_/g, ' '), '', gradeColor(fadeGrade))}
    </div>
    <div class="hint" style="margin-top:8px">The single biggest HYROX determinant — holding pace as you tire.</div>`) : '';
  const distCard = idist.available ? fxCard('Training intensity (80/20)', icons.fitness, `
    ${hrZoneLikeBar('Easy (Z1–2)', idist.low_pct, 'var(--emerald)')}
    ${hrZoneLikeBar('Moderate (Z3)', idist.mid_pct, 'var(--amber)')}
    ${hrZoneLikeBar('Hard (Z4–5)', idist.high_pct, 'var(--rose)')}
    <div class="hint" style="margin-top:8px">Target ≈ 80% easy, minimal Z3. You're <b style="color:${gradeColor(idist.adherence)}">${(idist.adherence || '').replace(/_/g, ' ')}</b> over ${Math.round(idist.total_minutes || 0)} min.</div>`) : '';
  const hrrCard = hrr.available ? fxCard('Heart-rate recovery', icons.heart, `
    <div class="fx-grid">
      ${metricCard('Best HRR60', (hrr.best_hrr60 != null ? hrr.best_hrr60 + ' bpm' : '—'), '>30 = strong', gradeColor(hrr.grade))}
      ${metricCard('Pacing', (pac.tendency || '—'), pac.mean_ratio ? 'ratio ' + pac.mean_ratio : '', pac.tendency === 'positive' ? 'var(--rose)' : 'var(--emerald)')}
    </div>`) : '';
  const curves = r.pace_curves || {};
  const curveCard = curves.available ? fxCard('Pace curve — fresh vs fatigued', icons.run, `
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="padding:5px 8px;text-align:left;font-size:.72rem;color:var(--text-3)">Duration</th>
        <th style="padding:5px 8px;text-align:right;font-size:.72rem;color:var(--text-3)">Best (90d)</th>
        <th style="padding:5px 8px;text-align:right;font-size:.72rem;color:var(--text-3)">Fatigued (>${curves.fatigue_onset_min}min in)</th>
        <th style="padding:5px 8px;text-align:right;font-size:.72rem;color:var(--text-3)">Fatigue cost</th>
      </tr></thead><tbody>
      ${(curves.durations || []).filter(d => curves.recent_90d[d]).map(d => {
        const cost = (curves.fatigue_cost_pct || {})[d];
        const costCol = cost == null ? 'var(--text-3)' : cost <= 3 ? 'var(--emerald)' : cost <= 8 ? 'var(--amber)' : 'var(--rose)';
        return `<tr>
          <td style="padding:5px 8px;font-size:.82rem">${d < 60 ? d + 's' : (d / 60) + ' min'}</td>
          <td style="padding:5px 8px;font-family:var(--font-m);font-size:.82rem;text-align:right">${formatPace(curves.recent_90d[d])}/km</td>
          <td style="padding:5px 8px;font-family:var(--font-m);font-size:.82rem;text-align:right;color:var(--text-2)">${curves.fatigued_90d[d] ? formatPace(curves.fatigued_90d[d]) + '/km' : '—'}</td>
          <td style="padding:5px 8px;font-family:var(--font-m);font-size:.82rem;text-align:right;font-weight:600;color:${costCol}">${cost != null ? '+' + cost + '%' : '—'}</td>
        </tr>`;
      }).join('')}
      </tbody></table></div>
    <div class="hint" style="margin-top:8px">Best pace held for each duration over the last 90 days (${curves.runs_used} runs). The fatigued column only counts efforts starting deep into a session — your compromised-running capacity. Small gaps = durable engine.</div>`) : '';
  const ev = r.effective_vo2max || {};
  const evCard = ev.available ? fxCard('Effective VO₂max (what your runs imply)', icons.spark, `
    <div class="fx-grid">
      ${metricCard('Current', ev.current ?? '—', 'per-run, conditions-adjusted', 'var(--sky)')}
      ${metricCard('Trend', (ev.trend_per_week > 0.05 ? '↑ improving' : ev.trend_per_week < -0.05 ? '↓ declining' : 'flat'), `${ev.n} runs · ${ev.window_weeks}w`, ev.trend_per_week > 0.05 ? 'var(--emerald)' : ev.trend_per_week < -0.05 ? 'var(--rose)' : 'var(--text-2)')}
    </div>
    ${_trendChart(ev.series, 'ewma', { color: 'var(--sky)', fmt: v => v.toFixed(1) })}
    <div class="hint" style="margin-top:6px">Estimated from pace-vs-HR on every ordinary run (heat-adjusted). The trend matters more than the number — it blends fitness with running economy.</div>`) : '';
  return (curveCard + evCard + decCard + compCard + distCard + hrrCard) || emptyState('Durability metrics need run time-series', 'They appear after a sync.');
}
function hrZoneLikeBar(label, pct, color) {
  pct = pct || 0;
  return `<div class="zrow"><div class="zlbl" style="width:120px">${label}</div><div class="ztrack"><div class="zfill" style="width:${Math.max(pct, 1)}%;background:${color}"></div></div><div class="zval">${Math.round(pct)}%</div></div>`;
}

function benchmarkForm(f) {

function bindBenchmarkForm(container, redraw) {
  const btn = container.querySelector('#bm-save');
  if (!btn) return;
  btn.addEventListener('click', () => withBusy(btn, 'Saving…', async () => {
    const fields = ['wall_balls_max', 'sandbag_lunges_max', 'row_500m_sec', 'ski_500m_sec', 'station_60s_reps', 'bodyweight_kg'];
    const bm = {};
    fields.forEach(id => { const v = container.querySelector('#bm-' + id)?.value; if (v !== '' && v != null) bm[id] = Number(v); });
    try { localStorage.setItem(BENCHMARKS_KEY, JSON.stringify(bm)); } catch {}
    const status = container.querySelector('#bm-status');
    status.textContent = 'Saving…';
    const res = await fetch(`${API}/repos/${REPO}/actions/workflows/save-benchmarks.yml/dispatches`,
      { method: 'POST', headers: JSON_HDR, body: JSON.stringify({ inputs: { data: JSON.stringify(bm) } }) });
    if (!res.ok && res.status !== 204) throw new Error(await jobError(res));
    status.innerHTML = 'Saved — building your strength assessment (~1–2 min). Reload the page after that to see it.';
  }));
}

let planSelectedWeek = null;

let planDispatchedAt = 0;   // set when Create/Reassess is clicked, for instant feedback
async function renderPlan(page) {
  const active = await planStore.get().catch(() => null);

  // Live build progress takes over the Plan page whenever a run is active —
  // whether or not a plan already exists, and instantly after you click Build.
  const bs = await planBuildStatus();
  const building = (bs && (bs.status === 'in_progress' || bs.status === 'queued'))
                   || (Date.now() - planDispatchedAt < 120000);
  if (building) {
    const mins = bs && bs.created ? Math.max(0, Math.round((Date.now() - new Date(bs.created)) / 60000)) : 0;
    setTopbar('Plan', 'Building your plan…', '');
    page.innerHTML = `<div class="fade-in"><div class="card card-pad" style="margin-top:8px;text-align:center">
      <div class="spinner" style="width:22px;height:22px;margin:0 auto 12px"></div>
      <div style="font-weight:700;font-size:1.05rem">Building your plan${mins ? ` — ${mins} min in` : '…'}</div>
      ${planStageList((bs && bs.steps) || [])}
      <div class="hint" style="margin-top:12px">Live — this updates itself as each stage finishes. Takes a few minutes.</div>
      ${bs ? `<a class="btn-link" href="${bs.url}" target="_blank" rel="noopener">Watch the full log →</a>` : ''}
    </div></div>`;
    setTimeout(async () => {
      if (state.tab !== 'plan') return;
      await planStore.reset();
      planSelectedWeek = null;
      loadTab('plan');
    }, 9000);
    return;
  }

  if (!active || !active.weeks || !active.weeks.length) {
    const st = await planBuildStatus();
    const building = st && (st.status === 'in_progress' || st.status === 'queued');
    let banner = '';
    if (building) {
      const mins = st.created ? Math.max(0, Math.round((Date.now() - new Date(st.created)) / 60000)) : 0;
      banner = `<div class="card card-pad" style="margin-top:18px;text-align:center">
        <div style="font-weight:600">Building your plan — ${mins} min in</div>
        ${planStageList(st.steps || [])}
        <div class="hint" style="margin-top:10px">Live progress; this page updates itself as each stage completes.</div>
        <a class="btn-link" href="${st.url}" target="_blank" rel="noopener">Watch the full log →</a></div>`;
    } else if (st && st.conclusion === 'failure') {
      banner = `<div class="card card-pad" style="margin-top:18px;text-align:center;color:var(--rose,#e11d48)">
        <div style="font-weight:600">Last plan build failed</div>
        <a class="btn-link" href="${st.url}" target="_blank" rel="noopener">See the error →</a></div>`;
    }
    page.innerHTML = `<div class="fade-in">${emptyState('No training plan yet', 'Tell us your goal and your times — the engine builds a periodized plan from them, and the coach personalises it.', icons.plan)}
      <div style="text-align:center;margin-top:18px"><button class="btn btn-primary" id="plan-create">${icons.spark} Create running plan</button></div>
      ${banner}</div>`;
    on('plan-create', 'click', () => openCreatePlanModal());
    if (building) setTimeout(async () => {
      if (state.tab !== 'plan') return;
      await planStore.reset();          // cache-bust: pull the fresh plan.json once the run commits
      planSelectedWeek = null;
      loadTab('plan');
    }, 9000);
    return;
  }

  const weeks = active.weeks || [];
  if (planSelectedWeek == null) planSelectedWeek = currentWeekIndex(active);

  setTopbar('Plan', `${escHtml(active.name || 'Training Plan')} · ${active.total_weeks || weeks.length} weeks`,
    `<button class="btn btn-primary btn-sm" id="plan-create">${icons.spark} Create Plan</button>
     <button class="btn btn-ghost btn-sm" id="plan-reassess">${icons.spark} Reassess</button>
     <button class="btn btn-ghost btn-sm" id="plan-edit-paces">${icons.edit} Edit Paces</button>
     <button class="btn btn-outline btn-sm" id="plan-export">${icons.download} Export</button>
     <button class="btn btn-outline btn-sm" id="plan-garmin-delete">Delete from Garmin</button>
     <button class="btn btn-outline btn-sm" id="plan-reset">Reset</button>`);

  page.innerHTML = `<div class="fade-in">
    ${planHeaderHtml(active)}
    <div id="pace-insights"></div>
    <div class="week-nav" id="week-nav">
      ${weeks.map((w, i) => `<button class="week-btn ${i===planSelectedWeek?'active':''}" data-week="${i}" title="${escHtml(w.focus || '')}">W${i+1}<small>${escHtml(w.phase || '')}</small></button>`).join('')}
    </div>
    <div id="week-info"></div>
    <div id="week-content"></div>
  </div>`;

  on('plan-create', 'click', () => openCreatePlanModal());
  on('plan-reassess', 'click', e => reassessPlan(e.currentTarget));

  // Pace-insights chip (fitness.json → pace_status): engine proposes, athlete accepts.
  cached('fitness', () => loadJSON('fitness.json').catch(() => null)).then(f => {
    const pi = f && f.pace_insights;
    const el = document.getElementById('pace-insights');
    if (!el || !pi) return;
    const cfg = {
      'on-point': { color: 'var(--emerald)', label: 'Pace on point',
        desc: `Your last ${pi.sessions} quality sessions landed inside their windows.` },
      'ahead': { color: 'var(--sky)', label: 'Ahead of your paces', action: 0.5, btn: 'Accept faster paces',
        desc: `${pi.ahead}/5 recent quality sessions ran faster than the window at honest effort — accept a +0.5 VDOT recalibration (future weeks only)?` },
      'review': { color: 'var(--amber)', label: 'Paces may be too hot', action: -0.5, btn: 'Ease paces',
        desc: `${pi.slow}/5 recent quality sessions came in slower than the window — ease training paces by 0.5 VDOT?` },
    }[pi.status];
    if (!cfg) return;
    el.innerHTML = `<div class="card card-pad-sm" style="margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="conn-status" style="background:color-mix(in srgb,${cfg.color} 15%,transparent);color:${cfg.color}"><span class="dotmark"></span>${cfg.label}</span>
      <span style="font-size:.82rem;color:var(--text-2);flex:1;min-width:200px">${escHtml(cfg.desc)}</span>
      ${cfg.action ? `<button class="btn btn-outline btn-sm" id="pace-recal">${cfg.btn}</button>` : ''}
    </div>`;
    if (cfg.action) on('pace-recal', 'click', e => dispatchWorkflow('recalibrate.yml',
      { delta: String(cfg.action) }, 'Recalibration started',
      'Future weeks re-target once the workflow commits; the plan view refreshes on the next Pages build.', e.currentTarget));
  });
  on('plan-edit-paces', 'click', () => openPaceEditor());
  on('plan-export', 'click', () => { planStore.export(); toast('ok', 'Exported', 'plan.json downloaded.'); });
  on('plan-garmin-delete', 'click', e => deleteFromGarmin(e.currentTarget));
  on('plan-reset', 'click', () => confirmResetPlan());

  page.querySelector('.week-btn.active')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  page.querySelectorAll('.week-btn').forEach(btn => btn.addEventListener('click', () => {
    planSelectedWeek = +btn.dataset.week;
    page.querySelectorAll('.week-btn').forEach(b => b.classList.toggle('active', b === btn));
    drawWeek(active);
  }));

  drawWeek(active);
}

function planHeaderHtml(p) {
  return `<div class="card" style="margin-bottom:18px">
    <div class="card-h">
      <div>
        <div class="card-title" style="font-size:1.15rem">${escHtml(p.name || 'Training Plan')}</div>
        <div style="font-size:.82rem;color:var(--text-2);margin-top:5px">
          ${p.goal_type ? escHtml(p.goal_type) : ''}${p.target_date ? ' · Target ' + p.target_date : ''}${p.target_time_seconds ? ' · Goal ' + formatSeconds(p.target_time_seconds) : ''}
        </div>
      </div>
      ${p.vdot != null ? `<div style="text-align:right"><div class="eyebrow">VDOT</div><div style="font-family:var(--font-m);font-weight:700;font-size:1.4rem;color:var(--emerald)">${p.vdot.toFixed(1)}</div></div>` : ''}
    </div>
    <div class="pace-grid">
      ${paceItem('Easy', p.easy_pace)}${paceItem('Marathon', p.marathon_pace)}${paceItem('Threshold', p.threshold_pace)}${paceItem('Interval', p.interval_pace)}${paceItem('Repetition', p.repetition_pace)}
    </div>
    ${p.pace_source ? `<div style="font-size:.74rem;color:var(--text-3);margin-top:12px">Paces from ${escHtml(p.pace_source)}</div>` : ''}
    ${p.intake ? `<div style="font-size:.74rem;color:var(--text-3);margin-top:4px">Built from your intake: ${escHtml([
      p.intake.recent_race_distance && p.intake.recent_race_seconds ? `${p.intake.recent_race_distance} ${fmtHms(p.intake.recent_race_seconds)}` : '',
      p.intake.current_weekly_km ? `${p.intake.current_weekly_km} km/wk` : '',
      (p.intake.training_days || []).length ? `${p.intake.training_days.length} days/wk` : '',
      p.intake.experience_level || '',
    ].filter(Boolean).join(' · '))}</div>` : ''}
    ${p.rationale ? `<div style="font-size:.84rem;color:var(--text-2);line-height:1.55;margin-top:12px;border-top:1px solid var(--border-s);padding-top:12px">${escHtml(p.rationale)}</div>` : ''}
    ${p.athlete_summary ? `<details style="margin-top:8px"><summary style="cursor:pointer;font-size:.8rem;color:var(--text-3)">Athlete summary the coach worked from</summary><div style="font-size:.82rem;color:var(--text-2);line-height:1.5;margin-top:6px">${escHtml(p.athlete_summary)}</div></details>` : ''}
    ${(p.tips || []).length ? `<div class="eyebrow" style="margin:12px 0 4px">Coach's tips for this block</div>
      <ul style="margin:0 0 0 18px;font-size:.84rem;color:var(--text-2)">${p.tips.map(t => `<li style="margin-bottom:4px">${escHtml(t)}</li>`).join('')}</ul>` : ''}

function paceItem(label, secPerKm) {
  if (!secPerKm) return '';
  return `<div class="pace-item"><div class="pl">${label}</div><div class="pv">${formatPace(secPerKm)}<span class="u">/km</span></div></div>`;
}

function drawWeek(plan) {
  const wi = planSelectedWeek;
  const w = (plan.weeks || [])[wi];
  if (!w) return;
  // Rest days are intentionally hidden — the athlete cross-trains, not rests. Keep the
  // original index so toggle/open addressing (wkIdx:woIdx) still points at the right workout.
  const planned = (w.workouts || []).map((wo, woIdx) => ({ wo, woIdx }))
    .filter(({ wo }) => wo.workout_type !== 'rest');
  const infoEl = document.getElementById('week-info');
  if (infoEl) {
    const done = planned.filter(({ wo }) => wo.completed).length;
    // Week compliance: % of scored (past) sessions that landed green.
    const scored = planned.filter(({ wo }) => wo.completion_metrics && CM_BANDS[wo.completion_metrics.status]);
    const green = scored.filter(({ wo }) => wo.completion_metrics.status === 'green').length;
    const compliancePct = scored.length ? Math.round(100 * green / scored.length) : null;
    const compColor = compliancePct == null ? '' : compliancePct >= 80 ? 'var(--emerald)' : compliancePct >= 50 ? 'var(--amber)' : 'var(--rose)';
    infoEl.innerHTML = `<div class="card card-pad-sm" style="margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="flex:1;min-width:160px">
        <div class="eyebrow">${escHtml(w.phase || 'Block')}${w.focus ? ' · ' + escHtml(w.focus) : ''}</div>
        <div style="font-size:.84rem;color:var(--text-2);margin-top:4px">${w.total_distance_km ? w.total_distance_km.toFixed(0) + ' km total' : ''} · ${done}/${planned.length} workouts done</div>
        ${w.intro ? `<div style="font-size:.82rem;color:var(--text-3);margin-top:6px;line-height:1.5">${escHtml(w.intro)}</div>` : ''}
      </div>
      ${compliancePct != null ? `<span class="conn-status" style="background:color-mix(in srgb,${compColor} 15%,transparent);color:${compColor}" title="sessions executed as planned (green band)"><span class="dotmark"></span>${compliancePct}% on plan</span>` : ''}
      <button class="btn btn-primary btn-sm" id="push-week">${icons.push} Push Week ${w.week_number || wi+1} to Garmin</button>
      <div class="hint" style="flex-basis:100%;margin-top:2px">Watch settings for structured workouts: auto-lap OFF, auto-pause OFF, audio prompts ON, units = km.</div>
    </div>`;
    on('push-week', 'click', e => pushWeekToGarmin(w.week_number || (wi + 1), e.currentTarget));
  }
  const contentEl = document.getElementById('week-content');
  if (!contentEl) return;
  contentEl.className = 'grid cols-auto';
  contentEl.innerHTML = planned.map(({ wo, woIdx }) => workoutCardHtml(wo, wi, woIdx)).join('') || emptyState('No workouts this week', '', icons.plan);
  contentEl.querySelectorAll('[data-open-wo]').forEach(el => el.addEventListener('click', () => {
    const [wkIdx, woIdx] = el.dataset.openWo.split(':').map(Number);
    showWorkoutSheet(plan.weeks[wkIdx].workouts[woIdx], wkIdx, woIdx);
  }));
  contentEl.querySelectorAll('[data-toggle-wo]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const [wkIdx, woIdx] = el.dataset.toggleWo.split(':').map(Number);
    await planStore.toggleComplete(wkIdx, woIdx);
    const fresh = await planStore.get();
    drawWeek(fresh);
  }));
}

// TrainingPeaks-style plan-vs-actual bands (engine/compliance.py writes these).
const CM_BANDS = {
  green:  { color: 'var(--emerald)', label: 'on plan' },
  yellow: { color: 'var(--amber)',   label: 'off plan' },
  orange: { color: '#f97316',        label: 'way off' },
  red:    { color: 'var(--rose)',    label: 'missed' },
};

function complianceBadge(wo) {
  const cm = wo.completion_metrics;
  const band = cm && CM_BANDS[cm.status];
  if (!band) return '';
  const pct = cm.ratio != null ? Math.round(cm.ratio * 100) + '%' : band.label;
  return `<span class="chip" style="background:color-mix(in srgb,${band.color} 15%,transparent);color:${band.color}" title="plan vs actual: ${band.label}">${pct}</span>`;
}

function complianceHtml(cm) {
  if (!cm || !CM_BANDS[cm.status]) return '';
  const band = CM_BANDS[cm.status];
  if (cm.status === 'red') {
    return `<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:10px">Versus the plan</div>
      <div style="color:${band.color};font-weight:600;font-size:.86rem">Missed — no matching activity</div></div>`;
  }
  const line = (planned, actual, unit) => planned != null || actual != null
    ? `${actual != null ? actual : '—'} of ${planned != null ? planned : '—'} ${unit}` : null;
  const km = line(cm.planned_km, cm.actual_km, 'km');
  const min = line(cm.planned_min, cm.actual_min, 'min');
  return `<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:10px">Versus the plan</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem">
      <span class="chip" style="background:color-mix(in srgb,${band.color} 15%,transparent);color:${band.color}">${cm.ratio != null ? Math.round(cm.ratio * 100) + '% · ' : ''}${band.label}</span>
      ${km ? `<span style="color:var(--text-2)">${km}</span>` : ''}
      ${min ? `<span style="color:var(--text-2)">${min}</span>` : ''}
    </div></div>`;
}

function workoutCardHtml(wo, wkIdx, woIdx) {
  const color = woColor(wo.workout_type);
  const dist = wo.estimated_distance_meters ? (wo.estimated_distance_meters/1000).toFixed(1) + ' km' : '';
  const dur = wo.estimated_duration_seconds ? Math.round(wo.estimated_duration_seconds/60) + ' min' : '';
  return `<div class="card card-pad-sm" style="display:flex;align-items:center;gap:14px">
    <div class="act-bar" style="background:${color};min-height:42px"></div>
    <div class="act-info" data-open-wo="${wkIdx}:${woIdx}" style="cursor:pointer">
      <div class="act-name">${escHtml(wo.name || 'Workout')} ${complianceBadge(wo)}</div>
      <div class="act-meta">${wo.scheduled_date || ''}${dist ? ' · ' + dist : ''}${dur ? ' · ~' + dur : ''}</div>
      ${wo.briefing && wo.briefing.structure
        ? `<div class="act-meta" style="color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px">${escHtml(wo.briefing.structure)}</div>`
        : (wo.purpose ? `<div class="act-meta" style="color:var(--text-3)">${escHtml(wo.purpose.replace(/_/g,' '))}</div>` : '')}
    </div>
    <button class="btn btn-sm ${wo.completed ? 'btn-ghost' : 'btn-outline'}" data-toggle-wo="${wkIdx}:${woIdx}" title="Toggle complete" style="${wo.completed ? 'color:var(--emerald)' : ''}">
      ${wo.completed ? icons.check + ' Done' : 'Mark done'}
    </button>
  </div>`;
}

const BRIEFING_LABELS = [
  ['purpose', 'Why this session'], ['structure', 'Structure'], ['feel', 'How it should feel'],
  ['if_wrong', 'If it goes wrong'], ['cue', 'Form cue'], ['venue', 'Venue'],
  ['fuel', 'Fueling'], ['warmup', 'Warm-up'],
];

function briefingHtml(b) {
  if (!b) return '';
  const rows = BRIEFING_LABELS
    .filter(([k]) => b[k])
    .map(([k, label]) => `<div style="margin-bottom:8px">
      <div class="eyebrow" style="margin-bottom:2px">${label}</div>
      <div style="font-size:.84rem;color:var(--text-2);line-height:1.5">${escHtml(b[k])}</div>
    </div>`).join('');
  return rows ? `<div style="margin:12px 0;border-top:1px solid var(--border-s);padding-top:12px">${rows}</div>` : '';
}

// ═══ Runna-style structured step breakdown (shared: Plan modal, Calendar, Today) ═══
const STEP_META = {
  warmup:   { label: 'Warm up',   color: 'var(--sky)' },
  cooldown: { label: 'Cool down', color: 'var(--sky)' },
  interval: { label: 'Work',      color: 'var(--rose,#f85149)' },
  active:   { label: 'Run',       color: 'var(--emerald)' },
  recovery: { label: 'Recover',   color: 'var(--amber,#d29922)' },
  rest:     { label: 'Rest',      color: 'var(--text-3)' },
};

function stepQtyTxt(s) {
  if (s.distance_meters) {
    return s.distance_meters >= 1000
      ? (s.distance_meters / 1000).toFixed(s.distance_meters % 1000 ? 2 : 0).replace(/\.?0+$/, '') + ' km'
      : Math.round(s.distance_meters) + ' m';
  }
  if (s.duration_seconds) {
    const secs = Math.round(s.duration_seconds);
    if (secs < 60) return secs + ' s';
    return secs % 60 ? Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0') + ' min' : (secs / 60) + ' min';
  }
  return '';
}

function stepTargetTxt(s) {
  if (s.target_low == null) return '';
  const hi = s.target_high && s.target_high !== s.target_low;
  if (s.target_type === 'heart_rate') return Math.round(s.target_low) + (hi ? '–' + Math.round(s.target_high) : '') + ' bpm';
  if (s.target_type === 'power') return Math.round(s.target_low) + (hi ? '–' + Math.round(s.target_high) : '') + ' W';
  // pace targets: low = faster bound (smaller sec/km), show fast–slow
  const a = Math.min(s.target_low, s.target_high || s.target_low);
  const b = Math.max(s.target_low, s.target_high || s.target_low);
  return formatPace(a) + (a !== b ? '–' + formatPace(b) : '') + '/km';
}

function stepRowHtml(s) {
  const meta = STEP_META[s.step_type] || { label: s.step_type || 'Step', color: 'var(--text-3)' };
  const what = s.description && s.description.trim() ? s.description : meta.label;
  return `<div class="stp-row">
    <div class="stp-bar" style="background:${meta.color}"></div>
    <div class="stp-main">
      <div class="stp-kind">${escHtml(meta.label)}</div>
      <div class="stp-what">${escHtml(what)}</div>
    </div>
    <div class="stp-qty">${escHtml(stepQtyTxt(s))}</div>
    <div class="stp-pace">${escHtml(stepTargetTxt(s))}</div>
  </div>`;
}

function stepListHtml(wo) {
  if (!wo.steps || !wo.steps.length) return '';
  let html = `<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:10px">Session breakdown</div>`;
  for (const s of wo.steps) {
    if (s.repeat_count && s.steps && s.steps.length) {
      html += `<div class="stp-block">
        <div class="stp-block-h"><span class="stp-reps">${s.repeat_count} ×</span>
          <span class="stp-block-t">${escHtml((s.description || 'repeat').replace(/^Repeat x\d+$/i, 'repeat'))}</span></div>
        ${s.steps.map(stepRowHtml).join('')}
      </div>`;
    } else {
      html += stepRowHtml(s);
    }
  }
  const bits = [];
  if (wo.estimated_distance_meters) bits.push(`<span>Total <b>${(wo.estimated_distance_meters / 1000).toFixed(1)} km</b></span>`);
  if (wo.estimated_duration_seconds) bits.push(`<span>~<b>${Math.round(wo.estimated_duration_seconds / 60)} min</b></span>`);
  if (wo.cadence_target) bits.push(`<span>Cadence <b>${wo.cadence_target} spm</b></span>`);
  if (bits.length) html += `<div class="stp-total">${bits.join('')}</div>`;
  return html + '</div>';
}

function showWorkoutSheet(wo, wkIdx, woIdx) {
  const dist = wo.estimated_distance_meters ? (wo.estimated_distance_meters/1000).toFixed(1) + ' km' : '';
  const dur = wo.estimated_duration_seconds ? Math.round(wo.estimated_duration_seconds/60) + ' min' : '';
  const stepsHtml = stepListHtml(wo);
  const metricsHtml = complianceHtml(wo.completion_metrics);
  const matchedId = (wo.matched_activity_ids || [])[0];
  const rpeHtml = matchedId ? rpeSelectorHtml(matchedId, wo.user_rpe || null) : '';

  const editable = wkIdx != null && woIdx != null;
  openModal(`
    <div class="modal-h">
      <div>
        <div class="modal-title">${escHtml(wo.name || 'Workout')}</div>
        <div class="modal-sub">${escHtml((wo.workout_type || '').replace(/_/g,' '))}${dist ? ' · ' + dist : ''}${dur ? ' · ~' + dur : ''}</div>
      </div>
      <button class="modal-close" data-close>${icons.x}</button>
    </div>
    ${wo.description ? `<div style="font-size:.88rem;color:var(--text-2);line-height:1.55;margin-bottom:8px">${escHtml(wo.description)}</div>` : ''}
    ${briefingHtml(wo.briefing)}
    ${wo.completion_analysis ? `<div style="margin:10px 0;padding:10px 12px;border-left:3px solid var(--emerald);background:var(--elevated);border-radius:var(--r-sm);font-size:.86rem;line-height:1.5;color:var(--text-2)"><b style="color:var(--text)">How it went:</b> ${escHtml(wo.completion_analysis)}</div>` : ''}
    ${stepsHtml}
    ${metricsHtml}
    ${rpeHtml}
    ${editable ? `
      <div style="margin-top:18px;border-top:1px solid var(--border-s);padding-top:16px">
        <div class="field">
          <label for="wo-date">Reschedule date</label>
          <input type="date" id="wo-date" value="${wo.scheduled_date || ''}" class="mono-input">
        </div>
        <div class="field">
          <label for="wo-note">Note</label>
          <textarea id="wo-note" rows="3">${escHtml(wo.notes || '')}</textarea>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button class="btn ${wo.completed ? 'btn-ghost' : 'btn-outline'}" id="wo-toggle" style="${wo.completed ? 'color:var(--emerald)' : ''}">${wo.completed ? icons.check + ' Completed' : 'Mark complete'}</button>
          <button class="btn btn-outline" id="wo-delete" style="color:var(--rose,#e11d48)">Delete session</button>
          <button class="btn btn-primary" id="wo-save" style="margin-left:auto">Save changes</button>
        </div>
        <div class="hint" style="margin-top:8px">Rescheduling or deleting also updates your Garmin calendar.</div>
      </div>` : (wo.notes ? `<div style="margin-top:12px;font-size:.84rem;color:var(--text-3)">${escHtml(wo.notes)}</div>` : '')}
  `);

  if (matchedId) {
    const modal = document.querySelector('.modal') || document;
    bindRpeSelector(modal, {
      date: wo.scheduled_date,
      durationMin: (wo.completion_metrics && wo.completion_metrics.actual_min) || null,
    });
    // Async-refresh the highlighted pill from rpe.json + the pending cache.
    rpeForActivity(matchedId).then(r => {
      if (!r) return;
      modal.querySelectorAll(`[data-rpe-for="${matchedId}"] [data-rpe]`).forEach(b => {
        b.classList.toggle('btn-primary', Number(b.dataset.rpe) === r);
        b.classList.toggle('btn-outline', Number(b.dataset.rpe) !== r);
      });
    });
  }

  if (editable) {
    on('wo-toggle', 'click', async () => {
      await planStore.toggleComplete(wkIdx, woIdx);
      const fresh = await planStore.get();
      closeModal();
      drawWeek(fresh);
      toast('ok', 'Updated', 'Workout completion toggled.');
    });
    on('wo-save', 'click', async () => {
      const date = val('wo-date');
      const note = document.getElementById('wo-note')?.value || '';
      const moved = date && date !== wo.scheduled_date;
      if (date) await planStore.reschedule(wkIdx, woIdx, date);
      await planStore.setNote(wkIdx, woIdx, note);
      const fresh = await planStore.get();
      closeModal();
      drawWeek(fresh);
      if (moved) calendarSyncSession(wo.session_id, 'reschedule', date);
      else toast('ok', 'Saved', 'Workout updated locally. Export or push to apply.');
    });
    on('wo-delete', 'click', async () => {
      if (!confirm('Delete this session from the plan and your Garmin calendar?')) return;
      await planStore.deleteWorkout(wkIdx, woIdx);
      const fresh = await planStore.get();
      closeModal();
      drawWeek(fresh);
      calendarSyncSession(wo.session_id, 'delete', null);
    });
  }
}

function openPaceEditor() {

    </div>`;

      <div class="modal-h">
        <div><div class="modal-title">Edit Training Paces</div><div class="modal-sub">Stored locally. Export plan.json or push to Garmin to apply.</div></div>
        <button class="modal-close" data-close>${icons.x}</button>
      </div>
      ${row('pace-easy','Easy','easy_pace')}
      ${row('pace-mara','Marathon','marathon_pace')}
      ${row('pace-thr','Threshold','threshold_pace')}

function confirmResetPlan() {

    <div class="modal-h"><div><div class="modal-title">Reset plan?</div><div class="modal-sub">Discards local edits (paces, completions, notes, dates) and reloads the synced ./data/plan.json.</div></div><button class="modal-close" data-close>${icons.x}</button></div>
    <div class="modal-foot"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-danger" id="reset-confirm">Reset to synced</button></div>

}

// ═══════════════════════════════════════════════════════
// VIEW: CALENDAR
// ═══════════════════════════════════════════════════════
// Calendar dots are colour-coded by session type so the month reads at a glance:
// green = easy/recovery, blue = long, amber = tempo/threshold, red = fast (intervals/
// speed/hills/fartlek), violet = cross-training/HYROX, grey = rest.
const WO_COLORS = {
  easy_run:'var(--emerald)', recovery_run:'var(--emerald)', easy_with_strides:'var(--emerald)',
  long_run:'var(--sky)', long_run_progressive:'var(--sky)', long_run_with_race_pace:'var(--sky)', progressive:'var(--sky)',
  tempo:'var(--amber)', threshold:'var(--amber)', race_pace:'var(--amber)',
  intervals:'var(--rose)', speed:'var(--rose)', vo2max:'var(--rose)', fartlek:'var(--rose)', hills:'var(--rose)', strides:'var(--rose)',
  cross_training:'var(--violet)', hyrox_mixed:'var(--violet)',
  rest:'var(--text-3)',
};
const colorForWorkout = t => WO_COLORS[t] || 'var(--sky)';

async function renderCalendar(page) {
  const now = new Date();
  const reopenDate = window.__reopenCalDate || null;
  const reopenD = reopenDate ? new Date(reopenDate + 'T00:00:00') : null;
  let viewYear = reopenD ? reopenD.getFullYear() : now.getFullYear();
  let viewMonth = reopenD ? reopenD.getMonth() : now.getMonth();
  const calEntries = {};

  const [plan, activities, events, calItems] = await Promise.all([
    planStore.get().catch(() => null),
    cached('activities', () => apiJson('/activities').catch(() => [])),
    loadJSON('events.json').catch(() => []),
    loadJSON('calendar.json').catch(() => []),   // first-class items — no plan required
  ]);

  for (const ev of events || []) {
    if (!ev.date) continue;
    (calEntries[ev.date] ||= []).push({
      type: 'event', color: 'var(--rose)',
      title: '🏁 ' + (ev.name || ev.type || 'Event'),
      sub: [ev.type, ev.goal_time ? 'goal ' + ev.goal_time : ''].filter(Boolean).join(' · '),
    });
  }

  // Index activities + which ones a plan workout already claims, so a matched run
  // shows as ONE entry (the workout, opening its actual activity) — not two.
  const actById = {};
  for (const act of activities || []) actById[act.activity_id] = act;
  const matchedIds = new Set();
  if (plan && plan.weeks) {
    for (const w of plan.weeks) for (const wo of (w.workouts || [])) (wo.matched_activity_ids || []).forEach(id => matchedIds.add(id));
  }
  for (const it of calItems || []) (it.matched_activity_ids || []).forEach(id => matchedIds.add(String(id)));

  const todayISOc = new Date().toISOString().slice(0, 10);
  for (const it of calItems || []) {
    if (!it.date) continue;
    if (!it.completed && it.date < todayISOc) continue;   // past unmatched = noise
    (calEntries[it.date] ||= []).push({
      type: 'cal-item', item: it,
      title: (it.completed ? '✓ ' : '○ ') + (it.title || it.sport),
      sub: [it.sport, it.duration_min ? `~${it.duration_min} min` : ''].filter(Boolean).join(' · '),
      color: 'var(--violet)',
      activity: null,   // filled below once actById exists
    });
  }

  for (const act of activities || []) {
    const d = (act.start_time || '').slice(0, 10);
    if (!d || matchedIds.has(act.activity_id) || matchedIds.has(String(act.activity_id))) continue;
    const distKm = act.distance_meters ? (act.distance_meters/1000).toFixed(1) : null;
    const isRun = (act.activity_type || '').toLowerCase().includes('run');
    let sub = '';
    if (isRun && distKm && act.duration_seconds) sub = `${distKm} km · ${formatPace(act.duration_seconds/(act.distance_meters/1000))}/km`;
    else if (distKm) sub = `${distKm} km`;
    (calEntries[d] ||= []).push({ type:'activity', title: act.name || act.activity_type || 'Activity', sub, color: isRun ? 'var(--emerald)' : 'var(--violet)', activity: act });
  }

  for (const dayList of Object.values(calEntries)) {
    for (const e of dayList) {
      if (e.type === 'cal-item' && e.item && (e.item.matched_activity_ids || []).length) {
        e.activity = actById[e.item.matched_activity_ids[0]] || actById[String(e.item.matched_activity_ids[0])] || null;
      }
    }
  }

  const todayISO = new Date().toISOString().slice(0, 10);
  if (plan && plan.accepted) {
    for (const w of plan.weeks || []) {
      for (const wo of w.workouts || []) {
        if (!wo.scheduled_date) continue;
        const matchedAct = (wo.matched_activity_ids || []).map(id => actById[id]).find(Boolean) || null;
        // A past planned workout that wasn't completed is noise next to the actual
        // activities — show planned entries only for today and upcoming days.
        if (!matchedAct && wo.scheduled_date < todayISO) continue;
        const distKm = wo.estimated_distance_meters ? (wo.estimated_distance_meters/1000).toFixed(1) + ' km' : '';
        let sub = [wo.workout_type?.replace(/_/g,' '), distKm].filter(Boolean).join(' · ');
        if (matchedAct && matchedAct.distance_meters && matchedAct.duration_seconds) {
          sub = `${(matchedAct.distance_meters/1000).toFixed(1)} km · ${formatPace(matchedAct.duration_seconds/(matchedAct.distance_meters/1000))}/km`;
        }
        (calEntries[wo.scheduled_date] ||= []).push({
          type: matchedAct ? 'activity' : 'planned',
          title: (wo.completed ? '✓ ' : '○ ') + (wo.name || 'Workout'), sub,
          color: colorForWorkout(wo.workout_type), wo, activity: matchedAct,
          cmStatus: wo.completion_metrics ? wo.completion_metrics.status : null,
        });
      }
    }
  }

  function dayCell(d, ds, todayStr) {
    const entries = calEntries[ds] || [];
    const dots = entries.slice(0, 4).map(e => `<span class="cal-dot" style="background:${e.color}"></span>`).join('');
    // Plan-vs-actual ring: worst band among the day's scored sessions wins.
    const order = ['red', 'orange', 'yellow', 'green'];
    const worst = order.find(s => entries.some(e => e.cmStatus === s));
    const ring = worst ? `style="box-shadow:inset 0 0 0 2px ${CM_BANDS[worst].color}"` : '';
    return `<div class="cal-day ${ds === todayStr ? 'today' : ''}" data-date="${ds}" ${ring}><div class="cal-num">${d}</div><div class="cal-dots">${dots}</div></div>`;
  }

  function drawMonth() {
    const first = new Date(viewYear, viewMonth, 1);
    const last = new Date(viewYear, viewMonth + 1, 0);
    const startDay = (first.getDay() + 6) % 7;  // Monday-first: shift Sun(0)→6
    const monthName = first.toLocaleString('default', { month:'long', year:'numeric' });
    let grid = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="cal-day-label">${d}</div>`).join('');
    const prevLast = new Date(viewYear, viewMonth, 0).getDate();
    for (let i = startDay - 1; i >= 0; i--) grid += `<div class="cal-day other-month"><div class="cal-num">${prevLast - i}</div></div>`;
    const todayStr = new Date().toISOString().slice(0,10);
    for (let d = 1; d <= last.getDate(); d++) {
      const ds = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      grid += dayCell(d, ds, todayStr);
    }
    const remaining = (7 - (startDay + last.getDate()) % 7) % 7;
    for (let i = 1; i <= remaining; i++) grid += `<div class="cal-day other-month"><div class="cal-num">${i}</div></div>`;
    return `<div class="fade-in"><div class="dash-grid"><div class="span-12">
      <div class="card">
        <div class="card-h"><div class="card-title">${monthName}</div><div style="display:flex;gap:8px"><button class="btn-icon" id="cal-prev" aria-label="Previous month">‹</button><button class="btn-icon" id="cal-next" aria-label="Next month">›</button></div></div>
        <div class="cal-grid compact">${grid}</div>
      </div></div>
      <div class="span-12"><div class="card" id="cal-details"><div class="empty" style="border:none;padding:32px 12px">Select a day to see details.</div></div></div>
    </div></div>`;
  }

  const addFormHtml = (ds, mt) => `<div id="extra-form-wrap"><button class="btn btn-ghost btn-block" onclick="showExtraForm()" id="extra-show" style="margin-${mt}:10px">+ Add activity</button>
        <div id="extra-form" style="display:none;padding:14px 0 0">
          <div class="field"><label>Sport</label><input id="ex-sport" list="ex-sport-list" value="Cardio"><datalist id="ex-sport-list"><option>Cardio</option><option>HYROX</option><option>Swim</option><option>Bike</option><option>Gym</option><option>Yoga</option></datalist></div>
          <div class="field"><label>Date</label><input id="ex-date" type="date" value="${ds}"></div>
          <div class="field"><label>Minutes</label><input id="ex-min" type="number" min="1" value="45"></div>
          <div class="field"><label>Name</label><input id="ex-name" placeholder="Training center session"></div>
          <div class="field"><label>Repeat weekly</label><input id="ex-repeat" type="number" min="1" max="52" value="1"><div class="hint">Weeks to schedule (1 = just this one).</div></div>
          <button class="btn btn-ghost" onclick="hideExtraForm()" id="extra-cancel">Cancel</button>
          <button class="btn btn-primary" onclick="saveExtra()" id="extra-save">Save session</button>
        </div></div>`;

  // Render the selected day's entry list into the side panel; clicking an entry swaps
  // the panel for that activity/workout's full detail (inline — no popup).
  function showDay(ds) {
    const details = document.getElementById('cal-details');
    const entries = calEntries[ds] || [];
    const dateLabel = new Date(ds + 'T00:00:00').toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
    if (!entries.length) {
      details.innerHTML = `<div class="card-h"><div class="card-title" style="font-size:.95rem">${dateLabel}</div></div><div class="empty" style="border:none;padding:24px 0">Nothing scheduled.</div>` + addFormHtml(ds, 'bottom');
      return;
    }
    details.innerHTML = `<div class="card-h"><div class="card-title" style="font-size:.95rem">${dateLabel}</div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">` + entries.map((e, i) => `
      <div class="act-item" data-cal-idx="${i}" style="border:1px solid var(--border-s);border-radius:10px;padding:10px 12px"><div class="act-bar" style="background:${e.color}"></div>
        <div class="act-info"><div class="act-name">${escHtml(e.title)}</div>${e.sub ? `<div class="act-meta">${escHtml(e.sub)}</div>` : ''}</div></div>`).join('') + `</div>` + addFormHtml(ds, 'top');
        details.querySelectorAll('[data-cal-idx]').forEach(c => c.addEventListener('click', () => {
          const e = entries[+c.dataset.calIdx];
          if (e.type === 'activity' && e.activity) renderActivityDetail(details, e.activity, { onBack: () => showDay(ds) });
          else if (e.type === 'cal-item' && e.activity) renderActivityDetail(details, e.activity, { onBack: () => showDay(ds) });
          else if (e.type === 'cal-item' && e.item) renderCalItemDetail(details, e.item, ds);
          else if (e.type === 'planned' && e.wo) renderWorkoutDetail(details, e.wo, { onBack: () => showDay(ds) });
        }));
    }
    

  // ── Phone: agenda list, not a dot grid. A month of day rows with the real
  // session names inline; tap an entry for its detail (bottom sheet), tap +
  // to schedule on that day. Desktop keeps the month grid + side panel.
  function drawAgenda() {
    const first = new Date(viewYear, viewMonth, 1);
    const last = new Date(viewYear, viewMonth + 1, 0);
    const monthName = first.toLocaleString('default', { month: 'long', year: 'numeric' });
    const todayStr = new Date().toISOString().slice(0, 10);
    let rows = '';
    for (let d = 1; d <= last.getDate(); d++) {
      const ds = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dt = new Date(viewYear, viewMonth, d);
      const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dt.getDay()];
      const entries = calEntries[ds] || [];
      const isToday = ds === todayStr;
      const past = ds < todayStr;
      const chips = entries.map((e, i) => {
        const ring = e.cmStatus ? `box-shadow:inset 0 0 0 2px ${CM_BANDS[e.cmStatus].color};` : '';
        return `<div data-ag="${ds}:${i}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--elevated);border:1px solid var(--border-s);${ring}cursor:pointer;min-height:44px">
          <div style="width:4px;align-self:stretch;border-radius:2px;background:${e.color}"></div>
          <div style="min-width:0;flex:1">
            <div style="font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(e.title)}</div>
            ${e.sub ? `<div style="font-size:.76rem;color:var(--text-3)">${escHtml(e.sub)}</div>` : ''}
          </div>
          <span style="color:var(--text-3)">›</span>
        </div>`;
      }).join('');
      if (!entries.length && past && !isToday) continue;   // past empty days are noise
      rows += `<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-s);${isToday ? 'background:color-mix(in srgb, var(--emerald) 5%, transparent);margin:0 -8px;padding:8px;border-radius:10px;' : ''}" ${isToday ? 'id="ag-today"' : ''}>
        <div style="flex:0 0 44px;text-align:center;padding-top:8px">
          <div style="font-size:.68rem;color:${isToday ? 'var(--emerald)' : 'var(--text-3)'};text-transform:uppercase;font-weight:700">${wd}</div>
          <div style="font-size:1.15rem;font-weight:800;color:${isToday ? 'var(--emerald)' : past ? 'var(--text-3)' : 'var(--text)'}">${d}</div>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
          ${chips || `<div style="font-size:.78rem;color:var(--text-3);padding:12px 0">—</div>`}
          ${!past || isToday ? `<button data-ag-add="${ds}" style="align-self:flex-start;background:none;border:none;color:var(--text-3);font-size:.76rem;cursor:pointer;padding:4px 0;min-height:32px">+ add</button>` : ''}
        </div>
      </div>`;
    }
    return `<div class="fade-in">
      <div class="card" style="padding:14px">
        <div class="card-h" style="margin-bottom:6px"><div class="card-title">${monthName}</div>
          <div style="display:flex;gap:8px">
            <button class="btn-icon" id="cal-prev" aria-label="Previous month">‹</button>
            <button class="btn-icon" id="cal-today" aria-label="This month" style="width:auto;padding:0 10px;font-size:.78rem">Today</button>
            <button class="btn-icon" id="cal-next" aria-label="Next month">›</button>
          </div></div>
        ${rows}
      </div></div>`;
  }

  function sheetForEntry(e, ds) {
    openModal(`<div class="modal-h"><div class="modal-title">${escHtml(new Date(ds + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }))}</div>
      <button class="modal-close" data-close>${icons.x}</button></div><div id="cal-sheet"></div>`, true);
    const box = document.getElementById('cal-sheet');
    if (e.type === 'activity' && e.activity) renderActivityDetail(box, e.activity, { onBack: closeModal });
    else if (e.type === 'cal-item' && e.activity) renderActivityDetail(box, e.activity, { onBack: closeModal });
    else if (e.type === 'cal-item' && e.item) renderCalItemDetail(box, e.item, ds, { onBack: closeModal });
    else if (e.type === 'planned' && e.wo) renderWorkoutDetail(box, e.wo, { onBack: closeModal });
    else closeModal();
  }

  function sheetForAdd(ds) {
    openModal(`<div class="modal-h"><div class="modal-title">Add activity</div>
      <button class="modal-close" data-close>${icons.x}</button></div>${addFormHtml(ds, 'bottom')}`, true);
    showExtraForm();
  }

  function reDrawAgenda() {
    page.innerHTML = drawAgenda();
    on('cal-prev', 'click', () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } reDrawAgenda(); });
    on('cal-next', 'click', () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } reDrawAgenda(); });
    on('cal-today', 'click', () => { const n = new Date(); viewMonth = n.getMonth(); viewYear = n.getFullYear(); reDrawAgenda(); });
    page.querySelectorAll('[data-ag]').forEach(el => el.addEventListener('click', () => {
      const [ds, i] = el.dataset.ag.split(':');
      const e = (calEntries[ds] || [])[Number(i)];
      if (e) sheetForEntry(e, ds);
    }));
    page.querySelectorAll('[data-ag-add]').forEach(el => el.addEventListener('click', ev => {
      ev.stopPropagation(); sheetForAdd(el.dataset.agAdd);
    }));
    document.getElementById('ag-today')?.scrollIntoView({ block: 'center' });
  }

  function reDraw() {
    if (window.matchMedia('(max-width:1023px)').matches) { reDrawAgenda(); return; }
    page.innerHTML = drawMonth();
    page.querySelectorAll('.cal-day[data-date]').forEach(el => el.addEventListener('click', () => {
      page.querySelectorAll('.cal-day.selected').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      showDay(el.dataset.date);
    }));
    on('cal-prev', 'click', () => { viewMonth--; if (viewMonth<0){viewMonth=11;viewYear--;} reDraw(); });
    on('cal-next', 'click', () => { viewMonth++; if (viewMonth>11){viewMonth=0;viewYear++;} reDraw(); });
    // Auto-open today (or the 1st when browsing another month) so the panel is never empty —
    // unless we just scheduled a session, in which case reopen that day instead.
    const todayStr = new Date().toISOString().slice(0, 10);
    window.__reopenCalDate = null;
    const preselect = (reopenDate && page.querySelector(`.cal-day[data-date="${reopenDate}"]`))
      || page.querySelector(`.cal-day[data-date="${todayStr}"]`)
      || page.querySelector('.cal-day[data-date]');
    if (preselect) { preselect.classList.add('selected'); showDay(preselect.dataset.date); }
  }
  reDraw();
}

async function loadText(file) {
  const res = await fetch('./data/' + file);
  if (!res.ok) throw new Error('not found');
  return res.text();
}

// Scheduled calendar-item detail: reschedule or remove (calendar-edit handles items).
function renderCalItemDetail(container, item, ds, opts) {
  container.innerHTML = `<div class="card-h"><div class="card-title" style="font-size:.95rem">${escHtml(item.title || item.sport)}</div>
      <button class="btn-icon" id="ci-back" aria-label="Back">‹</button></div>
    <div style="font-size:.85rem;color:var(--text-2);margin-bottom:12px">${escHtml(item.sport)} · ~${item.duration_min} min · ${escHtml(String(item.date))}${item.garmin_workout_id ? ' · on Garmin' : ''}</div>
    ${item.notes ? `<div style="font-size:.85rem;color:var(--text-2);margin-bottom:12px">${escHtml(item.notes)}</div>` : ''}
    <div class="field"><label>Move to</label><input type="date" id="ci-date" value="${item.date}"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" id="ci-move">Reschedule</button>
      <button class="btn btn-outline" id="ci-del" style="color:var(--rose)">Remove</button>
    </div>`;
  on('ci-back', 'click', () => (opts && opts.onBack) ? opts.onBack() : renderCalendar(document.getElementById('page-content')));
  on('ci-move', 'click', () => {
    const nd = val('ci-date');
    if (nd && nd !== String(item.date)) calendarSyncSession(item.item_id, 'reschedule', nd);
  });
  on('ci-del', 'click', () => {
    if (confirm('Remove this session (and its Garmin calendar entry)?')) calendarSyncSession(item.item_id, 'delete');
  });
}

window.showExtraForm = function() {
  const form = document.getElementById('extra-form');
  const show = document.getElementById('extra-show');
  if (form && show) { form.style.display = 'block'; show.style.display = 'none'; }
};
window.hideExtraForm = function() {
  const form = document.getElementById('extra-form');
  const show = document.getElementById('extra-show');
  if (form && show) { form.style.display = 'none'; show.style.display = 'block'; }
};
// The runs list's ids are monotonically increasing — use that instead of
// created_at (server-side timestamps truncate to whole seconds, so a
// millisecond-precision "dispatched at" comparison misses ~any dispatch that
// lands in the back half of a second: run.created_at ends up a few hundred ms
// *before* the client's own Date.now(), even though it's the right run).
async function latestJobRunId(workflowFile) {
  try {
    const res = await fetch(`${API}/repos/${REPO}/actions/workflows/${workflowFile}/runs?per_page=1`, { headers: JSON_HDR });
    return res.ok ? (await res.json()).workflow_runs?.[0]?.id ?? 0 : 0;
  } catch { return 0; }
}

// Poll until a NEW run (id > baselineId) for this job reaches "completed" —
// dispatch only acks receipt, not completion.
async function waitForJobRun(workflowFile, baselineId, timeoutMs = 15000) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    try {
      const res = await fetch(`${API}/repos/${REPO}/actions/workflows/${workflowFile}/runs?per_page=1`, { headers: JSON_HDR });
      const run = res.ok ? (await res.json()).workflow_runs?.[0] : null;
      if (run && run.id > baselineId && run.status === 'completed') return run;
    } catch {}
    await new Promise(r => setTimeout(r, 700));
  }
  return null;
}

window.saveExtra = async function() {
  const saveBtn = document.getElementById('extra-save');
  if (!saveBtn) return;
  const date = document.getElementById('ex-date')?.value || '';
  if (!date) { toast('err', 'Pick a date'); return; }
  const weeks = parseInt(document.getElementById('ex-repeat')?.value || '1', 10) || 1;
  const baselineId = await latestJobRunId('add-session.yml');
  // Schedules a real plan workout (not a side note) so the daily/weekly coach
  // sees it and the Garmin matcher links the completed class to it.
  await dispatchWorkflow('add-session.yml', {
    date,
    sport: document.getElementById('ex-sport')?.value || 'Cardio',
    minutes: document.getElementById('ex-min')?.value || '45',
    name: document.getElementById('ex-name')?.value || '',
    repeat_weeks: String(weeks),
  }, 'Scheduling…', 'Waiting for it to land on the calendar.', saveBtn);
